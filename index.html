<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python OA01: el juego del examen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#172033; --muted:#596377; --line:#D3DAE4;
  --u1:#2D62D3; --u2:#B87B00; --u3:#13805A; --u4:#B32F6B; --u5:#172033;
  --ok:#13805A; --ok-bg:#E3F4EC; --bad:#C2352B; --bad-bg:#FBE9E7; --warn-bg:#FFF4D9; --key-bg:#E8EFFC; --idea-bg:#F1ECFA;
  --code-bg:#F2F5F9; --code-ink:#1D2638; --kw:#7637C2; --str:#1A7340; --num:#B0520A; --com:#7A8597; --fn:#2D62D3; --dim:#97A1B2;
  --shadow:0 1px 0 rgba(23,32,51,.06), 0 6px 18px -10px rgba(23,32,51,.25);
  --font:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101826; --surface:#172131; --surface-2:#1D293C; --ink:#E6ECF4; --muted:#9AA7BB; --line:#2B3950;
    --u1:#7AA2FF; --u2:#F1B740; --u3:#4CC793; --u4:#F06BA7; --u5:#E6ECF4;
    --ok:#4CC793; --ok-bg:#163428; --bad:#FF7B70; --bad-bg:#3A1F22; --warn-bg:#352B14; --key-bg:#1C2B4A; --idea-bg:#2A2340;
    --code-bg:#0E1622; --code-ink:#DCE4EF; --kw:#C9A2FF; --str:#8CDCA0; --num:#FFB872; --com:#7D899D; --fn:#86B1FF; --dim:#5E6A7E;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101826; --surface:#172131; --surface-2:#1D293C; --ink:#E6ECF4; --muted:#9AA7BB; --line:#2B3950;
  --u1:#7AA2FF; --u2:#F1B740; --u3:#4CC793; --u4:#F06BA7; --u5:#E6ECF4;
  --ok:#4CC793; --ok-bg:#163428; --bad:#FF7B70; --bad-bg:#3A1F22; --warn-bg:#352B14; --key-bg:#1C2B4A; --idea-bg:#2A2340;
  --code-bg:#0E1622; --code-ink:#DCE4EF; --kw:#C9A2FF; --str:#8CDCA0; --num:#FFB872; --com:#7D899D; --fn:#86B1FF; --dim:#5E6A7E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--u1);outline-offset:2px}
code,pre,textarea.code,.mono{font-family:var(--mono)}
img{max-width:100%}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px 18px 10px}
.brand-row{display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lvl-num{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--surface);font-weight:700;font-size:17px}
.lvl-txt{display:flex;flex-direction:column;line-height:1.2}
.lvl-txt small{color:var(--muted);font-size:12.5px}
.lvl-txt strong{font-size:14.5px}
.xpbar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .5s ease}

.track{display:grid;grid-template-columns:repeat(17,1fr);align-items:center;margin-top:12px;position:relative}
.track .st{position:relative;display:flex;justify-content:center;height:24px;align-items:center}
.track .st::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--seg,var(--line))}
.track .st:first-child::before{left:50%}
.track .st:last-child::before{right:50%}
.track .st svg{position:relative;width:20px;height:20px}
.track .st button{all:unset;cursor:pointer;display:flex;border-radius:50%}
.track-meta{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);margin-top:6px}
.track-meta b{color:var(--ink);font-size:15px}
.units-legend{display:flex;gap:14px;flex-wrap:wrap}
.units-legend span{display:inline-flex;align-items:center;gap:5px}
.units-legend i{width:12px;height:4px;border-radius:2px;background:var(--c)}

/* ---------- layout ---------- */
main{max-width:760px;margin:0 auto;padding:22px 18px 80px}
h1,h2,h3{line-height:1.2;letter-spacing:-.015em;margin:0}
h1{font-size:30px}
h2{font-size:23px}
h3{font-size:19px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;font-size:16px;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.92}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-left:8px;padding-right:8px}
.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 12px;font-size:14.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* ---------- home ---------- */
.hero{display:grid;gap:14px;margin-bottom:30px}
.hero h1{font-size:34px;max-width:18ch}
.hero p{color:var(--muted);max-width:56ch;margin:0}
.next{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);text-align:left;width:100%}
.next:hover{border-color:var(--c)}
.next .t{flex:1;min-width:0}
.next small{color:var(--muted);display:block;font-size:14px}
.next strong{font-size:19px;display:block}
.next .go{font-weight:700;color:var(--c);white-space:nowrap}

.unit{margin:34px 0 0}
.unit-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;padding-left:2px}
.unit-head .tag{color:var(--c);font-weight:700;font-size:15px;white-space:nowrap}
.unit-head h2{font-size:21px}
.line{position:relative;padding-left:0}
.stop{display:grid;grid-template-columns:56px 1fr;gap:6px;position:relative}
.stop::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:5px;background:var(--c);opacity:.95}
.stop.first::before{top:30px}
.stop.last::before{bottom:calc(100% - 30px)}
.stop.locked::before{opacity:.35}
.stop .node{position:relative;z-index:1;display:flex;justify-content:center;padding-top:8px}
.stop .node svg{width:44px;height:44px;background:var(--bg);border-radius:50%}
.stop .card{all:unset;box-sizing:border-box;cursor:pointer;display:block;margin:6px 0 10px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:100%}
.stop .card:hover{border-color:var(--c)}
.stop .card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.stop.locked .card{background:transparent;cursor:not-allowed}
.stop.locked .card:hover{border-color:var(--line)}
.stop .num{color:var(--muted);font-size:13.5px}
.stop .ttl{font-weight:700;font-size:18px;display:block;margin:1px 0 2px}
.stop .sum{color:var(--muted);font-size:15px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--c);border-color:var(--c);color:var(--surface)}
.chip.part{border-color:var(--c);color:var(--ink)}
.exam-stop .card{border-style:dashed}

.tools{margin-top:40px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:22px}
.tools h3{font-size:17px}
.toggle{display:flex;align-items:center;gap:12px;font-size:15.5px}
.switch{position:relative;width:46px;height:26px;border-radius:13px;background:var(--line);border:none;flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{left:23px}
.sync{font-size:13.5px;color:var(--muted)}

/* ---------- topic ---------- */
.crumb{display:flex;align-items:center;gap:6px;margin:-6px 0 14px}
.topic-head{border-left:6px solid var(--c);padding:2px 0 2px 14px;margin-bottom:18px}
.topic-head small{color:var(--c);font-weight:700;font-size:14.5px}
.topic-head h1{font-size:28px;margin-top:2px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.step{all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:9px;min-height:48px}
.step:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.step .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:14px;flex-shrink:0}
.step .l{font-weight:700;font-size:15px;line-height:1.15}
.step .l small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.step.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.step.done .n{background:var(--c);border-color:var(--c);color:var(--surface)}
.step[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;box-shadow:var(--shadow)}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:14.5px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)}
.dots i.cur{background:var(--ink)}
.dots i.bad{background:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}

/* theory content */
.md h2{font-size:24px;margin-bottom:12px}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin:3px 0}
.md strong{font-weight:700}
.md .ic{font-family:var(--mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:0 4px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:var(--surface-2);font-weight:700}
.callout{border-radius:10px;padding:11px 14px 11px 14px;margin:0 0 14px;border-left:4px solid var(--k)}
.callout .ck{font-weight:700;display:block;font-size:14px;color:var(--k);margin-bottom:2px}
.callout.clau{background:var(--key-bg);--k:var(--u1)}
.callout.compte{background:var(--warn-bg);--k:var(--u2)}
.callout.idea{background:var(--idea-bg);--k:var(--kw)}

pre.code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px;overflow-x:auto;font-size:14.5px;line-height:1.55;tab-size:4}
pre.code code{font-family:var(--mono)}
.k{color:var(--kw);font-weight:600}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--com);font-style:italic}.f{color:var(--fn)}.p{color:var(--dim);user-select:none}.o{color:var(--muted)}

/* quiz */
.q-text{font-size:19px;font-weight:700;margin-bottom:12px;line-height:1.35}
.opts{display:grid;gap:9px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface);font-size:16.5px}
.opt:hover{border-color:var(--muted)}
.opt:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.opt .let{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:14px;flex-shrink:0}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .let{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .let{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.sel{border-color:var(--ink)}
.opts.locked .opt{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;border-left:4px solid var(--k)}
.fb.ok{background:var(--ok-bg);--k:var(--ok)}
.fb.no{background:var(--bad-bg);--k:var(--bad)}
.fb .h{font-weight:700;color:var(--k);display:block;margin-bottom:3px}
.ref{all:unset;cursor:pointer;color:var(--fn);font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline-block;margin-top:6px}
.ref:focus-visible{outline:2px solid var(--fn)}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.03em}
.score .msg{font-size:18px;margin:10px 0 4px}
.wronglist{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.wronglist li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15.5px}

/* exercises */
.ex-type{font-size:14px;color:var(--c);font-weight:700}
.ex-title{font-size:21px;margin:2px 0 8px}
.ex-prompt{margin-bottom:12px}
textarea.out,textarea.code{width:100%;min-height:110px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.5;tab-size:4}
textarea.code{min-height:220px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.stdin{font-size:14.5px;margin:-4px 0 12px;color:var(--muted)}
.stdin code{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink);white-space:pre}
input.blank{font-family:var(--mono);font-size:14.5px;background:var(--surface);color:var(--ink);border:1.5px dashed var(--c);border-radius:6px;padding:1px 6px;margin:0 1px;min-width:3ch}
input.blank.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
input.blank.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.lines{list-style:none;margin:0 0 12px;padding:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;counter-reset:ln}
.lines li{display:flex}
.lines button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;padding:3px 12px 3px 0;font-family:var(--mono);font-size:14.5px;white-space:pre;overflow-x:auto}
.lines button:hover{background:var(--surface-2)}
.lines button:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.lines .ln{width:38px;flex-shrink:0;text-align:right;padding-right:12px;color:var(--dim);user-select:none}
.lines .ok{background:var(--ok-bg)}
.lines .no{background:var(--bad-bg)}
.parsons{display:grid;gap:12px}
.parsons h4{margin:0 0 6px;font-size:14.5px;color:var(--muted);font-weight:700}
.pool,.answer{display:grid;gap:6px;min-height:52px;padding:8px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2)}
.answer{border-color:var(--c)}
.pl{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:14.5px;white-space:pre;overflow-x:auto}
.pl.txt{font-family:var(--font);white-space:normal;font-size:16px}
.pl:hover{border-color:var(--c)}
.pl:focus-visible{outline:2px solid var(--c)}
.pl.no{border-color:var(--bad);background:var(--bad-bg)}
.pl.ok{border-color:var(--ok);background:var(--ok-bg)}
.empty{color:var(--muted);font-size:14.5px;padding:6px 4px}
.ee{font-size:15px;margin:0 0 10px}
.checks{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:16px}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex-shrink:0}
.hint{margin-top:12px;background:var(--idea-bg);border-radius:10px;padding:10px 14px;font-size:15.5px}
.tutor{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2);font-size:16px}
.tutor .who{font-weight:700;font-size:14px;color:var(--muted);display:block;margin-bottom:4px}
.tutor pre{background:var(--code-bg);padding:8px 10px;border-radius:8px;overflow-x:auto;font-size:14px}
.tutor-btn{display:none}
body.has-tutor .tutor-btn{display:inline-flex}

/* modal + toasts */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:700px){.scrim{align-items:center}}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;max-width:680px;width:100%;max-height:min(86vh,900px);overflow:auto;padding:20px 20px 16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.modal-top small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;box-shadow:var(--shadow);animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.levelup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,15,25,.55);padding:20px}
.levelup .box{background:var(--surface);border-radius:20px;padding:30px 26px 24px;text-align:center;max-width:380px;width:100%;animation:rise .5s cubic-bezier(.2,.9,.3,1.2)}
.levelup .ring{width:120px;height:120px;margin:0 auto 14px;display:block}
.levelup .ring circle.p{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1s .15s ease forwards}
.levelup h2{font-size:26px;margin:4px 0}
.levelup p{color:var(--muted)}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .levelup .ring circle.p{stroke-dashoffset:0}
}
.hidden{display:none!important}
.gate{max-width:620px;margin:10px auto 0}
.gate h1{font-size:32px;margin-bottom:12px}
.gate > p{color:var(--muted);font-size:17.5px}
.gate-actions{display:grid;gap:10px;margin-top:20px;max-width:420px}
.gbtn{min-height:52px;font-size:17px}
.guide{padding-left:22px;display:grid;gap:8px;font-size:15.5px}
.cloud-chip{gap:6px}
.cloud-chip.ok{color:var(--ok);border-color:var(--ok)}
.cloud-chip.warn{color:var(--bad);border-color:var(--bad)}
.cloud-chip.sync{color:var(--muted)}
.save-btn{position:relative;gap:6px}

.backup-banner{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:15.5px;flex-wrap:wrap}

  .panel{padding:16px 14px 14px;border-radius:12px}
  .track-meta .units-legend{display:none}
  main{padding:18px 12px 70px}
}

<script>
const TOPICS = [{"id":"t1","unit":1,"title":"Qué es programar","summary":"Algoritmo, programa, intérprete y compilador","theory":[{"id":"a","t":"Algoritmo y programa","md":"Imagina que quieres hacer una crema de verduras. Necesitas una **receta**: una lista de pasos, en orden, que termina en algún momento.\n\n!clau Un **algoritmo** (algorisme) es el método para resolver un problema en un **número finito de pasos**. Por ejemplo: la receta de la crema, o cómo ordenar tres números de menor a mayor.\n\nUn **programa** es ese mismo algoritmo escrito en un lenguaje que el ordenador entiende. Es una secuencia de **instrucciones** que la CPU (el «cerebro» del ordenador) ejecuta para obtener un resultado.\n\nVarios programas enlazados forman una **aplicación informática**.\n\n!idea Algoritmo = la receta pensada. Programa = la receta escrita en un idioma que el robot de cocina entiende."},{"id":"b","t":"Quién es quién: programador, usuario, procesador","md":"- **Programador/a**: la persona que escribe (codifica) los programas.\n- **Usuario**: la persona que utiliza la aplicación para conseguir un resultado.\n- **Procesador**: cualquier entidad capaz de ejecutar un algoritmo. En los programas, es el ordenador. Con la receta, sería el robot de cocina.\n\nUn programa tiene **instrucciones** (qué hay que hacer) y **datos** (con qué se trabaja). La **ejecución** es el momento en que el ordenador realiza las instrucciones, como un cocinero siguiendo la receta.\n\n!clau Cada ejecución recibe unos **datos de entrada** y da un **resultado**. Si cambias los datos de entrada (zanahoria en lugar de calabacín), el resultado cambia.\n\n- El **tipo de un dato** lo iguala a otros parecidos: puedes cambiar calabacín por zanahoria (son verduras), pero no calabacín por aceite.\n- Un **operador** es una acción que se hace con datos de un tipo: las verduras se pueden cortar."},{"id":"c","t":"Lenguajes de alto y bajo nivel","md":"La fase de **codificación** consiste en traducir el algoritmo a un lenguaje de programación.\n\n| Tipo | Qué significa | Ejemplos |\n|---|---|---|\n| Bajo nivel | El procesador los entiende casi directamente | Lenguaje máquina, ensamblador |\n| Alto nivel | Fáciles para humanos; hay que traducirlos | Python, Java, C |\n\n!clau El **código fuente** (codi font) es el algoritmo escrito en un lenguaje de alto nivel. Normalmente es un fichero con todas las instrucciones."},{"id":"d","t":"Interpretado o compilado","md":"Los lenguajes de alto nivel se tienen que traducir para que el procesador los entienda. Hay dos maneras:\n\n| | Interpretado | Compilado |\n|---|---|---|\n| Cómo funciona | Traduce y ejecuta **cada instrucción, una a una** | Traduce **todo** el código antes de ejecutar |\n| Resultado | No genera ningún fichero nuevo | Genera un **programa objeto**; el **montador** (muntador) crea un **ejecutable** |\n| Ejemplos del curso | **Python**, JavaScript, Bash, PHP | C, Fortran, Pascal, Java |\n\n!clau **Python es interpretado.** Por eso, si hay un error en la línea 3, las líneas 1 y 2 se ejecutan igualmente y el programa se detiene al llegar a la 3.\n\n!compte En el examen te pueden preguntar el orden del proceso compilado: código fuente, compilación, programa objeto, montador, programa ejecutable."},{"id":"e","t":"Buenos algoritmos y programación estructurada","md":"Un algoritmo **tiene que ser finito** (terminar en un número determinado de pasos). Además, es deseable que sea:\n\n- **Legible**: que una persona entienda qué hace.\n- **Portable**: que funcione en equipos distintos.\n- **Modificable**: por ejemplo, que cambiar el IVA sea fácil.\n- **Escalable**: que se pueda ampliar poco a poco.\n- **Eficiente**: importante, pero no es el objetivo principal del curso.\n- **Estructurado**: usa estructuras de selección y repetición.\n- **Modular**: separado en partes reutilizables.\n\nTipos de programación: estructurada, modular, orientada a objetos, concurrente, funcional y lógica.\n\n!clau En este curso solo se hace **programación estructurada**: secuencias, condicionales y repeticiones, una instrucción detrás de otra."},{"id":"f","t":"Tu primer contacto con Python","md":"Python es el lenguaje más utilizado del mundo: tiene una sintaxis limpia y legible, es de código abierto, versátil y multiplataforma.\n\nHay dos maneras de trabajar con él:\n\n**1. El intérprete interactivo.** Escribes `python3` en el terminal y aparece el símbolo `>>>`. Le das una instrucción y te responde al instante.\n\n```py\n>>> 2 + 3\n5\n```\n\n**2. Un fichero de programa.** Escribes las instrucciones en un fichero `.py` y lo ejecutas:\n\n```sh\npython3 hola_mundo.py\n```\n\n```py\nprint('Hello, world!')\n```\n\n!idea Usa el intérprete interactivo como «calculadora de pruebas»: cuando dudes de qué hace una instrucción, pruébala allí antes de ponerla en el programa."}],"quiz":[{"id":"q1","q":"¿Qué es un algoritmo?","opts":["Un método para resolver un problema en un número finito de pasos","Un programa escrito en lenguaje máquina","Cualquier fichero que acabe en .py","La persona que ejecuta el programa"],"a":0,"why":"Un algoritmo es el método (la receta). Puede existir sin ordenador. El programa es ese algoritmo escrito en un lenguaje que el ordenador entiende.","ref":"a"},{"id":"q2","q":"Python es un lenguaje…","opts":["Compilado: genera un ejecutable antes de ejecutarse","Interpretado: traduce y ejecuta instrucción a instrucción","De bajo nivel, como el ensamblador","Que solo funciona en Linux"],"a":1,"why":"Python es interpretado y de alto nivel. Además, es multiplataforma.","ref":"d"},{"id":"q3","q":"En un lenguaje compilado, ¿qué programa genera el ejecutable a partir del programa objeto?","opts":["El intérprete interactivo","El montador","El código fuente","El procesador de textos"],"a":1,"why":"El compilador traduce el código fuente a programa objeto, y el montador genera el ejecutable a partir de uno o más programas objeto.","ref":"d"},{"id":"q4","q":"¿Qué característica debe tener SIEMPRE un algoritmo, por definición?","opts":["Ser eficiente","Ser modular","Ser finito","Ser portable"],"a":2,"why":"Por definición, un algoritmo tiene que terminar en un número determinado de pasos. El resto (legible, portable, eficiente…) son deseables.","ref":"e"},{"id":"q5","q":"¿Qué tipo de programación se usa en este curso?","opts":["Orientada a objetos","Funcional","Estructurada","Concurrente"],"a":2,"why":"Solo programación estructurada: secuencia, selección (if) y repetición (bucles).","ref":"e"},{"id":"q6","q":"¿Qué es el código fuente?","opts":["El resultado de ejecutar el programa","El algoritmo codificado en un lenguaje de alto nivel","El fichero ejecutable que genera el montador","Los datos de entrada del programa"],"a":1,"why":"El código fuente es lo que escribes tú: el algoritmo traducido a un lenguaje de alto nivel como Python.","ref":"c"},{"id":"q7","q":"Si cambias los datos de entrada de un programa…","opts":["El programa deja de funcionar","El resultado obtenido puede ser distinto","Tienes que volver a compilarlo","Las instrucciones cambian automáticamente"],"a":1,"why":"Igual que si cambias los ingredientes de una receta: las instrucciones son las mismas, pero el plato (el resultado) cambia.","ref":"b"}],"ex":[{"id":"e1","type":"order","t":"Ordena el proceso de compilación","prompt":"Pon en orden los pasos que sigue un lenguaje compilado, desde lo que escribe el programador hasta lo que se ejecuta.","lines":["Código fuente","Compilación","Programa objeto","Montador","Programa ejecutable"],"why":"El compilador traduce todo el código fuente a un programa objeto. El montador une uno o más programas objeto y genera el ejecutable.","hint":""},{"id":"e2","type":"choice","t":"¿Interpretado o compilado?","prompt":"Según el material del curso, ¿cuál de estos lenguajes es **compilado**?","opts":["Python","Bash","Pascal","PHP"],"a":2,"why":"Pascal (como C, Fortran y Java) es compilado. Python, Bash, PHP y JavaScript son interpretados.","hint":""},{"id":"e3","type":"predict","t":"El primer programa","prompt":"¿Qué muestra por pantalla este programa?","code":"print('Hello, world!')","out":"Hello, world!","why":"La función print() muestra lo que hay entre paréntesis. Las comillas indican que es un texto (una cadena) y no se muestran.","hint":"Las comillas no salen en pantalla."},{"id":"e4","type":"choice","t":"Interpretado en acción","prompt":"Un programa en Python tiene 5 líneas y la línea 3 tiene un error. ¿Qué pasa al ejecutarlo?","opts":["No se ejecuta nada: Python revisa todo el fichero antes","Se ejecutan las líneas 1 y 2 y se detiene con un mensaje de error en la 3","Se salta la línea 3 y sigue con la 4 y la 5","Python corrige el error automáticamente"],"a":1,"why":"Como Python es interpretado, va traduciendo y ejecutando línea a línea hasta que encuentra una instrucción que no puede hacer. (Excepción: un error de sintaxis grave puede detenerlo antes de empezar, pero la idea clave del examen es esta.)","hint":""}]},{"id":"t2","unit":1,"title":"Números y operadores","summary":"int, float, + − * / // % ** y la prioridad","theory":[{"id":"a","t":"Dos tipos de números: int y float","md":"Python tiene dos tipos de números:\n\n| Tipo | Qué es | Ejemplos |\n|---|---|---|\n| `int` | Entero (sin decimales) | `3`, `-12`, `0` |\n| `float` | Decimal (con punto) | `3.5`, `2.0`, `-0.25` |\n\n!compte En Python los decimales se escriben con **punto**, no con coma: `12.99`, nunca `12,99`.\n\nPuedes preguntar el tipo de un dato con `type()`:\n\n```py\n>>> type(7)\n<class 'int'>\n>>> type(7.0)\n<class 'float'>\n```"},{"id":"b","t":"Sumar, restar, multiplicar y dividir","md":"| Operador | Hace | Ejemplo | Resultado |\n|---|---|---|---|\n| `+` | suma | `7 + 2` | `9` |\n| `-` | resta | `7 - 2` | `5` |\n| `*` | multiplicación | `7 * 2` | `14` |\n| `/` | división decimal | `7 / 2` | `3.5` |\n| `**` | potencia | `2 ** 3` | `8` |\n\n!clau La división `/` **siempre** da un `float`, aunque sea exacta: `4 / 2` da `2.0`.\n\nReglas del tipo del resultado:\n\n- Dos `int` con `+ - * // %` dan un `int`.\n- Si al menos un dato es `float`, `+ - * /` dan un `float`: `3 + 2.0` da `5.0`.\n- `/` siempre da `float`.\n\nTambién existen los operadores **unarios** `-` (cambio de signo) y `+` (identidad), que actúan sobre un solo dato: `-5`."},{"id":"c","t":"División entera // y módulo %","md":"Recuerda cómo dividías a mano en el colegio: un **cociente** y un **resto** (lo que sobra).\n\n- `//` (división entera) da el **cociente**, sin decimales.\n- `%` (módulo) da el **resto**.\n\n```py\n>>> 14 // 4\n3\n>>> 14 % 4\n2\n```\n\n14 entre 4: caben 3 grupos de 4 (12) y sobran 2.\n\n!idea Tienes 14 caramelos y los repartes en bolsas de 4. `//` dice cuántas bolsas llenas tienes (3). `%` dice cuántos caramelos te quedan en la mano (2).\n\nSon muy útiles para ciclos (semanas, minutos, segundos):\n\n```py\n>>> 234 // 60\n3\n>>> 234 % 60\n54\n```\n\n234 segundos son 3 minutos y 54 segundos. Y 733 días son `733 // 7` = 104 semanas y `733 % 7` = 5 días.\n\n!clau Trucos: `n % 2 == 0` significa que n es par. `n % 10` da la última cifra. `a % b == 0` significa que a es múltiplo de b."},{"id":"d","t":"Prioridad de los operadores","md":"Cuando hay varios operadores, Python sigue este orden (de mayor a menor prioridad):\n\n| Orden | Operadores | Asociatividad |\n|---|---|---|\n| 1 | `**` | por la **derecha** |\n| 2 | `+x`, `-x` (unarios) | |\n| 3 | `*`, `/`, `//`, `%` | por la izquierda |\n| 4 | `+`, `-` (binarios) | por la izquierda |\n\nSi tienen la misma prioridad, se resuelve **de izquierda a derecha**… excepto `**`, que va **de derecha a izquierda**.\n\n```py\n>>> 149 % 10 % 7\n2\n>>> 2 ** 3 ** 2\n512\n```\n\n`149 % 10` es 9 y `9 % 7` es 2. En cambio, `2 ** 3 ** 2` hace primero `3 ** 2` = 9 y después `2 ** 9` = 512.\n\nEjemplo paso a paso: `3 - 2 * 4 ** 2`\n\n- Potencia: `4 ** 2` = 16\n- Multiplicación: `2 * 16` = 32\n- Resta: `3 - 32` = **-29**\n\n!clau Los **paréntesis** cambian la prioridad, como en matemáticas: `(3 - 2) * 4` da 4."},{"id":"e","t":"Ejemplos de prioridad para practicar","md":"Resuélvelos mentalmente y después compruébalo en el intérprete:\n\n| Expresión | Resultado | Por qué |\n|---|---|---|\n| `2 + 24 % 5` | `6` | primero `24 % 5` = 4 |\n| `7 - 30 % 7 * 7` | `-7` | `30 % 7` = 2, `2 * 7` = 14, `7 - 14` |\n| `4 - 5 % 3 // 2 * 2` | `2` | `5 % 3`=2, `2 // 2`=1, `1 * 2`=2, `4 - 2` |\n| `3345 % 10 // 2` | `2` | `3345 % 10`=5, `5 // 2`=2 |\n| `100 ** 1 / 2` | `50.0` | potencia primero; `/` da float |\n| `5 / 2 * 2` | `5.0` | `2.5 * 2` |\n| `5 // 2 * 2` | `4` | `2 * 2` |\n\n!compte Con números **negativos**, `//` y `%` no son intuitivos: `-5 // 2` da `-3` y `-5 % 2` da `1`. Si alguna vez te los encuentras, compruébalo en el intérprete."},{"id":"f","t":"Errores que te encontrarás","md":"Cuando no sigues las normas, el procesador se queja con un mensaje de error. Aprende a leerlos: la última línea dice el tipo de error.\n\n**SyntaxError**: no has seguido las normas de escritura (operadores mal puestos, un paréntesis que se cierra antes de abrirse, un espacio en medio de un número…).\n\n```py\n>>> 2 +* 3\nSyntaxError: invalid syntax\n```\n\n**ZeroDivisionError**: has intentado dividir entre cero.\n\n```py\n>>> 7 / 0\nZeroDivisionError: division by zero\n```\n\n!clau `//` y `%` solo tienen sentido entre enteros. Con `float` funcionan, pero no los uses así."}],"quiz":[{"id":"q1","q":"¿Cuál es el resultado de `4 / 2`?","opts":["2","2.0","2.5","Error"],"a":1,"why":"La división `/` siempre devuelve un float, aunque la división sea exacta.","ref":"b","run":"print(4 / 2)"},{"id":"q2","q":"¿Cuál es el resultado de `14 % 4`?","opts":["3","3.5","2","0"],"a":2,"why":"`%` da el resto: 14 = 4·3 + 2, por lo tanto el resto es 2.","ref":"c","run":"print(14 % 4)"},{"id":"q3","q":"¿Cuál es el resultado de `2 ** 3 ** 2`?","opts":["64","512","36","12"],"a":1,"why":"`**` se asocia por la derecha: primero `3 ** 2` = 9 y después `2 ** 9` = 512.","ref":"d","run":"print(2 ** 3 ** 2)"},{"id":"q4","q":"¿Cuál es el resultado de `3 - 2 * 4 ** 2`?","opts":["16","-29","-61","4"],"a":1,"why":"Primero la potencia (16), después la multiplicación (32) y al final la resta: 3 - 32 = -29.","ref":"d","run":"print(3 - 2 * 4 ** 2)"},{"id":"q5","q":"¿Cuál es el resultado de `5 // 2 * 2`?","opts":["5.0","4","5","1"],"a":1,"why":"`//` y `*` tienen la misma prioridad: de izquierda a derecha. `5 // 2` = 2 y `2 * 2` = 4.","ref":"e","run":"print(5 // 2 * 2)"},{"id":"q6","q":"¿De qué tipo es el resultado de `3 + 2.0`?","opts":["int","float","str","Da error"],"a":1,"why":"Si al menos uno de los datos es float, el resultado de + - * / es float: 5.0.","ref":"b"},{"id":"q7","q":"¿Cuántas semanas enteras hay en 733 días?","opts":["`733 / 7`","`733 % 7`","`733 // 7`","`733 ** 7`"],"a":2,"why":"La división entera `//` da el cociente: 104 semanas. El resto (`%`) serían los 5 días que sobran.","ref":"c"},{"id":"q8","q":"¿Qué error obtienes con `10 / 0`?","opts":["SyntaxError","NameError","ZeroDivisionError","ValueError"],"a":2,"why":"Dividir entre cero no está permitido: ZeroDivisionError.","ref":"f"},{"id":"q9","q":"¿Cuál es el resultado de `7 - 30 % 7 * 7`?","opts":["-7","49","0","-203"],"a":0,"why":"`30 % 7` = 2, `2 * 7` = 14 (misma prioridad, de izquierda a derecha) y `7 - 14` = -7.","ref":"e","run":"print(7 - 30 % 7 * 7)"}],"ex":[{"id":"e1","type":"predict","t":"Minutos y segundos","prompt":"¿Qué muestra este programa? (print separa los datos con un espacio)","code":"print(234 // 60, 234 % 60)","out":"3 54","why":"234 // 60 da 3 minutos enteros y 234 % 60 da los 54 segundos que sobran.","hint":"¿Cuántos grupos de 60 caben en 234? ¿Cuánto sobra?"},{"id":"e2","type":"predict","t":"Prioridad con cuatro operadores","prompt":"¿Qué muestra?","code":"print(4 - 5 % 3 // 2 * 2)","out":"2","why":"5 % 3 = 2, 2 // 2 = 1, 1 * 2 = 2 (de izquierda a derecha, misma prioridad) y 4 - 2 = 2.","hint":"%, // y * tienen la misma prioridad: de izquierda a derecha."},{"id":"e3","type":"predict","t":"¿Float o int?","prompt":"¿Qué muestra? Fíjate bien en el tipo de cada resultado.","code":"print(100 ** 1 / 2)\nprint(5 / 2 * 2)\nprint(3 * 2 + 1)","out":"50.0\n5.0\n7","why":"Cada / da float, por eso salen 50.0 y 5.0. La última línea solo tiene enteros y da 7.","hint":"Siempre que hay una / el resultado tiene decimales."},{"id":"e4","type":"fill","t":"Semanas y días","prompt":"Completa los operadores para que el programa muestre las semanas enteras y los días que sobran de 733 días.","code":"print(733 [[0]] 7, 733 [[1]] 7)","blanks":[["//"],["%"]],"why":"// da las semanas enteras (104) y % los días que sobran (5).","hint":"","out":"104 5"},{"id":"e5","type":"predict","t":"Restos encadenados","prompt":"¿Qué muestra?","code":"print(149 % 10 % 7)\nprint(7 % 34567)","out":"2\n7","why":"149 % 10 = 9 y 9 % 7 = 2. Cuando el dividendo es menor que el divisor, el resto es el propio dividendo: 7 % 34567 = 7.","hint":"Si divides 7 entre un número muy grande, ¿cuántos grupos caben? ¿Cuánto sobra?"},{"id":"e6","type":"bug","t":"Encuentra el error","prompt":"Uno de estos cálculos hará que el programa falle. Toca la línea que provoca el error.","code":"total = 10 + 5\nmedia = total / 3\ngrupos = total // 0\nresto = total % 4","line":2,"why":"Dividir entre cero (también con //) provoca ZeroDivisionError. Las otras líneas son correctas.","hint":""}]},{"id":"t3","unit":1,"title":"Variables y constantes","summary":"Guardar valores con nombre, reglas de los nombres y constantes","theory":[{"id":"a","t":"Una variable es una caja con nombre","md":"Una **variable** es un contenedor que guarda un valor. Siempre tiene dos partes: un **nombre** y un **valor**.\n\n```py\n>>> num1 = 7\n>>> num2 = 5\n>>> num1 + num2\n12\n```\n\n!clau El símbolo `=` es el **operador de asignación**: pone el valor de la derecha dentro de la variable de la izquierda. No significa «es igual» (eso es `==`).\n\nLa forma siempre es:\n\n```py\nnombre_variable = expresión\n```\n\nPrimero Python **calcula toda la expresión de la derecha** y después guarda el resultado en la variable de la izquierda. Por eso esto es válido:\n\n```py\ncontador = 0\ncontador = contador + 1\n```\n\nDespués de estas dos líneas, `contador` vale 1.\n\n!idea Piensa en una etiqueta pegada a una caja. Cuando asignas un valor nuevo, vacías la caja y metes el nuevo contenido."},{"id":"b","t":"Cómo poner nombre a las variables","md":"Normas **obligatorias** (si no, error):\n\n- Solo letras, cifras y el carácter `_`.\n- **No puede empezar por una cifra**: `2precio` no es válido.\n- **No puede tener espacios**: `precio final` no es válido.\n- No puede ser una **palabra reservada**: `if`, `else`, `while`, `for`, `True`, `False`…\n- Python distingue **mayúsculas y minúsculas**: `pi` y `PI` son variables distintas.\n\nNormas de **buen estilo** (PEP 8):\n\n- Nombres en minúsculas con palabras separadas por `_`: `precio_base`, `edad_usuario`.\n- Nombres **descriptivos**: `precio_final` es mucho mejor que `pf` o `x`.\n\n!compte `precio-base` no es un nombre: Python lo lee como «precio menos base»."},{"id":"c","t":"Python no declara tipos","md":"En Python **no hace falta declarar el tipo** de una variable. Se crea cuando le asignas un valor y toma el tipo de ese valor.\n\n```py\n>>> edad = 30\n>>> type(edad)\n<class 'int'>\n```\n\nSe puede reasignar una variable con un valor de otro tipo y Python no protestará… pero **no lo hagas**: tienes que saber siempre qué tipo contiene cada variable. Evitarás muchos errores.\n\n!clau Para usar una variable, antes le tienes que haber dado un valor. Si no, error `NameError`."},{"id":"d","t":"Constantes en MAYÚSCULAS","md":"Fíjate en este cálculo del IVA:\n\n```py\nprecio_original = 22\nincremento = precio_original * 21 / 100\n```\n\nSi el 21 aparece en muchos sitios y el IVA cambia, tendrás que buscarlo y cambiarlo en todas partes. Muy fácil equivocarse.\n\nSolución: una **constante**.\n\n```py\nIVA = 21\nprecio_original = 22\nincremento = precio_original * IVA / 100\nprecio_final = precio_original + incremento\n```\n\n!clau Una **constante** es como una variable pero que **no cambia** durante el programa. Por convenio se escribe en **MAYÚSCULAS** y se define **al principio** del programa.\n\nPython no impide cambiarla: las mayúsculas son solo para la legibilidad. Pero si tú las respetas, el programa será más **legible** y más **fácil de modificar**.\n\n!idea Puedes hacer lo mismo con π: `PI = 3.1416`. Así `area = radio ** 2 * PI` se entiende a la primera."},{"id":"e","t":"Errores típicos con variables","md":"**Variable no definida** (NameError): usas una variable que todavía no tiene valor.\n\n```py\n>>> num = num + 1\nNameError: name 'num' is not defined\n```\n\n**Nombre con espacio** (SyntaxError):\n\n```py\n>>> num 1 = 2\nSyntaxError: invalid syntax\n```\n\n**Asignación al revés** (SyntaxError): a la izquierda del `=` solo puede haber un nombre.\n\n```py\n>>> 2 + 2 = num\nSyntaxError: cannot assign to expression here. Maybe you meant '==' instead of '='?\n```\n\n!clau Python te da pistas: «Did you mean…?». Lee siempre la última línea del error."}],"quiz":[{"id":"q1","q":"¿Cuál de estos nombres de variable es **válido** y sigue el buen estilo?","opts":["`2precio`","`precio-base`","`precio_base`","`precio base`"],"a":2,"why":"`precio_base` solo tiene letras y _. Los otros empiezan por cifra, tienen un guion (resta) o un espacio.","ref":"b"},{"id":"q2","q":"¿Cuánto vale `x` después de ejecutar esto?","opts":["3","7","4","Da error"],"a":1,"why":"Primero se calcula la derecha con el valor antiguo (3 * 2 + 1 = 7) y después se guarda en x.","ref":"a","code":"x = 3\nx = x * 2 + 1","run":"x = 3\nx = x * 2 + 1\nprint(x)"},{"id":"q3","q":"Por convenio, ¿cómo se escriben las constantes?","opts":["En minúsculas","En MAYÚSCULAS","Empezando por _","Con un número al final"],"a":1,"why":"Las constantes se escriben en mayúsculas y al principio del programa. Es un convenio para la legibilidad.","ref":"d"},{"id":"q4","q":"¿Qué error da usar una variable que no tiene valor?","opts":["SyntaxError","TypeError","NameError","ZeroDivisionError"],"a":2,"why":"NameError: el nombre no está definido. Python intenta ayudarte sugiriendo nombres parecidos.","ref":"e"},{"id":"q5","q":"`pi` y `PI` son…","opts":["La misma variable","Dos variables distintas","Palabras reservadas","Un error de sintaxis"],"a":1,"why":"Python distingue mayúsculas de minúsculas (case sensitive).","ref":"b"},{"id":"q6","q":"¿Qué hace la instrucción `total = 5`?","opts":["Comprueba si total es igual a 5","Guarda el valor 5 en la variable total","Muestra 5 por pantalla","Crea una constante"],"a":1,"why":"= es el operador de asignación. Para comparar se usa ==.","ref":"a"},{"id":"q7","q":"¿Por qué es buena idea definir `IVA = 21` al principio?","opts":["Porque así el programa va más rápido","Porque Python no deja cambiar las constantes","Porque es más legible y fácil de modificar si el IVA cambia","Porque es obligatorio en Python"],"a":2,"why":"Las constantes hacen el programa legible y flexible: un cambio de IVA se hace en una sola línea.","ref":"d"}],"ex":[{"id":"e1","type":"predict","t":"Sigue las cajas","prompt":"¿Qué muestra este programa?","code":"a = 5\nb = a * 2\na = a + 1\nprint(a, b)","out":"6 10","why":"b se calcula cuando a todavía vale 5, por lo tanto b es 10. Después a pasa a valer 6. Cambiar a no cambia b.","hint":"Cuando se calcula b, ¿cuánto vale a en ese momento?"},{"id":"e2","type":"predict","t":"Un contador","prompt":"¿Qué muestra?","code":"contador = 0\ncontador = contador + 1\ncontador = contador + 1\ncontador = contador * 10\nprint(contador)","out":"20","why":"0 → 1 → 2 → 20. Cada línea usa el valor anterior para calcular el nuevo.","hint":"Haz una tabla con el valor del contador después de cada línea."},{"id":"e3","type":"bug","t":"Nombre incorrecto","prompt":"Toca la línea que provoca un error de sintaxis.","code":"IVA = 21\nprecio inicial = 100\nincremento = 100 * IVA / 100\nprint(incremento)","line":1,"why":"Un nombre de variable no puede tener espacios. Debería ser precio_inicial.","hint":""},{"id":"e4","type":"fill","t":"Área con constante","prompt":"Completa el programa para que use una constante para π.","code":"[[0]] = 3.1416\nradio = 5\narea = radio ** 2 * PI\nprint(area)","blanks":[["PI"]],"why":"Las constantes van en mayúsculas y al principio. El programa ya usa PI en la línea del área.","hint":"","out":"78.53999999999999"},{"id":"e5","type":"write","t":"Precio con IVA (a nuestra manera)","prompt":"Escribe un programa que calcule y muestre el precio final de un producto que cuesta 22 € con un IVA del 10%. Usa una constante para el IVA y nombres de variables descriptivos.","ee":"","tests":[{"in":"","out":"24.2"}],"solution":"IVA = 10\n\nprecio_original = 22\nincremento = precio_original * IVA / 100\nprecio_final = precio_original + incremento\n\nprint(precio_final)","checks":["Has definido una constante IVA en mayúsculas al principio","Los nombres de variables son descriptivos (nada de x, a, b)","No hay ningún 10 «mágico» dentro de los cálculos","El programa muestra 24.2"],"hint":""}]},{"id":"t4","unit":1,"title":"Entrada y salida","summary":"print(), input() y conversiones de tipo","theory":[{"id":"a","t":"Programas en fichero","md":"En el intérprete, si escribes el nombre de una variable, te muestra el valor. En un **programa** (un fichero `.py`) no: tienes que decir explícitamente qué quieres mostrar.\n\nCrea un fichero `hola.py`:\n\n```py\nprint('Hello, world!')\n```\n\nY ejecútalo desde el terminal:\n\n```sh\npython3 hola.py\n```\n\n!clau Pon nombres descriptivos a los ficheros de los programas: `calcula_iva.py` mejor que `prueba3.py`."},{"id":"b","t":"print(): mostrar datos","md":"`print()` es una **función**: una palabra seguida de paréntesis. Lo que hay dentro se llama **argumento**.\n\n```py\nprint(3)\nprint(3 + 2)\nprint('Buenos días')\na = 95\nprint('Mi edad:', a)\n```\n\nMuestra:\n\n```txt\n3\n5\nBuenos días\nMi edad: 95\n```\n\n- Si el argumento es una operación, **primero calcula** el resultado.\n- Puedes pasar **varios datos separados por comas**. print los separa con un **espacio**.\n- Cada `print()` termina con un **salto de línea**.\n\n!idea `print('tengo', 3, 'años')` muestra `tengo 3 años`: ha puesto los espacios él solo.\n\nAvanzado (por si te hace falta): `print('a', 'b', sep='-')` muestra `a-b`, y `end=''` evita el salto de línea."},{"id":"c","t":"input(): leer datos","md":"`input()` es la función simétrica de print(): lee lo que el usuario escribe hasta que pulsa Intro.\n\n```py\na = input()\nprint(a)\n```\n\n!clau `input()` **siempre devuelve una cadena (str)**. Si escribes 34, devuelve el texto `'34'`, nunca el número 34.\n\nEs imprescindible **guardar el resultado en una variable**. Si no, lo que se ha leído se pierde.\n\nPuedes poner un texto de ayuda: `nombre = input('¿Cómo te llamas? ')`. Pero como administradores de sistemas **lo evitaréis**: los programas no se ejecutan con una persona delante, y ese texto «ensucia» la salida.\n\n!idea Entrada estándar (stdin) = el teclado. Salida estándar (stdout) = la pantalla. El sistema operativo puede redirigirlas a ficheros."},{"id":"d","t":"La sorpresa del + con texto","md":"Programa para sumar dos números:\n\n```py\na = input()\nb = input()\nprint(a + b)\n```\n\nSi escribes 12 y 3, muestra… ¡`123`!\n\n¿Por qué? Porque `a` y `b` son cadenas, y el `+` entre cadenas **concatena** (pega un texto detrás del otro):\n\n```py\n>>> '12' + '3'\n'123'\n>>> 12 + 3\n15\n```\n\nSolución: **convertir** el texto en número con `int()`:\n\n```py\na = int(input())\nb = int(input())\nprint(a + b)\n```\n\n!clau `int(input())` es una **composición de funciones**: primero se ejecuta la de dentro (`input()` devuelve `'12'`) y después la de fuera (`int('12')` devuelve 12)."},{"id":"e","t":"Conversiones de tipo: int, float, str","md":"| Instrucción | Resultado | Comentario |\n|---|---|---|\n| `int('3')` | `3` | texto a entero |\n| `int(3.5)` | `3` | **corta** los decimales |\n| `int('3.5')` | **ValueError** | un texto con punto no es un entero |\n| `int('hola')` | **ValueError** | no hay ningún número |\n| `float(3)` | `3.0` | |\n| `float('3')` | `3.0` | |\n| `float('3.3.3')` | **ValueError** | |\n| `str(3.3)` | `'3.3'` | número a texto |\n| `int(float('3.5'))` | `3` | primero float, después int |\n\n!clau Si los datos pueden tener decimales (¡precios!), usa `float(input())`. Con `int(input())`, escribir 12.99 hace que el programa falle.\n\n```py\nIVA = 21\n\nprecio_inicial = float(input())\nincremento_iva = precio_inicial * IVA / 100\nprecio_final = precio_inicial + incremento_iva\n\nprint(precio_final)\n```"},{"id":"f","t":"Errores de principiante","md":"| Error | Ejemplo | Causa |\n|---|---|---|\n| `SyntaxError: unterminated string literal` | `print('Hola)` | falta cerrar la comilla |\n| `IndentationError: unexpected indent` | ` print('Hola')` con un espacio delante | espacio donde no toca |\n| `SyntaxError: '(' was never closed` | `print('Hola'` | falta cerrar el paréntesis |\n| `TypeError: ... 'builtin_function_or_method'` | `int(input)` | has olvidado los `()` de input |\n| `NameError: name 'c' is not defined` | `print(a + c)` | variable inexistente |\n| `TypeError: unsupported operand type(s) for +: 'int' and 'str'` | `12 + 'hola'` | sumar número y texto |\n| `ValueError: invalid literal for int()` | `int('hola')` | conversión imposible |\n\n!compte En Python los **espacios al principio de la línea (indentación) tienen significado**: marcan bloques. Una línea que no debe estar indentada no puede empezar con espacios.\n\n!clau Los operadores aritméticos sí pueden mezclar `int` y `float` sin problemas. Lo que no se puede hacer es sumar un número y un texto."}],"quiz":[{"id":"q1","q":"¿Qué tipo de dato devuelve siempre `input()`?","opts":["int","float","str","Depende de lo que escribas"],"a":2,"why":"input() siempre devuelve una cadena. Si quieres un número, lo tienes que convertir con int() o float().","ref":"c"},{"id":"q2","q":"Si `a = '12'` y `b = '3'`, ¿qué da `a + b`?","opts":["15","'123'","'15'","Error"],"a":1,"why":"Entre cadenas, + concatena: pega '3' detrás de '12'.","ref":"d"},{"id":"q3","q":"¿Qué pasa con `int('3.5')`?","opts":["Da 3","Da 4","Da 3.5","ValueError"],"a":3,"why":"int() no puede convertir un texto con decimales. En cambio int(3.5) (el número) sí: da 3.","ref":"e"},{"id":"q4","q":"¿Qué muestra `print('tengo', 3, 'años')`?","opts":["tengo3años","tengo 3 años","'tengo' 3 'años'","Error: no se puede mezclar texto y número"],"a":1,"why":"print acepta varios datos de cualquier tipo separados por comas y los separa con un espacio.","ref":"b","run":"print('tengo', 3, 'años')"},{"id":"q5","q":"¿Cuál es el resultado de `int(float('3.5'))`?","opts":["3","3.5","4","ValueError"],"a":0,"why":"Composición: primero float('3.5') = 3.5, después int(3.5) = 3 (corta los decimales).","ref":"e","run":"print(int(float('3.5')))"},{"id":"q6","q":"¿Qué error obtienes con `12 + 'hola'`?","opts":["NameError","ValueError","TypeError","SyntaxError"],"a":2,"why":"TypeError: el operador + no puede actuar entre un int y un str.","ref":"f"},{"id":"q7","q":"Para leer un precio que puede tener decimales, ¿qué escribirás?","opts":["`precio = input()`","`precio = int(input())`","`precio = float(input())`","`precio = str(input())`"],"a":2,"why":"float(input()) acepta 12.99 y también 10. int(input()) fallaría con 12.99.","ref":"e"},{"id":"q8","q":"Escribes `a = int(input)` (sin los paréntesis de input). ¿Qué pasa?","opts":["Funciona igual","TypeError que habla de builtin_function_or_method","Lee un número automáticamente","IndentationError"],"a":1,"why":"Sin paréntesis no llamas a la función: le pasas la función misma a int(). Si el error habla de builtin_function_or_method, seguramente te has dejado unos paréntesis.","ref":"f"}],"ex":[{"id":"e1","type":"predict","t":"La trampa de la suma","prompt":"El usuario escribe 12 y después 3. ¿Qué muestra el programa?","code":"a = input()\nb = input()\nprint(a + b)","out":"123","why":"input() devuelve cadenas, y + entre cadenas las pega.","hint":"¿De qué tipo son a y b?","stdin":"12\n3"},{"id":"e2","type":"predict","t":"Ahora sí, sumando","prompt":"El usuario escribe 12 y después 3. ¿Qué muestra?","code":"a = int(input())\nb = int(input())\nprint(a + b)","out":"15","why":"int() convierte cada texto en entero y ahora + suma.","hint":"","stdin":"12\n3"},{"id":"e3","type":"fill","t":"Precios con decimales","prompt":"Completa el programa para que acepte precios como 12.99.","code":"IVA = 21\n\nprecio_inicial = [[0]](input())\nprecio_final = precio_inicial + precio_inicial * IVA / 100\n\nprint(precio_final)","blanks":[["float"]],"why":"float() acepta tanto 10 como 12.99. Con int(), 12.99 daría ValueError.","hint":"","out":"12.1","stdin":"10"},{"id":"e4","type":"bug","t":"Paréntesis perdidos","prompt":"Este programa da un error raro de TypeError. Toca la línea culpable.","code":"a = int(input)\nb = int(input())\nprint(a + b)","line":0,"why":"En la línea 1 faltan los paréntesis de input: hay que escribir input(). El error habla de builtin_function_or_method.","hint":""},{"id":"e5","type":"order","t":"Ordena el programa del IVA","prompt":"Pon las líneas en el orden correcto: constante al principio, después leer, calcular y mostrar.","lines":["IVA = 21","precio_inicial = float(input())","incremento_iva = precio_inicial * IVA / 100","precio_final = precio_inicial + incremento_iva","print(precio_final)"],"why":"Las constantes se definen en la primera línea. Después: lectura de datos, cálculos y salida.","hint":"","out":"121.0","stdin":"100"},{"id":"e6","type":"write","t":"Repetir una frase","prompt":"Escribe un programa que lea una frase por teclado y la muestre tres veces, cada una en una línea.","ee":"Una frase cualquiera.","tests":[{"in":"hola","out":"hola\nhola\nhola"}],"solution":"frase = input()\nprint(frase)\nprint(frase)\nprint(frase)","checks":["Guardas el resultado de input() en una variable","No pones ningún texto dentro de input() (salida limpia)","Hay tres print, uno por línea"],"hint":""},{"id":"e7","type":"write","t":"Doble y mitad","prompt":"Escribe un programa que lea un número (puede tener decimales) y muestre, en una línea, su doble y su mitad.","ee":"Un número float cualquiera.","tests":[{"in":"10","out":"20.0 5.0"},{"in":"3.5","out":"7.0 1.75"}],"solution":"numero = float(input())\ndoble = numero * 2\nmitad = numero / 2\nprint(doble, mitad)","checks":["Conviertes la entrada con float()","Usas nombres descriptivos","Muestras los dos datos con un solo print separados por comas"],"hint":""}]},{"id":"t5","unit":1,"title":"Metodología","summary":"Cabecera, especificaciones, juego de pruebas, seguimiento y refinamiento","theory":[{"id":"a","t":"Programas que las personas entiendan","md":"«Los programas se deben escribir para que los lean las personas, y solo accidentalmente para que los ejecuten las máquinas.» (Abelson y Sussman)\n\nLa **legibilidad** es el esfuerzo necesario para entender el código. Se consigue con:\n\n- **Nombres descriptivos** de variables y constantes.\n- **Comentarios**: todo lo que va después de `#` es ignorado por Python. Deben explicar **el porqué y el qué**, nunca traducir la instrucción.\n- **Constantes** al principio.\n- **Espacios alrededor de los operadores binarios**: `a = b + c`, no `a=b+c`.\n- **Sin espacios** en los paréntesis de las funciones: `print('hola')`, no `print ( 'hola' )`.\n- La coma como al escribir: sin espacio antes, con espacio después: `print('hola', 'adiós')`.\n- Líneas no demasiado largas (si hace falta, abre un paréntesis y sigue en la línea de abajo).\n\n!compte Un comentario como `# suma 1 a i` sobre `i = i + 1` no aporta nada. Mejor: `# pasamos al siguiente divisor`."},{"id":"b","t":"La cabecera","md":"La **cabecera** (capçalera) es el conjunto de comentarios antes del código. Hazte una plantilla y cópiala en cada programa nuevo:\n\n```py\n# Administración de Sistemas Informáticos\n# IOC\n#\n# Autor:\n# Fecha:\n#\n# Versión:\n#\n# Descripción:\n# Especificaciones de entrada:\n```\n\nDebe decir:\n\n- **Qué hace** el programa (puede ser el enunciado).\n- **Autor** y **fecha**.\n- **Versión**.\n- **Especificaciones de entrada**: qué datos espera."},{"id":"c","t":"Especificaciones de entrada (EE)","md":"Las **especificaciones de entrada** (especificacions d’entrada) le dicen al usuario con qué datos funciona el programa. Deben indicar:\n\n- La **cantidad** de entradas.\n- El **tipo** de cada una.\n- Las **restricciones** (por ejemplo, «mayores o iguales a cero»).\n\n```py\n# Especificaciones de entrada: 2 números float mayores o iguales a cero.\n```\n\n!clau Si el usuario no respeta las EE y el programa falla, la culpa es del usuario. El programador solo garantiza que funciona con los datos descritos.\n\nUn programa es **robusto** cuando no falla sea cual sea la entrada. Eso se consigue más adelante con el **control de errores**. De momento, basta con escribir bien las EE."},{"id":"d","t":"El juego de pruebas","md":"Una **ejecución** es un caso concreto: unos datos de entrada y el resultado que sale.\n\nUn **juego de pruebas** (joc de proves) es una tabla con varias ejecuciones que sirven para comprobar que el programa funciona.\n\n| Ejecución | Entrada | Salida |\n|---|---|---|\n| 1 | 100, 12 | 121.0 14.52 |\n| 2 | 10.5, 0 | 12.705 0.0 |\n\n!clau El juego de pruebas se hace **ANTES de codificar**. Te ayuda a pensar el programa y, al final, a verificarlo.\n\nUn buen juego de pruebas:\n\n- Cubre **todos los caminos** posibles (como mínimo un caso de cada).\n- Incluye los **casos límite** (el 0, el 18 de una mayoría de edad…) y los **problemáticos**.\n- Resuelve las **ambigüedades** del enunciado (¿decimales o no? ¿se acepta el 0?).\n- No es exageradamente largo.\n- Es **coherente con las EE**: no puedes poner un 0 si las EE dicen «mayores que 0».\n\n!compte Un programa que no cumple su juego de pruebas está mal. Es el paso más importante y más creativo."},{"id":"e","t":"El seguimiento (traza)","md":"Un **seguimiento** (seguiment) simula lo que hace el procesador con unos datos concretos. Se hace con una tabla:\n\n- 1.ª columna: el **número de línea** que se ejecuta, en orden de ejecución.\n- Columnas del medio: una por **variable**. Solo se escribe el valor cuando **cambia**.\n- Última columna: la **salida** (lo que muestra print).\n- Las líneas en blanco y los comentarios no se ponen.\n\nPrograma:\n\n```py\nIVA = 21\nprecio_1 = float(input())\nprecio_2 = float(input())\nfinal_1 = precio_1 + precio_1 * IVA / 100\nfinal_2 = precio_2 + precio_2 * IVA / 100\nprint(final_1, final_2)\n```\n\nSeguimiento con entradas 100 y 12:\n\n| Línea | IVA | precio_1 | precio_2 | final_1 | final_2 | Salida |\n|---|---|---|---|---|---|---|\n| 1 | 21 | | | | | |\n| 2 | | 100.0 | | | | |\n| 3 | | | 12.0 | | | |\n| 4 | | | | 121.0 | | |\n| 5 | | | | | 14.52 | |\n| 6 | | | | | | 121.0 14.52 |\n\n!idea **Depurar** (debugar) es, en el fondo, hacer un seguimiento hasta encontrar la variable que toma un valor inesperado. Puedes ayudarte poniendo `print()` temporales."},{"id":"f","t":"Los 8 pasos para hacer un programa","md":"Esta es la metodología del curso. Apréndete el orden:\n\n1. **Entender el enunciado.**\n2. **Hacer uno o varios ejemplos a mano** (o en el intérprete).\n3. **Hacer el juego de pruebas y las especificaciones de entrada.**\n4. **Hacer el primer refinamiento.**\n5. **Hacer los refinamientos sucesivos.**\n6. **Codificar.**\n7. **Ejecutar y comprobar el juego de pruebas.**\n8. **Hacer el seguimiento** de los trozos necesarios para encontrar y corregir errores (depurar).\n\n!clau Un **refinamiento** (refinament) es la lista ordenada, en tu idioma, de los pasos para resolver el problema. Se escribe como comentarios en el fichero **antes** de codificar. Después, debajo de cada comentario, pones el código.\n\n```py\n# Lectura de datos\n\n# Cálculo del discriminante\n\n# Si es negativo\n#     mostrar que no hay solución\n```\n\n!compte Los pasos 1 a 5 se hacen **antes** de escribir ninguna línea de código. Codifica por trozos y prueba a menudo."},{"id":"g","t":"Qué hace bueno a un programa (y la nota)","md":"Si un programa **no funciona**, está suspendido (menos de 5). Si funciona, estas características hacen subir la nota, de más a menos importancia:\n\n1. **Que funcione** en todos los casos de las EE.\n2. **Que sea legible**: nombres, comentarios, estructura clara.\n3. **Que sea flexible y reutilizable**: ¡constantes!\n4. **Que sea eficiente** (sin obsesionarse).\n5. **Que sea robusto**: que ningún dato lo tumbe (control de errores).\n\n!clau En el curso se valora que traduzcas el algoritmo que haces a mano, aunque no sea el más eficiente."}],"quiz":[{"id":"q1","q":"¿Cuándo hay que hacer el juego de pruebas?","opts":["Después de codificar, para comprobar","Antes de codificar","Solo si el programa falla","No hace falta si el programa es corto"],"a":1,"why":"El juego de pruebas se hace antes de codificar (te hace pensar el programa) y se usa después para verificarlo.","ref":"d"},{"id":"q2","q":"¿Qué deben indicar las especificaciones de entrada?","opts":["El nombre del autor y la fecha","La cantidad, el tipo y las restricciones de los datos de entrada","Los resultados esperados","Las variables que usa el programa"],"a":1,"why":"Cuántos datos, de qué tipo y con qué restricciones. El autor y la fecha van en la cabecera, pero no son EE.","ref":"c"},{"id":"q3","q":"¿Cuál de estos comentarios es mejor para `div = div + 1`?","opts":["`# suma 1 a div`","`# div = div + 1`","`# pasamos al siguiente posible divisor`","Ningún comentario nunca"],"a":2,"why":"Los comentarios deben explicar el qué y el porqué, no traducir la instrucción.","ref":"a"},{"id":"q4","q":"¿Qué es un seguimiento?","opts":["Una tabla que simula línea a línea los valores de las variables y la salida","La lista de pasos en tu idioma antes de codificar","El mensaje de error del procesador","La cabecera del programa"],"a":0,"why":"Es una simulación del procesador con unos datos concretos. La lista de pasos en tu idioma es el refinamiento.","ref":"e"},{"id":"q5","q":"¿Qué es el refinamiento?","opts":["Corregir errores de sintaxis","La lista ordenada, en nuestro idioma, de los pasos para resolver el problema","Hacer el programa más rápido","Añadir el control de errores"],"a":1,"why":"Se escribe como comentarios en el fichero antes de codificar y sirve de esqueleto del programa.","ref":"f"},{"id":"q6","q":"¿Cuál es el paso 3 de la metodología?","opts":["Codificar","Hacer ejemplos a mano","Hacer el juego de pruebas y las especificaciones de entrada","Hacer el seguimiento"],"a":2,"why":"1 entender, 2 ejemplos a mano, 3 juego de pruebas y EE, 4 primer refinamiento, 5 refinamientos, 6 codificar, 7 verificar, 8 seguimiento/depurar.","ref":"f"},{"id":"q7","q":"Si un programa no cumple su juego de pruebas…","opts":["Está mal","Está bien si es legible","Está bien si el error es del usuario","Hay que borrar el juego de pruebas"],"a":0,"why":"Un programa que no cumple el juego de pruebas está mal. Si no lo consigues, explícalo en la cabecera.","ref":"d"},{"id":"q8","q":"¿Cuál es la característica MÁS importante de un programa?","opts":["Que sea robusto","Que sea eficiente","Que funcione","Que sea corto"],"a":2,"why":"Si no funciona, está suspendido. Después vienen legible, flexible, eficiente y robusto.","ref":"g"},{"id":"q9","q":"¿Qué línea sigue las normas de legibilidad?","opts":["`a=b+c`","`print ( 'hola' )`","`print('hola','adiós')`","`total = precio + iva`"],"a":3,"why":"Espacios alrededor de los operadores, ningún espacio en los paréntesis y espacio después de la coma.","ref":"a"}],"ex":[{"id":"e1","type":"order","t":"Los 8 pasos","prompt":"Ordena los pasos de la metodología para hacer un programa.","lines":["Entender el enunciado","Hacer ejemplos a mano","Hacer el juego de pruebas y las especificaciones de entrada","Hacer el primer refinamiento","Hacer los refinamientos sucesivos","Codificar","Ejecutar y comprobar el juego de pruebas","Hacer el seguimiento para encontrar errores"],"why":"Fíjate en que los cinco primeros pasos se hacen antes de escribir código.","hint":""},{"id":"e2","type":"choice","t":"Un juego de pruebas coherente","prompt":"Enunciado: «Lee el precio de dos productos e increméntalos un 21%». Has decidido las EE: «2 números float mayores o iguales a cero». ¿Qué juego de pruebas es más completo?","opts":["Solo: 100 y 12","100 y 12; 10.5 y 0","100 y 12; -5 y 3","10 y 10; 20 y 20"],"a":1,"why":"Si aceptas float y el cero, el juego de pruebas tiene que tener un caso con decimales y el caso límite 0. Un precio negativo contradice las EE.","hint":""},{"id":"e3","type":"fill","t":"Seguimiento mental","prompt":"Haz el seguimiento de este programa con la entrada 5 y escribe el valor final de cada variable.","code":"n = int(input())\ndoble = n * 2\nn = n + doble\n# Al final: n vale [[0]] y doble vale [[1]]","blanks":[["15"],["10"]],"why":"Línea 1: n = 5. Línea 2: doble = 10. Línea 3: n = 5 + 10 = 15.","hint":"Haz la tabla: línea, n, doble."},{"id":"e4","type":"choice","t":"Buenas especificaciones","prompt":"¿Cuál es una buena especificación de entrada para un programa que calcula el área de un círculo dado el radio?","opts":["# Especificaciones de entrada: un número","# Especificaciones de entrada: 1 número float mayor o igual a cero (el radio)","# Especificaciones de entrada: área = PI * radio ** 2","# Especificaciones de entrada: el programa muestra el área"],"a":1,"why":"Indica la cantidad (1), el tipo (float) y la restricción (≥ 0). La fórmula y lo que muestra no son EE.","hint":""},{"id":"e5","type":"write","t":"Cabecera, EE y juego de pruebas","prompt":"Sin codificar nada, escribe la cabecera completa, las especificaciones de entrada y un juego de pruebas para este enunciado: «Programa que lee una cantidad de segundos y muestra cuántos minutos enteros son y cuántos segundos sobran».","ee":"","tests":[],"solution":"# Administración de Sistemas Informáticos\n# IOC\n#\n# Autor: David Monfort\n# Fecha: 11-11-2026\n#\n# Versión: 1\n#\n# Descripción: Lee una cantidad de segundos y muestra los minutos\n# enteros y los segundos que sobran.\n# Especificaciones de entrada: 1 número entero mayor o igual a cero.\n#\n# Juego de pruebas:\n#   Entrada   Salida\n#   234       3 54\n#   60        1 0\n#   59        0 59\n#   0         0 0","checks":["La cabecera tiene descripción, autor, fecha y versión","Las EE dicen cantidad, tipo y restricción","El juego de pruebas tiene un caso normal y casos límite (0, 59, 60)","Las salidas del juego de pruebas son correctas (hazlas a mano o en el intérprete)"],"hint":""}]},{"id":"t6","unit":2,"title":"Booleanos y expresiones","summary":"True, False, operadores relacionales y lógicos","theory":[{"id":"a","t":"Un tipo nuevo: bool","md":"¿Es 2 mayor que 3? La respuesta no es un número ni un texto: es **cierto** o **falso**.\n\n```py\n>>> 2 > 3\nFalse\n>>> 3 > 2\nTrue\n```\n\n!clau El tipo **bool** (booleano) solo tiene dos valores: `True` y `False`. Escritos exactamente así, con mayúscula inicial.\n\n| Escribes | Python lo entiende como |\n|---|---|\n| `True` | el booleano cierto |\n| `'True'` | una **cadena**, no un booleano |\n| `true` | el nombre de una variable inexistente: **NameError** |\n\nComo cualquier dato, un booleano se puede guardar en una variable: `es_mayor = edad >= 18`."},{"id":"b","t":"Operadores relacionales (de comparación)","md":"Comparan dos datos y el resultado es **siempre** un booleano.\n\n| Operador | Significa |\n|---|---|\n| `a < b` | a es menor que b |\n| `a > b` | a es mayor que b |\n| `a <= b` | a es menor o igual que b |\n| `a >= b` | a es mayor o igual que b |\n| `a == b` | a es **igual** que b |\n| `a != b` | a es **distinto** de b |\n\n!compte `=` asigna, `==` compara. Es el error más típico.\n\n- `==` y `!=` funcionan entre **cualquier** tipo: `2 != 'hola'` es True, `2 == 2.0` es True.\n- `< > <= >=` solo tienen sentido entre números (de momento). `2 > 'hola'` da **TypeError**.\n\nPor legibilidad: un espacio a cada lado (`a >= b`) y ningún espacio entre los dos símbolos (`>=`, no `> =`).\n\n!compte Por razones históricas `True == 1` da True y `False == 0` también. No uses nunca estas comparaciones: no tienen sentido."},{"id":"c","t":"Operadores lógicos: and, or, not","md":"Combinan booleanos y dan otro booleano.\n\n**and** (y): cierto solo si **los dos** son ciertos.\n\n**or** (o): cierto si **al menos uno** es cierto.\n\n**not** (no): invierte el valor.\n\n| a | b | a and b | a or b | not a |\n|---|---|---|---|---|\n| True | True | True | True | False |\n| True | False | False | True | False |\n| False | True | False | True | True |\n| False | False | False | False | True |\n\n!idea Hoy es miércoles 20 de octubre. «Hoy es miércoles **y** es octubre» es cierto. «Hoy es sábado **o** es octubre» también es cierto, porque basta con uno. «Hoy **no** es **no** miércoles» es lo mismo que «hoy es miércoles»: la doble negación es una afirmación."},{"id":"d","t":"Prioridad de TODOS los operadores","md":"Orden completo, de mayor a menor prioridad:\n\n| Prioridad | Operadores |\n|---|---|\n| 1 | `**` |\n| 2 | `+x`, `-x` (unarios) |\n| 3 | `*`, `/`, `//`, `%` |\n| 4 | `+`, `-` |\n| 5 | `==`, `!=`, `<`, `>`, `<=`, `>=` |\n| 6 | `not` |\n| 7 | `and` |\n| 8 | `or` |\n\n!clau Regla corta: **aritméticos → relacionales → not → and → or**.\n\nEjemplo: `not 5 <= 3 + 2 % 5 and False or 2 != 3`\n\n- Aritméticos: `2 % 5` = 2, `3 + 2` = 5 → `not 5 <= 5 and False or 2 != 3`\n- Relacionales: `5 <= 5` es True, `2 != 3` es True → `not True and False or True`\n- not: `False and False or True`\n- and: `False or True`\n- or: **True**\n\n!idea Pon paréntesis con los operadores lógicos aunque no hagan falta: se lee mucho mejor. Con los aritméticos, en cambio, los paréntesis sobrantes quedan feos."},{"id":"e","t":"Expresiones mal construidas","md":"Python a veces se «traga» expresiones que no tienen sentido lógico y da un resultado extraño. **Tú** las tienes que detectar.\n\n- Las comparaciones `< > <= >=` solo entre datos del mismo tipo (de momento, números).\n- Los operadores lógicos solo entre **booleanos**.\n\n```py\n>>> 2 > 3 or 5\n5\n>>> (2 <= 10) + 3\n4\n```\n\nLas dos están **mal construidas**: `or` con un número, `+` con un booleano. No intentes interpretar el resultado.\n\n**Peculiaridad de Python**: `-2 < -1 < 0` da True. Python la traduce internamente a `-2 < -1 and -1 < 0`. Mejor escríbelo tú así, con `and`, como hacen casi todos los lenguajes."},{"id":"f","t":"Traducir frases a expresiones booleanas","md":"Las expresiones booleanas sirven para escribir condiciones de manera rigurosa.\n\n| Frase | Expresión |\n|---|---|\n| es mayor de edad | `edad >= 18` |\n| n es par | `n % 2 == 0` |\n| a es múltiplo de b | `a % b == 0` |\n| x está entre 1 y 10 (incluidos) | `x >= 1 and x <= 10` |\n\n**Año bisiesto**: múltiplo de 4, excepto los múltiplos de 100, que solo lo son si también son múltiplos de 400.\n\n!compte La versión `(a % 4 == 0) and (a % 100 != 0)` **falla con el 2000**, que sí es bisiesto.\n\nCorrecta:\n\n```py\n(a % 4 == 0 and a % 100 != 0) or (a % 400 == 0)\n```\n\n!clau Para comprobar una expresión, haz una **tabla de valores** como un juego de pruebas: 2100 → False, 2025 → False, 2024 → True, 2000 → True."}],"quiz":[{"id":"q1","q":"¿Qué da `not True and False or True`?","opts":["True","False","Error","None"],"a":0,"why":"not primero: False and False or True. Después and: False or True. Finalmente or: True.","ref":"d","run":"print(not True and False or True)"},{"id":"q2","q":"¿Qué da `1 + 2 * 3 < (1 + 2) * 3`?","opts":["True","False","7","9"],"a":0,"why":"Primero los aritméticos: 7 < 9. El resultado de la comparación es True.","ref":"d","run":"print(1 + 2 * 3 < (1 + 2) * 3)"},{"id":"q3","q":"¿Qué da `2 == 2.0`?","opts":["True","False","TypeError","2"],"a":0,"why":"== compara el valor. 2 y 2.0 valen lo mismo.","ref":"b","run":"print(2 == 2.0)"},{"id":"q4","q":"¿Qué da `True == 'True'`?","opts":["True","False","NameError","TypeError"],"a":1,"why":"'True' entre comillas es una cadena, no un booleano. Son datos distintos.","ref":"a","run":"print(True == 'True')"},{"id":"q5","q":"¿Cuál es la prioridad correcta de los operadores lógicos (de más a menos)?","opts":["and, or, not","or, and, not","not, and, or","Todos tienen la misma"],"a":2,"why":"not tiene más prioridad que and, y and más que or.","ref":"d"},{"id":"q6","q":"¿Qué pasa con `2 > 'hola'`?","opts":["False","True","TypeError","Compara las longitudes"],"a":2,"why":"No se puede establecer un orden entre un número y una cadena.","ref":"b"},{"id":"q7","q":"¿Qué expresión dice que `n` es múltiplo de 3?","opts":["`n / 3 == 0`","`n % 3 == 0`","`n // 3 == 0`","`n % 3 = 0`"],"a":1,"why":"Si el resto de dividir entre 3 es 0, n es múltiplo de 3. La última opción usa = (asignación): error.","ref":"f"},{"id":"q8","q":"¿Qué expresión detecta bien TODOS los años bisiestos?","opts":["`a % 4 == 0`","`a % 4 == 0 and a % 100 != 0`","`(a % 4 == 0 and a % 100 != 0) or a % 400 == 0`","`a % 400 == 0`"],"a":2,"why":"La segunda falla con el 2000. Hay que añadir el caso de los múltiplos de 400.","ref":"f"},{"id":"q9","q":"¿Qué pasa si escribes `true` (en minúsculas) en el intérprete?","opts":["Muestra True","Muestra 'true'","NameError","SyntaxError"],"a":2,"why":"Python lo interpreta como el nombre de una variable que no existe.","ref":"a"}],"ex":[{"id":"e1","type":"predict","t":"La expresión larga","prompt":"¿Qué muestra?","code":"print(not 5 <= 3 + 2 % 5 and False or 2 != 3)","out":"True","why":"Aritméticos: 5 <= 5 y 2 != 3. Relacionales: not True and False or True. not → False; and → False; or → True.","hint":"Orden: aritméticos, relacionales, not, and, or."},{"id":"e2","type":"predict","t":"Booleanos dentro de variables","prompt":"¿Qué muestra?","code":"a = 2 != -2 * (4 % 2)\nedad = 17\nes_mayor = edad >= 18\nprint(a, es_mayor)","out":"True False","why":"4 % 2 = 0, -2 * 0 = 0 y 2 != 0 es True. 17 >= 18 es False. Las variables pueden contener booleanos.","hint":"En la primera línea, haz primero el paréntesis."},{"id":"e3","type":"fill","t":"Año bisiesto","prompt":"Completa la expresión para que detecte correctamente si `a` es un año bisiesto.","code":"a = 2000\nprint((a % 4 == 0 and a % 100 [[0]] 0) [[1]] (a % 400 == 0))","blanks":[["!="],["or"]],"why":"Múltiplo de 4 y no de 100, o bien múltiplo de 400.","hint":"","out":"True"},{"id":"e4","type":"choice","t":"Entre dos valores","prompt":"¿Qué expresión es cierta cuando `x` está entre 1 y 10, ambos incluidos?","opts":["`x > 1 and x < 10`","`x >= 1 or x <= 10`","`x >= 1 and x <= 10`","`not x < 1 or x > 10`"],"a":2,"why":"Se tienen que cumplir las dos condiciones a la vez (and), con >= y <= porque los extremos cuentan. Con or, cualquier número sería cierto.","hint":""},{"id":"e5","type":"predict","t":"Tablas de verdad","prompt":"¿Qué muestra?","code":"a = True\nb = False\nprint(a and b, a or b, not b)","out":"False True True","why":"and necesita los dos ciertos. or tiene bastante con uno. not invierte False.","hint":""},{"id":"e6","type":"write","t":"Detector de años bisiestos","prompt":"Escribe un programa que lea un año y muestre True si es bisiesto y False si no lo es. Hazlo solo con una expresión booleana (sin if).","ee":"1 número entero positivo (un año).","tests":[{"in":"2024","out":"True"},{"in":"2025","out":"False"},{"in":"2100","out":"False"},{"in":"2000","out":"True"}],"solution":"anyo = int(input())\nes_bisiesto = (anyo % 4 == 0 and anyo % 100 != 0) or anyo % 400 == 0\nprint(es_bisiesto)","checks":["Conviertes la entrada a int","La variable booleana tiene un nombre que empieza por es_","La expresión funciona con el 2000 y con el 2100"],"hint":""}]},{"id":"t7","unit":2,"title":"Condicionales","summary":"if, else, elif, condicionales anidados y seguimiento","theory":[{"id":"a","t":"if: hacer algo solo si…","md":"La estructura **if** permite que el programa elija un camino según si una condición es cierta.\n\n```py\nif condicion:\n    instrucciones si es True\n```\n\nTres cosas obligatorias:\n\n- La palabra `if` y una **condición** (una expresión booleana).\n- Los **dos puntos** `:` al final de la línea.\n- Las instrucciones de dentro, **indentadas** (un tabulador más a la derecha).\n\n!clau En Python, la **indentación marca los bloques**. Hace el trabajo que en C o Java hacen las llaves `{ }`. Todas las líneas con la misma indentación bajo el if forman el bloque.\n\n```py\na = int(input())\nif a >= 0:\n    print('positivo')\nprint('Fin ejecución')\n```\n\nCon 5: muestra `positivo` y `Fin ejecución`. Con -3: solo `Fin ejecución`. La última línea no está indentada: se ejecuta siempre (es el camino común)."},{"id":"b","t":"if / else: dos caminos","md":"`else` significa «si no». Recoge todos los casos en que la condición es **False**.\n\n```py\nedad = int(input())\nif edad >= 18:\n    print('Bienvenido')\nelse:\n    print('Eres menor de edad')\n```\n\n!clau `else` **nunca** lleva condición y también termina con `:`. Solo puede ir después de un `if` (o de un `elif`).\n\nSi un texto necesita la misma comilla que lo delimita, se escapa con `\\`: `'l\\'edat'` (lo verás mucho en el material en catalán).\n\n**Juego de pruebas** del portero de discoteca (EE: 1 entero mayor o igual a 0):\n\n| Entrada | Salida |\n|---|---|\n| 16 | Eres menor de edad |\n| 18 | Bienvenido |\n| 87 | Bienvenido |\n| 0 | Eres menor de edad |\n\nHay un caso de cada camino, el **caso límite** donde cambia (18) y el caso donde empieza (0)."},{"id":"c","t":"Seguimiento con condicionales","md":"En los seguimientos se añade una columna **Condición** con el resultado de cada condición.\n\n```py\na = int(input())\nif a >= 0:\n    print('positivo o cero')\nelse:\n    print('negativo')\nprint('Fin ejecución')\n```\n\nSeguimiento con -3:\n\n| Línea | a | Condición | Salida |\n|---|---|---|---|\n| 1 | -3 | | |\n| 2 | | False | |\n| 4 | | | |\n| 5 | | | negativo |\n| 6 | | | Fin ejecución |\n\n!clau Cuando la condición es False, el procesador salta hasta el `else` y **sí pasa** por él (la línea del else se escribe en el seguimiento). Las líneas del camino que no se hace **no** salen en el seguimiento."},{"id":"d","t":"Condicionales anidados","md":"Un condicional es **anidado** (niat) cuando dentro de una rama hay otro condicional.\n\n```py\na = int(input())\nif a >= 0:\n    if a == 0:\n        print('cero')\n    else:\n        print('positivo')\nelse:\n    print('negativo')\nprint('Fin ejecución')\n```\n\nCon 5: la primera condición es True, entra; la segunda es False, va a su `else` y muestra `positivo`.\n\n!compte Cada `else` va con el `if` que tiene **la misma indentación**."},{"id":"e","t":"elif: tres o más alternativas","md":"Cuando tienes que elegir entre **tres o más** opciones del mismo peso, `elif` (else if) es más legible que anidar.\n\n```py\na = int(input())\nif a > 0:\n    print('positivo')\nelif a == 0:\n    print('cero')\nelse:\n    print('negativo')\nprint('Fin ejecución')\n```\n\n- La primera condición va con `if`, las siguientes con `elif`.\n- Puedes poner tantos `elif` como haga falta.\n- El `else` final es opcional y recoge **todos los casos restantes**.\n- Python evalúa las condiciones en orden y **solo ejecuta la primera rama cierta**. Las demás se saltan.\n\n!clau Hace exactamente lo mismo que la versión anidada, pero se lee mejor porque las tres opciones quedan al mismo nivel."},{"id":"f","t":"Cuidado: condicionales independientes","md":"Dos `if` seguidos **no** son lo mismo que `if` / `elif`.\n\n```py\nn = 15\nif n % 3 == 0:\n    print('múltiplo de 3')\nif n % 5 == 0:\n    print('múltiplo de 5')\n```\n\nMuestra las **dos** líneas: cada if se evalúa por separado.\n\n```py\nn = 15\nif n % 3 == 0:\n    print('múltiplo de 3')\nelif n % 5 == 0:\n    print('múltiplo de 5')\n```\n\nMuestra **solo** `múltiplo de 3`: cuando una rama es cierta, las demás se saltan.\n\n!clau Elige conscientemente: condicionales independientes (pueden pasar varias cosas) o una cadena if/elif/else (solo pasa una).\n\nRecuerda: el juego de pruebas debe tener **como mínimo un caso por cada camino** y los **casos límite*
