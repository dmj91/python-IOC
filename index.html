*."}],"quiz":[{"id":"q1","q":"¿Qué muestra este programa si `a` vale 0?","opts":["positivo","cero","negativo","cero y negativo"],"a":1,"why":"a > 0 es False; a == 0 es True: muestra cero y se salta el else.","ref":"e","code":"if a > 0:\n    print('positivo')\nelif a == 0:\n    print('cero')\nelse:\n    print('negativo')","run":"a = 0\nif a > 0:\n    print('positivo')\nelif a == 0:\n    print('cero')\nelse:\n    print('negativo')"},{"id":"q2","q":"¿Puede llevar condición un `else`?","opts":["Sí, siempre","No, nunca","Solo si va después de un elif","Solo dentro de un bucle"],"a":1,"why":"else recoge todos los casos restantes. La condición ya se ha evaluado en el if.","ref":"b"},{"id":"q3","q":"¿Qué es imprescindible al final de la línea `if edad >= 18`?","opts":["Un punto y coma","Dos puntos :","Una llave {","Nada"],"a":1,"why":"if, elif y else terminan con : y el bloque de debajo va indentado.","ref":"a"},{"id":"q4","q":"¿Qué muestra el código con `n = 15`?","opts":["A","B","A y B","Nada"],"a":2,"why":"Son dos if independientes: cada uno se evalúa. 15 es múltiplo de 3 y de 5.","ref":"f","code":"if n % 3 == 0:\n    print('A')\nif n % 5 == 0:\n    print('B')"},{"id":"q5","q":"En el portero de discoteca (`edad >= 18`), ¿qué caso es imprescindible en el juego de pruebas?","opts":["25","18","50","-1"],"a":1,"why":"18 es el caso límite donde cambia la respuesta. -1 no cumple las EE (entero ≥ 0).","ref":"b"},{"id":"q6","q":"¿Cuándo es mejor usar elif que if anidados?","opts":["Nunca, son distintos","Cuando tienes que elegir entre 3 o más alternativas del mismo peso","Cuando no hay else","Solo con números negativos"],"a":1,"why":"El resultado es el mismo, pero elif es más legible cuando todas las opciones pesan igual.","ref":"e"},{"id":"q7","q":"En el seguimiento de un if/else donde la condición es False…","opts":["Se escriben las líneas del bloque if","No se escribe la línea del else","Se escribe la línea del else y sus instrucciones","No se escribe nada más"],"a":2,"why":"El procesador entra en el else, por eso su línea aparece en el seguimiento aunque no cambie ninguna variable.","ref":"c"},{"id":"q8","q":"¿Qué indica que una instrucción forma parte del bloque de un if?","opts":["Que va entre llaves","Que está indentada bajo el if","Que acaba en ;","Que empieza con #"],"a":1,"why":"Python estructura los bloques con la indentación.","ref":"a"}],"ex":[{"id":"e1","type":"predict","t":"El portero de discoteca","prompt":"El usuario escribe 18. ¿Qué muestra?","code":"edad = int(input())\nif edad >= 18:\n    print('Bienvenido')\nelse:\n    print('Eres menor de edad')","out":"Bienvenido","why":"18 >= 18 es True. Es el caso límite: por eso >= y no >.","hint":"","stdin":"18"},{"id":"e2","type":"predict","t":"Independientes o encadenados","prompt":"¿Qué muestra este programa?","code":"n = 15\nif n % 3 == 0:\n    print('múltiplo de 3')\nif n % 5 == 0:\n    print('múltiplo de 5')\nif n % 3 == 0:\n    print('A')\nelif n % 5 == 0:\n    print('B')","out":"múltiplo de 3\nmúltiplo de 5\nA","why":"Los dos primeros if son independientes: se ejecutan los dos. En el if/elif, solo se ejecuta la primera rama cierta (A).","hint":"Un elif no se evalúa si el if de encima ya ha sido cierto."},{"id":"e3","type":"order","t":"Positivo, cero o negativo","prompt":"Ordena las líneas (ya tienen la indentación correcta) para hacer el programa con if/elif/else.","lines":["a = int(input())","if a > 0:","    print('positivo')","elif a == 0:","    print('cero')","else:","    print('negativo')","print('Fin ejecución')"],"why":"La lectura primero, después if → elif → else, y la línea común al final sin indentar.","hint":"","out":"cero\nFin ejecución","stdin":"0"},{"id":"e4","type":"bug","t":"Falta algo","prompt":"Este programa da SyntaxError. Toca la línea culpable.","code":"nota = float(input())\nif nota >= 5\n    print('aprobado')\nelse:\n    print('suspendido')","line":1,"why":"Faltan los dos puntos : al final de la línea del if.","hint":""},{"id":"e5","type":"fill","t":"Par o impar","prompt":"Completa la condición para que el programa diga si un número es par.","code":"n = int(input())\nif [[0]]:\n    print('par')\nelse:\n    print('impar')","blanks":[["n % 2 == 0","n%2==0","0 == n % 2","n % 2 != 1"]],"why":"Un número es par si el resto de dividirlo entre 2 es 0.","hint":"","out":"par","stdin":"8"},{"id":"e6","type":"predict","t":"Anidados","prompt":"El usuario escribe 5. ¿Qué muestra?","code":"a = int(input())\nif a >= 0:\n    if a == 0:\n        print('cero')\n    else:\n        print('positivo')\nelse:\n    print('negativo')\nprint('Fin ejecución')","out":"positivo\nFin ejecución","why":"5 >= 0 es True: entra. 5 == 0 es False: va al else interno. Después se salta el else externo y hace la línea común.","hint":"","stdin":"5"},{"id":"e7","type":"write","t":"Calificaciones","prompt":"Escribe un programa que lea una nota (float de 0 a 10) y muestre: suspenso (< 5), aprobado (< 7), notable (< 9) o sobresaliente (9 o más). Prepara también el juego de pruebas con los casos límite.","ee":"1 número float entre 0 y 10, incluidos.","tests":[{"in":"0","out":"suspenso"},{"in":"4.99","out":"suspenso"},{"in":"5","out":"aprobado"},{"in":"7","out":"notable"},{"in":"9","out":"sobresaliente"},{"in":"10","out":"sobresaliente"}],"solution":"nota = float(input())\n\nif nota < 5:\n    print('suspenso')\nelif nota < 7:\n    print('aprobado')\nelif nota < 9:\n    print('notable')\nelse:\n    print('sobresaliente')","checks":["Usas if / elif / else (solo una respuesta por nota)","El orden de las condiciones hace que no haga falta escribir dos comparaciones por tramo","El juego de pruebas incluye los límites 5, 7 y 9 y los extremos 0 y 10","Lees la nota con float()"],"hint":""}]},{"id":"t8","unit":3,"title":"El bucle while","summary":"Repetir mientras una condición es cierta","theory":[{"id":"a","t":"Por qué necesitamos bucles","md":"Programa para encontrar el máximo de 3 números positivos:\n\n```py\nmaximo = 0\n\nb = int(input())\nif b > maximo:\n    maximo = b\n\nb = int(input())\nif b > maximo:\n    maximo = b\n\nb = int(input())\nif b > maximo:\n    maximo = b\n\nprint(maximo)\n```\n\n¿Y si fueran 100 números? Hay un trozo que se **repite** igual para cada número. Por eso existen las **estructuras repetitivas** (bucles).\n\n!clau El **cuerpo del bucle** (cos del bucle) es el conjunto de instrucciones que se repiten."},{"id":"b","t":"while: repetir mientras…","md":"```py\nwhile condicion:\n    instrucciones del cuerpo del bucle\n```\n\nMientras la condición sea **True**, se repite el cuerpo. Cada vez que termina el cuerpo, se vuelve a evaluar la condición. Cuando es **False**, se sale y se continúa con lo que hay después.\n\nPara escribir un while, decide **cuatro cosas, en este orden**:\n\n1. El **cuerpo** del bucle (qué se repite).\n2. La **condición** de repetición.\n3. El **valor inicial** de la variable de la condición (**fuera**, antes del bucle).\n4. Cómo se **modifica** esa variable **dentro** del bucle.\n\n```py\nNUMEROS = 3\n\nmaximo = 0\ncontador = 0\nwhile contador < NUMEROS:\n    b = int(input())\n    if b > maximo:\n        maximo = b\n    contador = contador + 1\n\nprint(maximo)\n```\n\n!clau Se recomienda inicializar los contadores a **0** y usar `<`: `contador < 3` da 3 vueltas (0, 1, 2). Si empiezas en 1, hace falta `<= 3`."},{"id":"c","t":"¿Cuántas veces se evalúa la condición?","md":"Con 3 vueltas, el cuerpo se ejecuta **3 veces**, pero la condición se evalúa **4 veces**: la cuarta da False y es la que hace salir.\n\n!clau Del while siempre se sale **por la línea del while**, cuando la condición es falsa.\n\n**Operadores de asignación compuestos** (muy útiles en los bucles):\n\n| Escribes | Equivale a |\n|---|---|\n| `i += 1` | `i = i + 1` |\n| `i -= 1` | `i = i - 1` |\n| `p *= 2` | `p = p * 2` |\n| `x //= 10` | `x = x // 10` |\n\nTambién existen `/=`, `%=` y `**=`.\n\n!compte Una instrucción que solo se tiene que hacer **una vez** (como mostrar el resultado final) va **fuera** del bucle, sin indentar."},{"id":"d","t":"Dos ejemplos clásicos","md":"**Cuenta atrás** (EE: 1 entero ≥ 0):\n\n```py\nnum = int(input())\nwhile num >= 0:\n    print(num)\n    num -= 1\nprint('BUUUM')\n```\n\nCon 3 muestra 3, 2, 1, 0 y BUUUM. El `print('BUUUM')` va fuera: solo se hace una vez.\n\n**Potencias de 2 menores que un máximo**: aquí no sabemos cuántas vueltas dará, pero sí cuándo se tiene que detener.\n\n```py\nMAXIMO = 10\n\npotencia = 1\nwhile potencia < MAXIMO:\n    print(potencia)\n    potencia *= 2\n```\n\nMuestra 1, 2, 4, 8.\n\n!idea Para probar un programa, simplifica el enunciado: prueba con 10 antes que con 100. Cuando funcione, solo hace falta cambiar la constante."},{"id":"e","t":"Errores típicos con while","md":"**Bucle infinito**: si dentro del bucle **no se modifica** la variable de la condición, la condición no cambia nunca y no se sale.\n\n```py\nnum = int(input())\nwhile num >= 0:\n    print(num)\nprint('BUUUM')\n```\n\nMuestra 5, 5, 5, 5… para siempre. Para detenerlo: **Ctrl + C** (KeyboardInterrupt).\n\n**Una vuelta de más o de menos**: confundir `>` con `>=`, o inicializar mal. Por ejemplo, que no salga el 0 antes del BUUUM.\n\n!clau Comprueba siempre el juego de pruebas: el primer valor, el último, y cuántas vueltas da.\n\nOtra causa de error: inicializar la variable **dentro** del bucle. Cada vuelta volvería a empezar con el mismo valor."},{"id":"f","t":"Redirección: datos desde un fichero","md":"Escribir 1000 números a mano no tiene sentido. Los administradores **redirigen** un fichero a la entrada estándar (stdin).\n\n```sh\npython3 maximo_while.py < numeros.txt\n```\n\n`<` hace que el programa lea el fichero como si lo escribieras por teclado. Cada `input()` lee **una línea**.\n\n```sh\npython3 maximo_while.py > salida.txt\npython3 maximo_while.py < numeros.txt > salida.txt\n```\n\n`>` envía la salida a un fichero (lo crea o lo **sobrescribe**).\n\n!clau `<` entrada desde un fichero. `>` salida hacia un fichero.\n\n- **Ctrl + D** indica final de fichero (EOF) cuando escribes por teclado.\n- **Ctrl + C** interrumpe un programa.\n\nUn **programa interactivo** necesita que el usuario responda continuamente. Lo contrario es el **procesamiento por lotes** (batch), sin nadie delante: es lo que harán normalmente los administradores."},{"id":"g","t":"help(), import y números aleatorios","md":"`help()` muestra la documentación de una función o módulo en el intérprete (sales con **q**):\n\n```py\n>>> help(pow)\n```\n\nAlgunos módulos no están cargados por defecto: hay que **importarlos**. Para generar números aleatorios:\n\n```py\nimport random\n\nn_secreto = random.randint(1, 100)\n```\n\n!clau `random.randint(a, b)` devuelve un entero aleatorio entre a y b, **ambos incluidos**. Los `import` van al principio del programa, justo después de la cabecera y antes de las constantes.\n\nJuego de adivinar (interactivo):\n\n```py\nimport random\n\nn_secreto = random.randint(1, 100)\ncandidato = int(input('Escribe un número entre 1 y 100\\n'))\nwhile candidato != n_secreto:\n    if candidato < n_secreto:\n        print('El número que buscas es mayor')\n    else:\n        print('El número que buscas es menor')\n    candidato = int(input('Escribe un número entre 1 y 100\\n'))\nprint('¡Felicidades! El número era:', n_secreto)\n```"}],"quiz":[{"id":"q1","q":"Un while hace el cuerpo 3 veces. ¿Cuántas veces se evalúa la condición?","opts":["2","3","4","Depende de la condición"],"a":2,"why":"Las 3 vueltas que da True y una última que da False y hace salir.","ref":"c"},{"id":"q2","q":"¿A qué equivale `i += 1`?","opts":["`i = 1`","`i == i + 1`","`i = i + 1`","`i + 1 = i`"],"a":2,"why":"Es el operador compuesto de suma y asignación.","ref":"c"},{"id":"q3","q":"¿Dónde hay que inicializar la variable de la que depende la condición del while?","opts":["Dentro del bucle","Fuera, antes del bucle","Después del bucle","No hace falta inicializarla"],"a":1,"why":"Si se inicializa dentro, cada vuelta empieza igual y puede ser un bucle infinito. Si no se inicializa, NameError.","ref":"b"},{"id":"q4","q":"¿Cuál es la causa más habitual de un bucle infinito?","opts":["Poner un print dentro del bucle","No modificar dentro del bucle la variable de la condición","Usar constantes","Usar < en lugar de <="],"a":1,"why":"Si la variable no cambia, la condición tampoco y nunca se hace False.","ref":"e"},{"id":"q5","q":"`random.randint(1, 10)` puede devolver…","opts":["De 1 a 9","De 1 a 10","De 0 a 10","De 2 a 9"],"a":1,"why":"randint incluye los dos extremos.","ref":"g"},{"id":"q6","q":"¿Qué hace `python3 prog.py < datos.txt`?","opts":["Escribe la salida de prog.py en datos.txt","Hace que prog.py lea datos.txt como si fuera el teclado","Compara prog.py con datos.txt","Borra datos.txt"],"a":1,"why":"< redirige la entrada estándar. Cada input() lee una línea del fichero.","ref":"f"},{"id":"q7","q":"¿Cuántas líneas muestra este código?","opts":["4","5","6","Infinitas"],"a":0,"why":"Muestra 1, 2, 4 y 8. Cuando potencia vale 16, 16 < 10 es False y sale.","ref":"d","code":"potencia = 1\nwhile potencia < 10:\n    print(potencia)\n    potencia *= 2"},{"id":"q8","q":"¿Qué tecla interrumpe un programa que está en un bucle infinito?","opts":["Ctrl + D","Ctrl + C","Ctrl + Z","q"],"a":1,"why":"Ctrl + C lanza KeyboardInterrupt. Ctrl + D indica final de fichero.","ref":"e"}],"ex":[{"id":"e1","type":"predict","t":"Potencias de 2","prompt":"¿Qué muestra?","code":"MAXIMO = 10\n\npotencia = 1\nwhile potencia < MAXIMO:\n    print(potencia)\n    potencia *= 2","out":"1\n2\n4\n8","why":"Cuando potencia llega a 16, la condición es False y el bucle termina.","hint":"Escribe los valores de potencia vuelta a vuelta."},{"id":"e2","type":"predict","t":"Cuenta atrás","prompt":"El usuario escribe 3. ¿Qué muestra?","code":"num = int(input())\nwhile num >= 0:\n    print(num)\n    num -= 1\nprint('BUUUM')","out":"3\n2\n1\n0\nBUUUM","why":"Con >= 0 también se muestra el 0. BUUUM va fuera del bucle: una sola vez.","hint":"","stdin":"3"},{"id":"e3","type":"fill","t":"Cinco vueltas","prompt":"Completa el bucle para que muestre exactamente cinco veces «hola». El contador empieza en 0.","code":"contador = [[0]]\nwhile contador [[1]] 5:\n    print('hola')\n    contador [[2]] 1","blanks":[["0"],["<"],["+="]],"why":"Empezando en 0 y con < 5, da las vueltas 0, 1, 2, 3 y 4. En cada vuelta hay que sumar 1.","hint":"","out":"hola\nhola\nhola\nhola\nhola"},{"id":"e4","type":"bug","t":"Bucle infinito","prompt":"Este programa debería mostrar 0, 2, 4, 6 y 8, pero no se detiene nunca. Toca la línea donde está el error.","code":"n = 0\nwhile n < 10:\n    print(n)\n    n + 2","line":3,"why":"n + 2 calcula un valor pero no lo guarda. Tiene que ser n += 2 (o n = n + 2). Si no, n siempre vale 0.","hint":""},{"id":"e5","type":"order","t":"El máximo con while","prompt":"Ordena el programa que calcula el máximo de 3 números positivos.","lines":["NUMEROS = 3","maximo = 0","contador = 0","while contador < NUMEROS:","    b = int(input())","    if b > maximo:","        maximo = b","    contador += 1","print(maximo)"],"why":"Constante, inicializaciones fuera, while con el cuerpo indentado (lectura, comparación, incremento) y el print fuera.","hint":"Las dos inicializaciones pueden ir en cualquier orden, pero las dos antes del while.","out":"7","stdin":"2\n0\n7"},{"id":"e6","type":"write","t":"Suma de N números","prompt":"Escribe un programa que lea primero una cantidad N y después N números enteros, y muestre su suma. Hazlo con while.","ee":"1 entero N ≥ 0 y después N enteros cualesquiera, uno por línea.","tests":[{"in":"3\n4\n5\n1","out":"10"},{"in":"0","out":"0"},{"in":"2\n-3\n3","out":"0"}],"solution":"cantidad = int(input())\n\nsuma = 0\ncontador = 0\nwhile contador < cantidad:\n    numero = int(input())\n    suma += numero\n    contador += 1\n\nprint(suma)","checks":["La suma y el contador se inicializan a 0 fuera del bucle","El contador se incrementa dentro del bucle","El print del resultado está fuera del bucle","Funciona con N = 0 (muestra 0)"],"hint":""}]},{"id":"t9","unit":3,"title":"While avanzado","summary":"Condiciones compuestas, booleanos, banderas y bucles anidados","theory":[{"id":"a","t":"Ejemplo guía: ¿es primo?","md":"Un número es **primo** si solo es divisible por 1 y por sí mismo. A mano, buscas divisores empezando por el 2. **Cuando encuentras uno, te detienes**: ya sabes que no es primo.\n\nRecuerda: `a` es divisor de `b` si `b % a == 0`.\n\nPrimera versión (funciona, pero…):\n\n```py\nn = int(input())\n\ndiv = 2\nes_primo = True\nwhile div <= n - 1:\n    if n % div == 0:\n        es_primo = False\n    div = div + 1\n\nprint(es_primo)\n```\n\n!compte Con n = 100, encuentra que 2 es divisor a la primera vuelta… ¡y sigue hasta el 99! **No sigue el algoritmo** que haces a mano. El curso quiere que traduzcas el algoritmo natural."},{"id":"b","t":"Condiciones compuestas","md":"Una **condición compuesta** combina varias condiciones con `and` / `or`. Tenemos que seguir **mientras** queden divisores por probar **y** el número todavía sea primo:\n\n```py\nn = int(input())\n\ndiv = 2\nes_primo = True\nwhile div <= n - 1 and es_primo:\n    if n % div == 0:\n        es_primo = False\n    div = div + 1\n\nprint(es_primo)\n```\n\nAhora, con 100: en la segunda evaluación `3 <= 99 and False` es False y sale.\n\n!clau El while es la estructura adecuada cuando la salida depende de **varias condiciones**. Encuentra la expresión exacta para **continuar** (o la de salir, con un `not` delante).\n\nVersión sin variable booleana, también estructurada:\n\n```py\nn = int(input())\n\ndiv = 2\nwhile div < n and not n % div == 0:\n    div = div + 1\n\nes_primo = div == n\nprint(es_primo)\n```"},{"id":"c","t":"Variables booleanas bien nombradas","md":"Una variable booleana guarda información sobre el estado de otra cosa (`es_primo` dice algo de `n`).\n\n!clau Nómbralas empezando por **es_**: `es_primo`, `es_valido`, `es_mayor`. Así queda claro qué significa True.\n\n!compte Escribir `es_primo == True` es de **novato**. Si la variable ya es booleana, escribe solo `es_primo`. Y en lugar de `es_primo == False`, escribe `not es_primo`.\n\n```py\nwhile div < n and es_primo:\n```"},{"id":"d","t":"Banderas: con moderación","md":"Una **bandera** (bandera, flag) es una variable booleana que ayuda a salir de un bucle. Abusar de ellas hace el código difícil de leer.\n\nCon bandera (feo):\n\n```py\nbandera = True\nn = 0\nwhile bandera:\n    print(n)\n    n += 2\n    if n >= 10:\n        bandera = False\n```\n\nSin bandera (mejor):\n\n```py\nn = 0\nwhile n < 10:\n    print(n)\n    n += 2\n```\n\nHacen lo mismo, pero el segundo se entiende de un vistazo.\n\n!clau Siempre que uses un `if` para cambiar una bandera, puedes reescribir la **condición del while** para incluirlo directamente."},{"id":"e","t":"break: prohibido en este curso","md":"La **programación estructurada** dice que cualquier programa se puede hacer solo con **secuencia**, **selección** y **repetición**. Nació para eliminar el `goto` y el «código espagueti».\n\n`break` permite salir de un bucle «a lo bruto». En el curso está **prohibido**: rompe el orden del código y lo hace menos legible.\n\n!clau Si tienes la tentación de usar `break`, revisa la **condición del while** y añádele (con una condición compuesta) el motivo que te hacía salir.\n\n!compte En el curso la legibilidad es una de las cualidades más importantes. Cuando seas experto usarás break, pero tienes que saber que es prescindible."},{"id":"f","t":"Bucles dentro de bucles","md":"Un bucle puede contener otro bucle. Es difícil de seguir mentalmente, así que hace falta **disciplina**:\n\n- Haz primero el **refinamiento general**.\n- Separa los problemas: **ataca un bucle cada vez**.\n- A menudo conviene programar primero el **bucle interno**.\n\nEjemplo: primos menores que m.\n\n```py\nm = int(input())\n\nn = 2\nwhile n < m:\n    div = 2\n    while div < n and not n % div == 0:\n        div += 1\n    if div == n:\n        print(n)\n    n += 1\n```\n\nEl bucle interno es exactamente el programa «¿es primo?». El externo prueba cada n desde 2 hasta m - 1.\n\n!compte Fíjate en que `div = 2` se inicializa **dentro** del bucle externo: para cada n nuevo, hay que volver a empezar a buscar divisores desde 2."}],"quiz":[{"id":"q1","q":"¿Por qué la primera versión de «¿es primo?» no es buena?","opts":["Porque da resultados incorrectos","Porque sigue buscando divisores aunque ya haya encontrado uno","Porque usa una variable booleana","Porque no tiene condición"],"a":1,"why":"Funciona, pero no sigue el algoritmo natural: a mano te detienes cuando encuentras el primer divisor.","ref":"a"},{"id":"q2","q":"¿Cuál es la mejor manera de escribir la condición?","opts":["`while es_primo == True:`","`while es_primo:`","`while es_primo = True:`","`while True == es_primo:`"],"a":1,"why":"Si la variable es booleana, no hace falta compararla con True. La tercera, además, es un error de sintaxis.","ref":"c"},{"id":"q3","q":"En el curso, cuando necesitas salir antes de un bucle, ¿qué haces?","opts":["Usar break","Usar exit()","Añadir la condición de salida a la condición del while","Usar continue"],"a":2,"why":"break no está permitido. La solución estructurada es una condición compuesta en el while.","ref":"e"},{"id":"q4","q":"¿Qué es una bandera?","opts":["Un mensaje de error","Una variable booleana que ayuda a salir de un bucle","Una constante en mayúsculas","El contador de un bucle"],"a":1,"why":"Se pueden usar, pero no hay que abusar: casi siempre se puede integrar en la condición del while.","ref":"d"},{"id":"q5","q":"Con n = 9, ¿qué muestra la versión con condición compuesta de «¿es primo?»?","opts":["True","False","3","9"],"a":1,"why":"9 % 2 != 0, pero 9 % 3 == 0: es_primo pasa a False y el bucle termina.","ref":"b","run":"n = 9\ndiv = 2\nes_primo = True\nwhile div <= n - 1 and es_primo:\n    if n % div == 0:\n        es_primo = False\n    div = div + 1\nprint(es_primo)"},{"id":"q6","q":"¿Cómo hay que afrontar un programa con bucles anidados?","opts":["Escribir todo el código de golpe","Hacer el refinamiento y resolver un bucle cada vez","Usar break en el bucle interno","Evitarlos siempre"],"a":1,"why":"Separa los problemas: refinamiento general y un bucle cada vez, a menudo primero el interno.","ref":"f"},{"id":"q7","q":"Según el teorema de la programación estructurada, ¿con qué estructuras se puede hacer cualquier programa?","opts":["Secuencia, selección y repetición","if, break y goto","Funciones y clases","while y break"],"a":0,"why":"Secuencial, alternativa y repetitiva. goto, break y similares no son necesarios.","ref":"e"}],"ex":[{"id":"e1","type":"predict","t":"¿Es primo?","prompt":"El usuario escribe 15. ¿Qué muestra?","code":"n = int(input())\n\ndiv = 2\nes_primo = True\nwhile div <= n - 1 and es_primo:\n    if n % div == 0:\n        es_primo = False\n    div = div + 1\n\nprint(es_primo)","out":"False","why":"15 % 2 != 0, pero 15 % 3 == 0. es_primo pasa a False y en la siguiente evaluación el bucle termina.","hint":"","stdin":"15"},{"id":"e2","type":"predict","t":"Sin bandera","prompt":"¿Qué muestra?","code":"n = 0\nwhile n < 10:\n    print(n)\n    n += 2","out":"0\n2\n4\n6\n8","why":"Cuando n vale 10, la condición es False. Es la versión legible del programa con bandera.","hint":""},{"id":"e3","type":"fill","t":"Condición compuesta","prompt":"Completa la condición: hay que seguir mientras div sea menor que n y n no sea divisible por div.","code":"n = int(input())\ndiv = 2\nwhile div < n [[0]] not n % div == 0:\n    div += 1\nprint(div == n)","blanks":[["and"]],"why":"Hacen falta las dos condiciones a la vez: and.","hint":"","out":"True","stdin":"7"},{"id":"e4","type":"predict","t":"Bucles anidados","prompt":"¿Qué muestra?","code":"fila = 1\nwhile fila <= 3:\n    columna = 1\n    while columna <= fila:\n        print(fila * columna)\n        columna += 1\n    fila += 1","out":"1\n2\n4\n3\n6\n9","why":"Fila 1: columna 1 → 1. Fila 2: columnas 1 y 2 → 2, 4. Fila 3: columnas 1, 2, 3 → 3, 6, 9. La columna se reinicia en cada fila.","hint":"Para cada valor de fila, el bucle interno da tantas vueltas como el valor de fila."},{"id":"e5","type":"write","t":"Primos menores que m","prompt":"Escribe un programa que lea un entero m y muestre, uno por línea, todos los números primos menores que m. Sin break.","ee":"1 entero m mayor que 1.","tests":[{"in":"10","out":"2\n3\n5\n7"},{"in":"3","out":"2"},{"in":"2","out":""}],"solution":"m = int(input())\n\nn = 2\nwhile n < m:\n    div = 2\n    while div < n and not n % div == 0:\n        div += 1\n    if div == n:\n        print(n)\n    n += 1","checks":["No usas break","El bucle interno se detiene cuando encuentra un divisor (condición compuesta)","div se reinicia a 2 para cada n","Con 10 muestra 2, 3, 5 y 7"],"hint":""}]},{"id":"t10","unit":3,"title":"El bucle for y range()","summary":"Recorrer secuencias y contar con range","theory":[{"id":"a","t":"for in: para cada elemento","md":"Mostrar los 5 primeros múltiplos de 2 con while:\n\n```py\ni = 0\nwhile i < 5:\n    print(2 * i)\n    i = i + 1\n```\n\nLo mismo con **for in**:\n\n```py\nfor i in [0, 1, 2, 3, 4]:\n    print(2 * i)\n```\n\n```py\nfor variable in secuencia:\n    cuerpo del bucle\n```\n\n!clau El for repite el cuerpo **para cada elemento** de la secuencia. En la primera vuelta la variable vale el primer elemento, en la segunda el segundo… Cuando se acaban los elementos, sale.\n\n`[0, 1, 2, 3, 4]` es una **lista**: una secuencia de elementos entre `[ ]` separados por comas.\n\n!idea No hace falta inicializar ni incrementar nada: el for lo hace solo. Por eso es ideal cuando **ya sabes cuántas vueltas** tienes que dar."},{"id":"b","t":"Los operadores in y not in","md":"`in` también se puede usar fuera del for: dice si un elemento **está** dentro de una secuencia. Devuelve un booleano.\n\n```py\n>>> lista = [1, 2, 5, 7]\n>>> 3 in lista\nFalse\n>>> 7 in lista\nTrue\n>>> 7 not in lista\nFalse\n```\n\n!compte El entero `2` y la lista `[2]` no son lo mismo: `2 == [2]` da False."},{"id":"c","t":"range(): generar secuencias de números","md":"Escribir `[0, 1, 2, …, 99]` a mano sería absurdo. `range()` genera la secuencia por ti (no hace falta importar nada):\n\n| Llamada | Genera | Explicación |\n|---|---|---|\n| `range(5)` | 0, 1, 2, 3, 4 | de 0 hasta 5, **sin el 5** |\n| `range(1, 5)` | 1, 2, 3, 4 | de start hasta stop, sin stop |\n| `range(0, 10, 3)` | 0, 3, 6, 9 | de 3 en 3 |\n| `range(10, 0, -1)` | 10, 9, … , 1 | hacia atrás |\n| `range(3, 3)` | (nada) | vacío: no da ninguna vuelta |\n\n!clau **El stop nunca se incluye.** `range(start, stop, step)`: empieza en start, suma step y se detiene **antes** de llegar a stop.\n\nPara verlo como lista, en el intérprete: `list(range(1, 5))` da `[1, 2, 3, 4]`.\n\n!idea Truco: `range(n)` da exactamente n números, y coinciden con las posiciones válidas de una lista de n elementos."},{"id":"d","t":"Ejemplos con range","md":"Múltiplos de una base, con constantes:\n\n```py\nN = 5\nBASE = 2\n\nfor i in range(0, N):\n    multiplo = BASE * i\n    print(multiplo)\n```\n\nCuenta atrás desde un número leído hasta 0:\n\n```py\nnum = int(input())\nfor i in range(num, -1, -1):\n    print(i)\nprint('BUUUM')\n```\n\n- start = `num`: empieza por el número leído.\n- stop = `-1`: como el stop no se incluye, el último es 0.\n- step = `-1`: va bajando de uno en uno.\n\n!clau Con el for, la cuenta atrás es más corta y más legible que con while."},{"id":"e","t":"for recorre cualquier cosa iterable","md":"El for no solo recorre listas de números. Puede recorrer **cualquier secuencia**: listas de textos, **los caracteres de una cadena**…\n\n```py\nfor c in 'hola':\n    print(c)\n```\n\nMuestra h, o, l, a, uno por línea.\n\n```py\nfor nombre in ['Ana', 'Pedro']:\n    print('Hola', nombre)\n```\n\n!clau Un dato es **iterable** si se puede recorrer con un for: listas, cadenas, range…"}],"quiz":[{"id":"q1","q":"¿Qué genera `list(range(2, 10, 3))`?","opts":["[2, 5, 8]","[2, 5, 8, 11]","[3, 6, 9]","[2, 3, 4, 5, 6, 7, 8, 9]"],"a":0,"why":"Empieza en 2, suma 3 cada vez (5, 8) y se detiene antes de 10.","ref":"c","run":"print(list(range(2, 10, 3)))"},{"id":"q2","q":"¿Cuántos números genera `range(5)`?","opts":["4","5","6","0"],"a":1,"why":"0, 1, 2, 3, 4: cinco números. El 5 no se incluye.","ref":"c"},{"id":"q3","q":"¿Cuántas vueltas da `for i in range(3, 3):`?","opts":["0","1","3","Error"],"a":0,"why":"No hay ningún entero entre 3 (incluido) y 3 (excluido): el range está vacío.","ref":"c"},{"id":"q4","q":"Para hacer una cuenta atrás de 10 a 0 (incluido), ¿qué escribes?","opts":["`range(10, 0)`","`range(10, 0, -1)`","`range(10, -1, -1)`","`range(0, 10, -1)`"],"a":2,"why":"El stop no se incluye: para llegar a 0 el stop tiene que ser -1. Y el step -1 para bajar.","ref":"d"},{"id":"q5","q":"¿Qué da `7 in [1, 2, 5, 7]`?","opts":["True","False","3","7"],"a":0,"why":"in dice si el elemento está en la secuencia.","ref":"b","run":"print(7 in [1, 2, 5, 7])"},{"id":"q6","q":"¿Cuándo es especialmente adecuado el for in?","opts":["Cuando no sabes cuántas vueltas darás","Cuando sabes la cantidad de repeticiones o los valores concretos","Cuando tienes que salir a mitad del bucle","Nunca, siempre es mejor while"],"a":1,"why":"El for es ideal para contar o para recorrer elementos conocidos. Si la salida depende de una condición, while.","ref":"a"},{"id":"q7","q":"En `for c in 'hola':`, ¿de qué tipo es `c` en cada vuelta?","opts":["int","str (un carácter)","list","bool"],"a":1,"why":"Al recorrer una cadena, la variable toma cada carácter, que es una cadena de longitud 1.","ref":"e"}],"ex":[{"id":"e1","type":"predict","t":"Múltiplos con range","prompt":"¿Qué muestra?","code":"N = 5\nBASE = 2\n\nfor i in range(0, N):\n    print(BASE * i)","out":"0\n2\n4\n6\n8","why":"i toma 0, 1, 2, 3, 4 (el 5 no se incluye) y se muestra el doble.","hint":""},{"id":"e2","type":"predict","t":"Acumulando","prompt":"¿Qué muestra?","code":"total = 0\nfor n in range(1, 5):\n    total += n\nprint(total)","out":"10","why":"1 + 2 + 3 + 4 = 10. El 5 no se incluye. El print va fuera: se muestra una sola vez.","hint":"¿Qué valores toma n?"},{"id":"e3","type":"fill","t":"Cuenta atrás con for","prompt":"Completa el range para que la cuenta atrás vaya de 3 a 0, ambos incluidos.","code":"for i in range(3, [[0]], [[1]]):\n    print(i)\nprint('BUUUM')","blanks":[["-1"],["-1"]],"why":"Para incluir el 0, el stop tiene que ser -1. Para ir hacia atrás, el step es -1.","hint":"","out":"3\n2\n1\n0\nBUUUM"},{"id":"e4","type":"predict","t":"Recorriendo una cadena","prompt":"¿Qué muestra?","code":"for c in 'gato':\n    print(c * 2)","out":"gg\naa\ntt\noo","why":"c toma 'g', 'a', 't' y 'o'. Multiplicar una cadena por 2 la repite.","hint":""},{"id":"e5","type":"choice","t":"¿Qué lista?","prompt":"¿Qué muestra `print(list(range(10, 0, -3)))`?","opts":["[10, 7, 4, 1]","[10, 7, 4, 1, -2]","[10, 7, 4]","[]"],"a":0,"why":"10, 7, 4, 1… el siguiente sería -2, pero ya ha pasado el stop (0), que no se incluye.","hint":""},{"id":"e6","type":"write","t":"Tabla de multiplicar","prompt":"Escribe un programa que lea un entero y muestre su tabla de multiplicar del 1 al 10, con el formato «7 x 1 = 7». Hazlo con for.","ee":"1 entero cualquiera.","tests":[{"in":"7","out":"7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70"}],"solution":"numero = int(input())\n\nfor i in range(1, 11):\n    print(numero, 'x', i, '=', numero * i)","checks":["Usas for con range(1, 11)","No hay ningún contador manual (ni i += 1)","La salida tiene el formato pedido"],"hint":""}]},{"id":"t11","unit":3,"title":"Programación estructurada","summary":"Elegir entre while y for, y qué no se puede usar","theory":[{"id":"a","t":"Qué es la programación estructurada","md":"Es un paradigma para escribir código **legible y fácil de mantener**. Su objetivo principal era eliminar el `goto`, que convertía los programas en laberintos («código espagueti»).\n\nUn poco de historia:\n\n- **1966**: Böhm y Jacopini demuestran que todo programa se puede escribir con solo 3 estructuras de control.\n- **1968**: Dijkstra recomienda eliminar el `goto`.\n- **1968**: ALGOL 60 se modifica y se convierte en el primer lenguaje de programación estructurada.\n\n!clau Las 3 estructuras de control básicas: **secuencia** (una instrucción detrás de otra), **selección** (if) y **repetición** (while, for).\n\nUn **bloque** es un grupo de instrucciones (el de un if, un for, un while…). En Python se define con la indentación. De un bloque hay que **salir de manera ordenada**."},{"id":"b","t":"Lo que NO se puede usar en el curso","md":"| Sentencia | Qué hace | En el curso |\n|---|---|---|\n| `goto` | salta a otra línea | no existe en Python; la «bestia negra» |\n| `break` | sale de un bucle a lo bruto | **prohibido** |\n| `continue` | salta a la siguiente vuelta | **prohibido** |\n| `exit()` | termina el programa | **solo en el control de errores** |\n| `try` / `except` | gestiona excepciones | **no permitido**, ni para el control de errores |\n\n!clau El **programa principal** tiene que ser estructurado. El único permiso: `exit()` dentro del **control de errores**, que se considera un módulo aparte.\n\n¿Por qué tanto interés? Como administradores, gran parte del trabajo será **mantener programas de otros**. El código estructurado es mucho más fácil de entender y modificar."},{"id":"c","t":"¿while o for?","md":"Cuando en el refinamiento detectas una repetición, decide el bucle **antes** de codificar:\n\n**for in** cuando:\n\n- Sabes **a priori cuántas repeticiones** harás (contadores).\n- Sabes **exactamente qué valores** tiene que tomar la variable.\n\n**while** cuando:\n\n- La salida depende de **una o varias condiciones** que hay que comprobar.\n- **No sabes** de entrada cuántas vueltas darás.\n\n!clau De un **for no se puede salir** hasta que se han acabado todos los elementos. Si necesitas salir antes, has elegido mal: es un **while**.\n\nTodo lo que se hace con for se puede hacer con while. Al revés, no siempre (sin break)."},{"id":"d","t":"Ejemplo: ¿es primo con for? No","md":"Con for (funciona, pero recorre siempre hasta el final):\n\n```py\nn = int(input())\nes_primo = True\nfor div in range(2, n):\n    if n % div == 0:\n        es_primo = False\nprint(es_primo)\n```\n\nCon for + break (**no permitido** en el curso):\n\n```py\nfor div in range(2, n):\n    if n % div == 0:\n        es_primo = False\n        break\n```\n\nLa solución estructurada es un **while** con condición compuesta:\n\n```py\nn = int(input())\ndiv = 2\nwhile div < n and not n % div == 0:\n    div = div + 1\nprint(div == n)\n```\n\n!idea Pregúntate: «¿Sé cuántas vueltas daré?». Sí → for. Depende de lo que vaya encontrando → while."},{"id":"e","t":"else en los bucles: no lo uses","md":"Python tiene una particularidad: un bucle (for o while) puede llevar `else`, que se ejecuta cuando el bucle termina.\n\n```py\nfor i in range(0, 3):\n    print(i)\nelse:\n    print('saliendo del bucle')\nprint('final')\n```\n\nHace exactamente lo mismo que poner el print justo después del bucle, sin else. La única diferencia es que el else **no** se ejecuta si se ha salido con `break`.\n\n!clau El else en bucles no aporta nada en el curso (donde no hay break) y otros lenguajes no lo tienen. **No lo uses**: pon el código justo después del bucle."}],"quiz":[{"id":"q1","q":"¿Qué bucle usas para «leer números hasta que el usuario escriba un 0»?","opts":["for","while","Cualquiera de los dos con break","Ninguno: no se puede hacer"],"a":1,"why":"No sabes cuántas vueltas darás: depende de una condición. Es un while.","ref":"c"},{"id":"q2","q":"¿Qué bucle usas para «mostrar los números del 1 al 100»?","opts":["for","while con break","No hace falta bucle","Un if"],"a":0,"why":"Sabes exactamente qué valores tiene que tomar la variable: for con range(1, 101).","ref":"c"},{"id":"q3","q":"¿Dónde se permite usar `exit()` en el curso?","opts":["En ningún sitio","En el programa principal","Solo en el control de errores","Dentro de cualquier bucle"],"a":2,"why":"El control de errores se considera un módulo aparte y exit() aumenta su legibilidad.","ref":"b"},{"id":"q4","q":"¿Quién demostró en 1966 que todo programa se puede escribir con 3 estructuras?","opts":["Dijkstra","Böhm y Jacopini","Guido van Rossum","Abelson y Sussman"],"a":1,"why":"El teorema del programa estructurado es de Böhm y Jacopini (1966). Dijkstra recomendó eliminar el goto en 1968.","ref":"a"},{"id":"q5","q":"Si dentro de un for necesitas salir antes de terminar…","opts":["Usa break","Usa continue","Has elegido mal: tiene que ser un while","Usa else"],"a":2,"why":"De un for no se sale hasta el final. Si hay que salir antes, la condición de salida va en un while.","ref":"c"},{"id":"q6","q":"¿Se pueden usar try/except en el curso?","opts":["Sí, siempre","Solo para el control de errores","No, ni para el control de errores","Solo con listas"],"a":2,"why":"Las excepciones existen, pero en el curso no están permitidas.","ref":"b"},{"id":"q7","q":"¿Qué hace el else de un for cuando no hay break?","opts":["No se ejecuta nunca","Se ejecuta en cada vuelta","Se ejecuta al terminar el bucle, igual que el código que va justo después","Da error"],"a":2,"why":"Por eso no aporta nada: mejor poner el código después del bucle.","ref":"e"}],"ex":[{"id":"e1","type":"choice","t":"Elige el bucle (1)","prompt":"«Calcular la media de las notas de 25 alumnos.» ¿Qué bucle es el más adecuado?","opts":["for","while","Ninguno"],"a":0,"why":"Sabes exactamente que son 25 repeticiones: for con range(25).","hint":""},{"id":"e2","type":"choice","t":"Elige el bucle (2)","prompt":"«Leer contraseñas hasta que el usuario acierte una o llegue a 3 intentos.» ¿Qué bucle es el más adecuado?","opts":["for con break","while con condición compuesta","for sin nada más","Dos if"],"a":1,"why":"La salida depende de dos condiciones (acertar o agotar intentos): while con and.","hint":""},{"id":"e3","type":"predict","t":"else en un bucle","prompt":"¿Qué muestra?","code":"for i in range(0, 3):\n    print(i)\nelse:\n    print('saliendo')\nprint('final')","out":"0\n1\n2\nsaliendo\nfinal","why":"Sin break, el else se ejecuta siempre al terminar. Sería idéntico poniendo el print después del bucle, y es lo que tienes que hacer.","hint":""},{"id":"e4","type":"choice","t":"¿Estructurado o no?","prompt":"¿Cuál de estos fragmentos sigue las normas del curso?","opts":["Un for que hace break cuando encuentra el valor","Un while con condición compuesta que se detiene cuando lo encuentra","Un while True con break","Un for con continue"],"a":1,"why":"break y continue no están permitidos. La condición compuesta en el while es la solución estructurada.","hint":""},{"id":"e5","type":"write","t":"Del for+break al while","prompt":"Reescribe este programa sin break, de manera estructurada:\n\n```\nn = int(input())\nes_primo = True\nfor div in range(2, n):\n    if n % div == 0:\n        es_primo = False\n        break\nprint(es_primo)\n```","ee":"1 entero n > 1.","tests":[{"in":"7","out":"True"},{"in":"100","out":"False"},{"in":"2","out":"True"}],"solution":"n = int(input())\n\ndiv = 2\nes_primo = True\nwhile div < n and es_primo:\n    if n % div == 0:\n        es_primo = False\n    div += 1\n\nprint(es_primo)","checks":["No hay break ni continue","Usas while con una condición compuesta","El bucle se detiene al encontrar el primer divisor","La variable booleana se llama es_primo y no la comparas con True"],"hint":""}]},{"id":"t12","unit":4,"title":"Cadenas: lo básico","summary":"str, operadores, len, ord/chr, indexación y recorrido","theory":[{"id":"a","t":"El tipo str","md":"Una **cadena** (`str`) es una **secuencia de caracteres**. Hasta ahora conocías tipos **escalares** (int, float, bool): un solo elemento. Las cadenas se pueden trocear en caracteres.\n\n```py\n>>> a = 'hola'\n>>> b = \"adiós\"\n>>> c = ''\n```\n\n- Se pueden escribir con comillas simples o dobles (sé coherente).\n- `''` es la **cadena vacía**: no tiene ningún carácter.\n\n!clau Las cadenas son **inmutables**: no puedes cambiar un carácter de una cadena. Si quieres «holi», es una cadena nueva.\n\n```py\n>>> palabra = 'hola'\n>>> palabra[3] = 'i'\nTypeError: 'str' object does not support item assignment\n```"},{"id":"b","t":"Caracteres especiales (escapar)","md":"La barra invertida `\\` sirve para **escapar**: hace que el carácter que la sigue no tenga su significado especial.\n\n| Escribes | Significa |\n|---|---|\n| `\\'` | una comilla simple dentro de `'...'` |\n| `\\\"` | una comilla doble dentro de `\"...\"` |\n| `\\\\` | una barra invertida |\n| `\\n` | salto de línea |\n| `\\t` | tabulador |\n\n```py\n>>> print('It\\'s Python')\nIt's Python\n>>> print('Línea 1\\nLínea 2')\nLínea 1\nLínea 2\n```"},{"id":"c","t":"Operadores de cadenas","md":"| Operador | Hace | Ejemplo | Resultado |\n|---|---|---|---|\n| `+` | concatena | `'10' + ':' + '02'` | `'10:02'` |\n| `*` | repite (con un entero) | `3 * 'hola'` | `'holaholahola'` |\n| `==` / `!=` | igual / distinto | `'gato' == 'perro'` | `False` |\n| `in` | ¿es subcadena? | `'la' in 'hola'` | `True` |\n| `not in` | ¿no es subcadena? | `'z' not in 'hola'` | `True` |\n\n!compte `-2 * 'hola'` da la cadena vacía `''`, no un error.\n\n`==` solo es True si las dos cadenas son **exactamente** iguales (mayúsculas incluidas)."},{"id":"d","t":"Funciones: len, str, ord, chr","md":"**len()** devuelve la longitud (cantidad de caracteres):\n\n```py\n>>> len('hola')\n4\n>>> len('')\n0\n>>> len(' ')\n1\n```\n\n**Conversiones**: `str(3 + 4)` da `'7'`, `str(3) + str(4)` da `'34'`, `str(3 == 5)` da `'False'`.\n\n**ord()** y **chr()** relacionan un carácter con su posición en la **tabla ASCII**:\n\n```py\n>>> ord('a')\n97\n>>> chr(97)\n'a'\n>>> ord('7') - ord('3')\n4\n```\n\n!clau No hace falta saberse la tabla. Solo que las **cifras '0'..'9'**, las **mayúsculas 'A'..'Z'** y las **minúsculas 'a'..'z'** ocupan posiciones **consecutivas**. ('0' es 48, 'A' es 65, 'a' es 97.)\n\nUnicode amplía ASCII para todos los idiomas; los primeros 128 códigos coinciden."},{"id":"e","t":"Indexación: acceder por posición","md":"Cada carácter tiene una **posición** (índice). En Python, **se empieza a contar por 0**.\n\n| Índice | 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|---|\n| Carácter | P | y | t | h | o | n |\n\n```py\n>>> cadena = 'Python'\n>>> cadena[0]\n'P'\n>>> cadena[5]\n'n'\n>>> cadena[-1]\n'n'\n>>> cadena[6]\nIndexError: string index out of range\n```\n\n!clau Las posiciones válidas van de **0** a **len(cadena) - 1**. Los índices negativos cuentan desde el final: `-1` es el último."},{"id":"f","t":"Recorrer una cadena: dos maneras","md":"**Carácter a carácter** (manera natural). La variable toma directamente cada carácter:\n\n```py\nfor c in 'hola':\n    print(c)\n```\n\n**Por posición**. Cuando necesitas saber **dónde** está cada carácter:\n\n```py\ncadena = 'hola'\nfor i in range(0, len(cadena)):\n    print(i, cadena[i])\n```\n\nMuestra `0 h`, `1 o`, `2 l`, `3 a`.\n\n!clau En la manera natural, la variable es un **str**. Por posición, la variable es un **int** y el carácter se obtiene con `cadena[i]`.\n\nCondición para saber si un carácter `c` es una cifra:\n\n```py\nc >= '0' and c <= '9'\n```\n\nFunciona porque las cifras son consecutivas en la tabla ASCII."},{"id":"g","t":"Ejemplo: contar cifras","md":"Contar las cifras de un entero tratándolo como texto:\n\n```py\nn = int(input())\nnumero = str(n)\n\ntiene_signo = False\nif numero[0] in '+-':\n    tiene_signo = True\n\ncifras = len(numero)\nif tiene_signo:\n    cifras -= 1\n\nprint(cifras)\n```\n\nJuego de pruebas: 234 → 3, -23 → 2, 0 → 1.\n\n!idea Fíjate en que se usan **dos nombres de variable** distintos (`n` para el entero, `numero` para el texto). No reutilices el mismo nombre para tipos distintos: provoca confusión."}],"quiz":[{"id":"q1","q":"¿Qué da `len('hola' * 5)`?","opts":["4","5","9","20"],"a":3,"why":"'hola' * 5 es una cadena de 20 caracteres.","ref":"d","run":"print(len('hola' * 5))"},{"id":"q2","q":"Si `cadena = 'Python'`, ¿qué es `cadena[4]`?","opts":["'h'","'o'","'n'","IndexError"],"a":1,"why":"Se cuenta desde 0: P0 y1 t2 h3 o4 n5.","ref":"e","run":"cadena = 'Python'\nprint(cadena[4])"},{"id":"q3","q":"¿Qué pasa con `'Python'[6]`?","opts":["Devuelve ''","Devuelve 'n'","IndexError","Devuelve None"],"a":2,"why":"Las posiciones válidas van de 0 a 5. La 6 no existe.","ref":"e"},{"id":"q4","q":"¿Qué da `ord('7') - ord('3')`?","opts":["4","'4'","10","Error"],"a":0,"why":"Las cifras son consecutivas en la tabla ASCII.","ref":"d","run":"print(ord('7') - ord('3'))"},{"id":"q5","q":"¿Qué da `str(3) + str(4)`?","opts":["7","'7'","'34'","Error"],"a":2,"why":"Son dos cadenas: + las concatena.","ref":"d"},{"id":"q6","q":"¿Qué da `-2 * 'hola'`?","opts":["Error","'aloh'","''","'-hola-hola'"],"a":2,"why":"Repetir una cadena un número negativo de veces da la cadena vacía.","ref":"c","run":"print(repr(-2 * 'hola'))"},{"id":"q7","q":"¿Por qué `palabra[0] = 'H'` da error?","opts":["Porque 0 no es una posición válida","Porque las cadenas son inmutables","Porque hay que usar chr()","Porque faltan comillas"],"a":1,"why":"Las cadenas no se pueden modificar. Tienes que crear una cadena nueva.","ref":"a"},{"id":"q8","q":"En `for i in range(len(texto)):`, ¿qué es `i`?","opts":["Cada carácter","Cada posición (un entero)","La longitud","Una lista"],"a":1,"why":"Recorrido por posición: i es un entero y el carácter es texto[i].","ref":"f"}],"ex":[{"id":"e1","type":"predict","t":"Por posición","prompt":"¿Qué muestra?","code":"cadena = 'hola'\nfor i in range(0, len(cadena)):\n    print(i, cadena[i])","out":"0 h\n1 o\n2 l\n3 a","why":"i toma 0, 1, 2 y 3 (len es 4 y el stop no se incluye).","hint":""},{"id":"e2","type":"predict","t":"Operadores de cadena","prompt":"¿Qué muestra?","code":"hora = '10'\nminuto = '02'\nprint(hora + ':' + minuto)\nprint('*' * 5)\nprint('la' in 'hola', 'z' in 'hola')","out":"10:02\n*****\nTrue False","why":"+ concatena, * repite e in comprueba si es subcadena.","hint":""},{"id":"e3","type":"fill","t":"¿Es una cifra?","prompt":"Completa la condición para que cuente las cifras de una cadena.","code":"texto = input()\ncifras = 0\nfor c in texto:\n    if c >= [[0]] and c <= [[1]]:\n        cifras += 1\nprint(cifras)","blanks":[["'0'","\"0\""],["'9'","\"9\""]],"why":"Comparas caracteres, por eso van entre comillas: '0' y '9'. Las cifras son consecutivas en ASCII.","hint":"","out":"3","stdin":"R2D2 C3PO"},{"id":"e4","type":"predict","t":"Índices negativos","prompt":"¿Qué muestra?","code":"palabra = 'Python'\nprint(palabra[0], palabra[-1], len(palabra))","out":"P n 6","why":"0 es el primero, -1 el último y la longitud es 6.","hint":""},{"id":"e5","type":"write","t":"Contar vocales","prompt":"Escribe un programa que lea una frase y muestre cuántas vocales minúsculas sin tilde (a, e, i, o, u) tiene.","ee":"Una cadena cualquiera.","tests":[{"in":"hola","out":"2"},{"in":"programar en python","out":"5"},{"in":"xyz","out":"0"}],"solution":"VOCALES = 'aeiou'\n\nfrase = input()\n\nvocales = 0\nfor c in frase:\n    if c in VOCALES:\n        vocales += 1\n\nprint(vocales)","checks":["Recorres la cadena carácter a carácter con for","Usas el operador in con una constante de vocales","El contador se inicializa fuera del bucle"],"hint":""}]},{"id":"t13","unit":4,"title":"Cadenas avanzado","summary":"Comparación, slicing, métodos y f-strings","theory":[{"id":"a","t":"Comparar cadenas: orden lexicográfico","md":"Las cadenas también se pueden comparar con `< > <= >=`. El orden es **lexicográfico**, basado en la tabla ASCII:\n\n- Se comparan los **primeros caracteres**. Si son iguales, los segundos, y así sucesivamente.\n- Gana (es menor) la cadena con el primer carácter distinto **más pequeño**.\n- Si una es el principio de la otra, la más corta es menor: `'a' < 'ab'`.\n- La cadena vacía es menor que cualquier otra.\n\n!clau Orden ASCII: **cifras < mayúsculas < minúsculas**.\n\n```py\n>>> 'a' < 'b'\nTrue\n>>> 'python' < 'Python'\nFalse\n>>> 'Python' >= '0'\nTrue\n```\n\n!compte Las cadenas numéricas no se comparan como números: `'11' < '2'` es **True**, porque '1' < '2'. Conviértelas a int si quieres comparar valores."},{"id":"b","t":"Slicing: recortar subcadenas","md":"```py\ncadena[inicio:final]\n```\n\nDevuelve una **subcadena nueva** desde `inicio` hasta **antes** de `final` (¡como range!).\n\n```py\n>>> a = 'Palabras blancas'\n>>> a[1:4]\n'ala'\n>>> a[:8]\n'Palabras'\n>>> a[9:]\n'blancas'\n>>> a[:-1]\n'Palabras blanca'\n>>> a[:]\n'Palabras blancas'\n```\n\n- Sin inicio: desde el principio. Sin final: hasta el final.\n- Acepta negativos: `[:-1]` es todo menos el último.\n\n!clau A diferencia de la indexación, **el slicing nunca da error**: si las posiciones no existen, devuelve la cadena vacía. `a[30:40]` da `''`, pero `a[30]` da IndexError.\n\nTruco: `texto[0:1]` es el primer carácter, pero si texto está vacío devuelve `''` en lugar de fallar."},{"id":"c","t":"Métodos de cadenas","md":"Un **método** es una función que pertenece a un objeto. Se llama con un punto: `objeto.metodo(argumentos)`.\n\n| Método | Hace | Ejemplo | Resultado |\n|---|---|---|---|\n| `count(s)` | cuántas veces aparece s | `'hello world'.count('o')` | `2` |\n| `find(s)` | primera posición de s, o **-1** | `'hello'.find('l')` | `2` |\n| `index(s)` | como find, pero si no está: **ValueError** | `'hello'.index('a')` | error |\n| `isdigit()` | ¿solo cifras? | `'123'.isdigit()` | `True` |\n| `islower()` / `isupper()` | ¿todo minúsculas / mayúsculas? | `'Hello'.islower()` | `False` |\n| `lower()` / `upper()` | pasa a minúsculas / mayúsculas | `'Hola'.upper()` | `'HOLA'` |\n| `replace(a, b)` | sustituye a por b | `'Hello'.replace('Hello', 'Hola')` | `'Hola'` |\n\n!compte Las cadenas son inmutables: `lower()`, `upper()` y `replace()` **devuelven una cadena nueva**; no cambian la original. Si quieres el resultado, guárdalo: `nombre = nombre.upper()`.\n\nUn método de str solo lo puede llamar una cadena: `231.find('1')` da `AttributeError`. Para verlos todos: `help(str)`."},{"id":"d","t":"f-strings: formatear la salida","md":"Las **f-strings** (desde Python 3.6) son la manera que usa el curso para formatear texto. Pones una `f` delante y las variables entre `{ }`:\n\n```py\n>>> nombre = 'Pepe'\n>>> edad = 30\n>>> f'Me llamo {nombre} y tengo {edad} años.'\n'Me llamo Pepe y tengo 30 años.'\n```\n\nUsos más habituales:\n\n| Escribes | Resultado | Para |\n|---|---|---|\n| `f'{3 / 7}'` | `'0.42857142857142855'` | operaciones dentro |\n| `f'{3 / 7:.2f}'` | `'0.43'` | 2 decimales |\n| `f'{9:02}:{5:02}'` | `'09:05'` | ceros a la izquierda |\n| `f'{9:5}'` | `'    9'` | ocupar 5 posiciones |\n\n!idea Otras maneras (no las usarás, pero tienes que reconocerlas): `'Me llamo %s y tengo %d años' % (nombre, edad)` y `'Me llamo {} y tengo {} años'.format(nombre, edad)`.\n\n!clau Redondea solo en la salida: calcula con todos los decimales y muestra con `:.2f`."},{"id":"e","t":"Ejemplo completo: ¿es un float?","md":"Programa que dice si una cadena se puede convertir a float, y muestra su valor con 2 decimales. Combina slicing, find, isdigit y f-strings:\n\n```py\nentrada = input()\ncadena = entrada\n\nif cadena[0:1] in '+-':\n    cadena = cadena[1:]\n\npunto = cadena.find('.')\nparte_decimal = ''\nif punto != -1:\n    parte_decimal = cadena[punto + 1:]\n    cadena = cadena[:punto]\n\nes_float = ((cadena.isdigit() or cadena == '')\n            and (parte_decimal.isdigit() or parte_decimal == '')\n            and (cadena != '' or parte_decimal != ''))\n\nif es_float:\n    print(f'{entrada} tiene un valor {float(entrada):.2f}')\nelse:\n    print(f'{entrada} no se puede convertir a float')\n```\n\n- `cadena[0:1]` evita el error si la entrada está vacía.\n- `find` devuelve -1 si no hay punto.\n- La línea larga se parte dentro de paréntesis."}],"quiz":[{"id":"q1","q":"Si `a = 'Palabras blancas'`, ¿qué es `a[1:4]`?","opts":["'Pal'","'ala'","'alab'","'alb'"],"a":1,"why":"De la posición 1 hasta antes de la 4: a, l, a.","ref":"b","run":"a = 'Palabras blancas'\nprint(a[1:4])"},{"id":"q2","q":"¿Qué da `'hola'[10:20]`?","opts":["IndexError","''","'hola'","None"],"a":1,"why":"El slicing nunca da error: si no hay caracteres, devuelve la cadena vacía.","ref":"b"},{"id":"q3","q":"¿Qué da `'11' < '2'`?","opts":["True","False","TypeError","Depende del ordenador"],"a":0,"why":"Comparación lexicográfica: '1' < '2' en el primer carácter, y ya está decidido.","ref":"a","run":"print('11' < '2')"},{"id":"q4","q":"¿Qué da `'python' < 'Python'`?","opts":["True","False","Error","Son iguales"],"a":1,"why":"En ASCII las mayúsculas van antes que las minúsculas: 'p' es mayor que 'P'.","ref":"a","run":"print('python' < 'Python')"},{"id":"q5","q":"¿Qué devuelve `'hola'.find('z')`?","opts":["0","-1","None","ValueError"],"a":1,"why":"find devuelve -1 si no encuentra la subcadena. index, en cambio, daría ValueError.","ref":"c"},{"id":"q6","q":"¿Qué da `f'{3 / 7:.2f}'`?","opts":["'0.42'","'0.43'","'0.4285'","'3/7'"],"a":1,"why":":.2f muestra 2 decimales redondeando.","ref":"d","run":"print(f'{3 / 7:.2f}')"},{"id":"q7","q":"¿Qué da `f'{9:02}:{5:02}'`?","opts":["'9:5'","'09:05'","'90:50'","'02:02'"],"a":1,"why":":02 rellena con ceros hasta 2 posiciones.","ref":"d","run":"print(f'{9:02}:{5:02}')"},{"id":"q8","q":"Después de `nombre = 'ana'` y `nombre.upper()`, ¿cuánto vale `nombre`?","opts":["'ANA'","'ana'","'Ana'","None"],"a":1,"why":"upper() devuelve una cadena nueva; nombre no cambia porque las cadenas son inmutables y no se ha guardado el resultado.","ref":"c"},{"id":"q9","q":"¿Qué da `'hello world'.count('o')`?","opts":["1","2","4","-1"],"a":1,"why":"Hay una o en hello y otra en world.","ref":"c","run":"print('hello world'.count('o'))"}],"ex":[{"id":"e1","type":"predict","t":"Slicing","prompt":"¿Qué muestra?","code":"a = 'el Python es muy fácil'\nprint(a[3:9])\nprint(a[:2])\nprint(a[-5:])\nprint(a[30:40] == '')","out":"Python\nel\nfácil\nTrue","why":"[3:9] son las posiciones 3 a 8. [:2] los dos primeros. [-5:] los cinco últimos. [30:40] no existe: devuelve ''.","hint":""},{"id":"e2","type":"predict","t":"Métodos","prompt":"¿Qué muestra?","code":"texto = 'Hello World'\nprint(texto.lower())\nprint(texto.find('o'), texto.count('l'))\nprint(texto.replace('World', 'Mundo'))\nprint(texto)","out":"hello world\n4 3\nHello Mundo\nHello World","why":"Los métodos devuelven cadenas nuevas. La última línea demuestra que texto no ha cambiado.","hint":""},{"id":"e3","type":"fill","t":"Hora con formato","prompt":"Completa la f-string para que muestre la hora con dos cifras: 09:05.","code":"h = 9\nm = 5\nprint(f'{h:[[0]]}:{m:[[1]]}')","blanks":[["02","02d"],["02","02d"]],"why":":02 rellena con ceros a la izquierda hasta 2 posiciones.","hint":"","out":"09:05"},{"id":"e4","type":"predict","t":"Precio con dos decimales","prompt":"¿Qué muestra?","code":"IVA = 21\nprecio = 12.99\nprecio_final = precio + precio * IVA / 100\nprint(f'Total: {precio_final:.2f} €')","out":"Total: 15.72 €","why":"12.99 · 1.21 = 15.7179. Con :.2f se muestra redondeado a 15.72. El cálculo se hace con todos los decimales y se redondea solo en la salida.","hint":""},{"id":"e5","type":"write","t":"Usuario y dominio","prompt":"Escribe un programa que lea una dirección de correo (con una sola @) y muestre el usuario y el dominio, cada uno en una línea. Usa find() y slicing.","ee":"Una cadena con exactamente una @.","tests":[{"in":"david@ioc.cat","out":"david\nioc.cat"},{"in":"a@b","out":"a\nb"}],"solution":"correo = input()\n\narroba = correo.find('@')\nusuario = correo[:arroba]\ndominio = correo[arroba + 1:]\n\nprint(usuario)\nprint(dominio)","checks":["Encuentras la posición de @ con find()","Usas slicing para obtener las dos partes","El dominio no incluye la @ (arroba + 1)"],"hint":""}]},{"id":"t14","unit":4,"title":"Control de errores","summary":"Programas robustos con exit() y el juego de pruebas de errores","theory":[{"id":"a","t":"La filosofía del administrador","md":"Hasta ahora solo escribías las especificaciones de entrada (EE). Ahora haremos programas **robustos**: que no fallen nunca, escriba lo que escriba el usuario.\n\n!clau Si los datos **no cumplen** las EE, el programa muestra un **mensaje de uso** y **termina**. No vuelve a pedir el dato ni intenta adivinar qué quería el usuario. Como hacen las órdenes de Linux.\n\n```txt\n$ grep\nUsage: grep [OPTION]... PATTERNS [FILE]...\n```\n\nLos datos llegan siempre como **str** (por stdin o por la línea de órdenes). Por eso el control de errores va muy ligado a las cadenas: comprobamos el texto **antes** de convertirlo."},{"id":"b","t":"exit() y los códigos de salida","md":"`exit()` detiene el programa **inmediatamente**. Admite un entero: el **código de salida**.\n\n| Código | Significa |\n|---|---|\n| `0` | Todo ha ido bien (es lo que se envía por defecto al terminar) |\n| distinto de 0 | Ha habido algún error |\n\n!clau En el curso: `exit(1)` cuando los datos no cumplen las EE. Muestra siempre **el mensaje antes** de llamar a exit.\n\n!compte `exit()` rompe la programación estructurada: **solo** se puede usar en el **control de errores**, nunca en el programa principal."},{"id":"c","t":"Ejemplo: la letra del DNI","md":"La letra del DNI es el resto de dividir el número entre 23, buscado en una tabla de letras.\n\n```py\nMENSAJE = 'DNI correcto: 8 dígitos sin empezar por 0'\nLETRAS_DNI = 'TRWAGMYFPDXBNJZSQVHLCKE'\n\ndni_c = input()\n\nif not dni_c.isdigit():\n    print(MENSAJE)\n    exit(1)\n\nif not len(dni_c) == 8:\n    print(MENSAJE)\n    exit(1)\n\nif dni_c[0] == '0':\n    print(MENSAJE)\n    exit(1)\n\ndni = int(dni_c)\n\npos = dni % len(LETRAS_DNI)\nprint(LETRAS_DNI[pos])\n```\n\nEstructura:\n\n- Un **mensaje constante** (no hace falta un mensaje distinto para cada error).\n- Una serie de `if` con la **condición mala** (la que NO cumple las EE). Si ves más clara la buena, ponle un `not` delante.\n- Dentro de cada if: `print(MENSAJE)` y `exit(1)`.\n- Si se llega al final, el dato es bueno: se convierte y empieza el **programa principal**, en la primera columna."},{"id":"d","t":"¿Por qué no con if / else?","md":"Se podría hacer el control con if/else anidados:\n\n```py\nif not dni_c.isdigit():\n    print(MENSAJE)\nelse:\n    if not len(dni_c) == 8:\n        print(MENSAJE)\n    else:\n        dni = int(dni_c)\n        print(LETRAS_DNI[dni % 23])\n```\n\n!compte Problemas: **legibilidad** (el programa principal queda enterrado entre indentaciones) y **reutilización** (cuesta separar el control de errores del programa).\n\nVentajas de hacerlo con `exit()` antes del programa principal:\n\n- El programa principal queda en la primera columna: fácil de leer.\n- El control de errores es un **módulo** que se puede añadir, quitar o modificar.\n- Las validaciones se pueden probar y reutilizar por separado."},{"id":"e","t":"Excepciones: existen, pero no en el curso","md":"Python tiene las **excepciones** (`try` / `except`) para recoger los errores cuando ya se han producido:\n\n```py\ntry:\n    dni = int(entrada)\nexcept:\n    print(MENSAJE)\n    exit(1)\n```\n\n!clau En el curso **no están permitidas**, ni siquiera para el control de errores. Tienes que evitar el error **antes** de que pase, comprobando la cadena (isdigit, len, slicing…)."},{"id":"f","t":"El juego de pruebas del control de errores","md":"Es una tabla **independiente** del juego de pruebas del programa principal. Para cada entrada solo dice si **se acepta** (True) o **no** (False).\n\nEE del DNI: todos los caracteres numéricos, exactamente 8, y no empieza por 0.\n\n| Entrada | ¿Se acepta? |\n|---|---|\n| 12345678 | True |\n| 123456789 | False |\n| no tengo dni | False |\n| 23.378.887 | False |\n| -1234567 | False |\n| 01234567 | False |\n| 1234567F | False |\n\n!clau Tiene que tener como mínimo un caso que incumpla **cada** condición de las EE. Y se diseña **antes** de codificar el control de errores.\n\n!compte Orden de trabajo: primero haz y verifica el **programa principal**. El control de errores se añade **después**."}],"quiz":[{"id":"q1","q":"¿Qué código de salida indica que el programa ha terminado bien?","opts":["0","1","-1","200"],"a":0,"why":"0 es éxito por convenio. Cualquier otro valor indica algún error.","ref":"b"},{"id":"q2","q":"En el curso, ¿con qué valor llamas a exit() cuando los datos no cumplen las EE?","opts":["exit(0)","exit(1)","exit(-1)","exit('error')"],"a":1,"why":"El curso usa 0 (por defecto, todo bien) y 1 (no se han respetado las EE).","ref":"b"},{"id":"q3","q":"¿Se puede usar try/except para el control de errores en el curso?","opts":["Sí","No","Solo con int()","Solo si hay exit()"],"a":1,"why":"Las excepciones no están permitidas en el curso. Hay que comprobar la cadena antes de convertirla.","ref":"e"},{"id":"q4","q":"¿Dónde va el control de errores?","opts":["Al final del programa","Antes del programa principal","Dentro del programa principal","En otro fichero"],"a":1,"why":"Primero se descartan los datos malos; si se llega al programa principal, el dato es bueno.","ref":"c"},{"id":"q5","q":"¿Qué salidas tiene el juego de pruebas del control de errores?","opts":["El resultado del programa","Solo True o False (se acepta o no)","El mensaje de error","El código de salida"],"a":1,"why":"Indica si cada entrada se acepta y se procesa o si el programa tiene que cortar.","ref":"f"},{"id":"q6","q":"¿Por qué NO es buena idea hacer el control de errores con if/else anidados?","opts":["Porque no funciona","Porque empeora la legibilidad y la reutilización","Porque es más lento","Porque Python no lo permite"],"a":1,"why":"El programa principal queda enterrado entre indentaciones y es difícil de separar.","ref":"d"},{"id":"q7","q":"¿Qué tiene que pasar si el usuario escribe un dato incorrecto?","opts":["Volver a pedirlo hasta que sea bueno","Mostrar un mensaje de uso y terminar","Intentar corregirlo","Continuar con un valor por defecto"],"a":1,"why":"Como las órdenes de Linux: mensaje y salida. Si el usuario quiere, lo vuelve a ejecutar.","ref":"a"}],"ex":[{"id":"e1","type":"choice","t":"¿Se acepta?","prompt":"Con las EE del DNI (8 cifras, sin empezar por 0), ¿qué entrada se acepta?","opts":["01234567","1234567F","23456789","123456789"],"a":2,"why":"23456789 tiene 8 caracteres, todos cifras, y no empieza por 0. Las otras fallan alguna condición.","hint":""},{"id":"e2","type":"order","t":"Ordena el control de errores","prompt":"Ordena el programa: constantes, lectura, control de errores y programa principal.","lines":["MENSAJE = 'Hace falta un entero positivo'","entrada = input()","if not entrada.isdigit():","    print(MENSAJE)","    exit(1)","n = int(entrada)","print(n * 2)"],"why":"Primero las constantes, después lees, compruebas la condición mala (con exit dentro) y solo entonces conviertes.","hint":"","out":"42","stdin":"21"},{"id":"e3","type":"predict","t":"Un dato malo","prompt":"El usuario escribe 01234567. ¿Qué muestra el programa?","code":"MENSAJE = 'DNI correcto: 8 dígitos sin empezar por 0'\nLETRAS_DNI = 'TRWAGMYFPDXBNJZSQVHLCKE'\n\ndni_c = input()\n\nif not dni_c.isdigit():\n    print(MENSAJE)\n    exit(1)\n\nif not len(dni_c) == 8:\n    print(MENSAJE)\n    exit(1)\n\nif dni_c[0] == '0':\n    print(MENSAJE)\n    exit(1)\n\ndni = int(dni_c)\nprint(LETRAS_DNI[dni % len(LETRAS_DNI)])","out":"DNI correcto: 8 dígitos sin empezar por 0","why":"Pasa las dos primeras comprobaciones, pero empieza por 0: muestra el mensaje y sale con exit(1).","hint":"","stdin":"01234567"},{"id":"e4","type":"fill","t":"La condición mala","prompt":"Completa el control para que salga si la entrada no está formada solo por cifras.","code":"MENSAJE = 'Uso: hace falta un entero positivo'\nentrada = input()\nif [[0]] entrada.isdigit():\n    print(MENSAJE)\n    exit(1)\nprint(int(entrada) + 1)","blanks":[["not"]],"why":"En el if que contiene el exit va la condición mala. Como tienes clara la buena (isdigit), le pones not delante.","hint":"","out":"42","stdin":"41"},{"id":"e5","type":"write","t":"Cuadrado robusto","prompt":"Escribe un programa robusto que lea un entero (puede llevar signo + o -) y muestre su cuadrado. Si la entrada no es un entero, tiene que mostrar «Uso: un número entero» y salir con código 1.","ee":"Una cadena cualquiera (control de errores). Válida: un entero con signo opcional.","tests":[{"in":"-3","out":"9"},{"in":"+4","out":"16"},{"in":"abc","out":"Uso: un número entero"},{"in":"","out":"Uso: un número entero"},{"in":"+-2","out":"Uso: un número entero"}],"solution":"MENSAJE = 'Uso: un número entero'\n\nentrada = input()\n\ncifras = entrada\nif cifras[0:1] in '+-':\n    cifras = cifras[1:]\n\nif not cifras.isdigit():\n    print(MENSAJE)\n    exit(1)\n\nn = int(entrada)\nprint(n ** 2)","checks":["El mensaje es una constante","Quitas el signo con slicing antes de comprobar isdigit()","Usas [0:1] y no [0] (la cadena vacía no falla)","exit(1) solo dentro del control de errores","No usas try/except"],"hint":""}]},{"id":"t15","unit":4,"title":"Listas y sys.argv","summary":"Listas, recorridos y datos por la línea de órdenes","theory":[{"id":"a","t":"El tipo list","md":"Una **lista** es una secuencia **ordenada** y **mutable** de elementos, entre corchetes `[ ]`.\n\n```py\nl_int = [1, 2, 3, 4]\nnombres = ['María', 'Pedro', 'juan manuel']\nvocales = ['a', 'e', 'i', 'o', 'u']\nlista_vacia = []\nlista_de_listas = [[], [0], [0, 1], [0, 1, 2]]\n```\n\n- **Ordenada**: cada elemento tiene una posición.\n- **Heterogénea**: puede mezclar tipos, pero se recomienda que todos sean del **mismo tipo**.\n- **Mutable**: se puede modificar (a diferencia de las cadenas).\n\n!clau Muchas cosas funcionan **igual que con cadenas**: len, +, *, indexación, slicing, in, recorridos con for."},{"id":"b","t":"Operaciones como las cadenas","md":"```py\n>>> lista = [2, 3, 7, 10, 4]\n>>> len(lista)\n5\n>>> lista[0]\n2\n>>> lista[-1]\n4\n>>> lista[len(lista)]\nIndexError: list index out of range\n>>> lista[1:3]\n[3, 7]\n>>> lista[10:15]\n[]\n>>> [2, 3] + [5, 6]\n[2, 3, 5, 6]\n>>> [2, 3] * 2\n[2, 3, 2, 3]\n>>> 7 in lista\nTrue\n```\n\n!compte En una lista de listas, `len` cuenta las listas de dentro, no sus elementos: `len([[], [0], [0, 1]])` es 3.\n\n`'o' in ['hola']` es **False**: la lista contiene la cadena 'hola', no la letra 'o'. En cambio `'o' in 'hola'` es True."},{"id":"c","t":"Tres maneras de recorrer una lista","md":"**1. Natural** (elemento a elemento):\n\n```py\nfor elemento in lista:\n    print(elemento)\n```\n\n**2. Por posición** (cuando necesitas saber dónde está, o **modificar** la lista):\n\n```py\nfor pos in range(len(lista)):\n    print(pos, lista[pos])\n```\n\n**3. Con while** (cuando quizá **no llegas al final**):\n\n```py\npos = 0\nwhile pos < len(lista) - 1:\n    print(lista[pos])\n    pos += 1\n```\n\n!clau Una lista solo se puede **modificar** recorriéndola **por posición**. Recorriéndola de manera natural, la variable es una copia del elemento: cambiarla no cambia la lista.\n\n```py\nfor pos in range(len(lista)):\n    lista[pos] = lista[pos] * 2\n```"},{"id":"d","t":"Comparar listas","md":"- `==` y `!=`: iguales si tienen la misma longitud y los mismos elementos en cada posición.\n- `< > <= >=`: orden parecido al lexicográfico, elemento a elemento. Solo si los elementos son comparables.\n\n```py\n>>> [1, 2] < [1, 2]\nFalse\n>>> [1, 2, 3] <= [1, 2]\nFalse\n>>> [2] < [1, 2, 3]\nFalse\n>>> ['1', '2'] < ['1', '12']\nFalse\n>>> [1, 2, 3] <= ['hola', 'adiós']\nTypeError\n```\n\n!compte En el penúltimo: los elementos son cadenas, y `'2'` es mayor que `'12'` (lexicográfico)."},{"id":"e","t":"Datos por la línea de órdenes: sys.argv","md":"Como las órdenes de Linux (`head -3 fichero`), un programa puede recibir los datos **como argumentos**:\n\n```sh\npython3 programa.py 4\n```\n\n```py\nimport sys\nprint(sys.argv)\n```\n\nMuestra `['programa.py', '4']`.\n\n!clau `sys.argv` es una **lista de str**:\n\n- Hay que **importar** el módulo `sys`.\n- `sys.argv[0]` es el **nombre del programa**.\n- `sys.argv[1]` es el primer argumento, `sys.argv[2]` el segundo…\n- Cada **espacio** separa un argumento. Para agrupar palabras, comillas: `'R2D2 C3P0'` es un solo argumento.\n- Siempre son **cadenas**: hay que convertirlas si quieres números.\n\n```sh\npython3 programa.py -23 'R2D2 C3P0'\n```\n\nda `['programa.py', '-23', 'R2D2 C3P0']`."},{"id":"f","t":"Control de errores con sys.argv","md":"**Lo primero de todo**, comprueba que el argumento existe. Si no, `sys.argv[1]` daría IndexError.\n\n```py\nimport sys\n\nMENSAJE = 'Usage: programa.py numero_entero'\nVALOR = -0.5\n\nif len(sys.argv) <= 1:\n    print(MENSAJE)\n    exit(1)\n\nprimer_argumento = sys.argv[1]\nif primer_argumento[0] in '+-':\n    primer_argumento = primer_argumento[1:]\n\nif not primer_argumento.isdigit():\n    print(MENSAJE)\n    exit(1)\n\nnum = int(sys.argv[1])\nprint(num * VALOR)\n```\n\n- Los argumentos que sobran normalmente no molestan.\n- A `int()` se le pasa `sys.argv[1]` (con el signo), no la versión recortada.\n\n!clau Cuándo usar cada entrada: **línea de órdenes** para pocos datos o parámetros (es lo habitual en los scripts de administración). **stdin redirigido** cuando los datos están en un fichero (hasta que aprendas a abrir ficheros)."}],"quiz":[{"id":"q1","q":"¿Qué da `len([[], [0], [0, 1]])`?","opts":["3","4","2","0"],"a":0,"why":"La lista tiene 3 elementos (tres listas). No se cuentan los elementos de dentro.","ref":"b"},{"id":"q2","q":"¿Qué da `[2, 3] * 2`?","opts":["[4, 6]","[2, 3, 2, 3]","[[2, 3], [2, 3]]","Error"],"a":1,"why":"* repite los elementos, como con las cadenas.","ref":"b","run":"print([2, 3] * 2)"},{"id":"q3","q":"Si `l = [2, 3, 7]`, ¿qué es `l[len(l)]`?","opts":["7","3","IndexError","None"],"a":2,"why":"La última posición válida es len(l) - 1 = 2.","ref":"b"},{"id":"q4","q":"¿Qué da `'o' in ['hola']`?","opts":["True","False","Error","1"],"a":1,"why":"La lista contiene un solo elemento: la cadena 'hola'. 'o' no es ningún elemento.","ref":"b","run":"print('o' in ['hola'])"},{"id":"q5","q":"Ejecutas `python3 p.py -23 'R2D2 C3P0'`. ¿Cuánto vale `len(sys.argv)`?","opts":["2","3","4","1"],"a":1,"why":"['p.py', '-23', 'R2D2 C3P0']: las comillas unen las dos palabras en un solo argumento.","ref":"e"},{"id":"q6","q":"¿Qué hay en `sys.argv[0]`?","opts":["El primer argumento","El nombre del programa","La cantidad de argumentos","Nada"],"a":1,"why":"La posición 0 es el nombre del fichero que se ejecuta.","ref":"e"},{"id":"q7","q":"¿De qué tipo son los elementos de `sys.argv`?","opts":["int","str","Depende de lo que escribas","bool"],"a":1,"why":"Siempre cadenas, igual que input(). Hay que convertirlas.","ref":"e"},{"id":"q8","q":"Para modificar los elementos de una lista con un for, ¿cómo la tienes que recorrer?","opts":["De manera natural","Por posición","Con break","No se puede"],"a":1,"why":"Solo accediendo por índice (lista[pos] = …) se modifica la lista.","ref":"c"},{"id":"q9","q":"¿Qué da `['1', '2'] < ['1', '12']`?","opts":["True","False","TypeError","None"],"a":1,"why":"Primeros elementos iguales. Segundos: '2' vs '12'; lexicográficamente '2' > '12'. Por tanto la primera lista es mayor.","ref":"d","run":"print(['1', '2'] < ['1', '12'])"}],"ex":[{"id":"e1","type":"predict","t":"Operaciones con listas","prompt":"¿Qué muestra?","code":"lista = [2, 3, -3, 5, 2, 0]\nprint(lista[:3])\nprint(lista[-1], len(lista))\nprint(lista[10:15])","out":"[2, 3, -3]\n0 6\n[]","why":"Slicing igual que con cadenas. Las posiciones inexistentes en el slicing dan una lista vacía.","hint":""},{"id":"e2","type":"predict","t":"¿Natural o por posición?","prompt":"¿Qué muestra?","code":"nums = [1, 2, 3]\nfor n in nums:\n    n = n * 10\nprint(nums)\nfor pos in range(len(nums)):\n    nums[pos] = nums[pos] * 10\nprint(nums)","out":"[1, 2, 3]\n[10, 20, 30]","why":"En el primer bucle n es una copia: la lista no cambia. En el segundo se accede por posición y sí se modifica.","hint":"Cambiar n no es lo mismo que cambiar nums[pos]."},{"id":"e3","type":"fill","t":"Comprueba el argumento","prompt":"Completa el control: si no hay ningún argumento, muestra el mensaje y sale.","code":"import sys\n\nMENSAJE = 'Usage: doble.py numero_entero'\n\nif len(sys.argv) [[0]] 1:\n    print(MENSAJE)\n    exit(1)\n\nprint(int(sys.argv[1]) * 2)","blanks":[["<="]],"why":"Si len(sys.argv) es 1, solo está el nombre del programa. También valdría == 1, pero <= 1 es lo que usa el curso.","hint":""},{"id":"e4","type":"choice","t":"¿Qué contiene sys.argv?","prompt":"Ejecutas `python3 calc.py 5 hola`. ¿Qué es `sys.argv`?","opts":["['5', 'hola']","['calc.py', 5, 'hola']","['calc.py', '5', 'hola']","['python3', 'calc.py', '5', 'hola']"],"a":2,"why":"Empieza por el nombre del programa y todos los elementos son cadenas, también el 5.","hint":""},{"id":"e5","type":"write","t":"El máximo de los argumentos","prompt":"Escribe un programa que reciba números enteros positivos por la línea de órdenes y muestre el mayor. Si no hay ningún argumento o alguno no es un entero positivo, muestra «Usage: maximo.py n1 [n2 ...]» y sale con código 1.","ee":"Uno o más enteros positivos como argumentos.","tests":[{"in":"","out":"9","argv":["3","9","4"]},{"in":"","out":"Usage: maximo.py n1 [n2 ...]","argv":[]},{"in":"","out":"Usage: maximo.py n1 [n2 ...]","argv":["3","x"]}],"solution":"import sys\n\nMENSAJE = 'Usage: maximo.py n1 [n2 ...]'\n\nif len(sys.argv) <= 1:\n    print(MENSAJE)\n    exit(1)\n\nfor argumento in sys.argv[1:]:\n    if not argumento.isdigit():\n        print(MENSAJE)\n        exit(1)\n\nmaximo = int(sys.argv[1])\nfor argumento in sys.argv[2:]:\n    numero = int(argumento)\n    if numero > maximo:\n        maximo = numero\n\nprint(maximo)","checks":["Importas sys al principio","Compruebas len(sys.argv) antes de acceder a sys.argv[1]","Compruebas cada argumento con isdigit() antes de convertir","Haces el algoritmo del máximo empezando por el primer argumento","No usas sys.argv[0] como dato"],"hint":""}]},{"id":"t16","unit":4,"title":"Listas y cadenas","summary":"Mutabilidad, métodos, None, split/join, tuplas y referencias","theory":[{"id":"a","t":"Mutable o inmutable","md":"**Mutable** significa que el objeto se puede modificar **sin crear uno nuevo**.\n\n| Tipo | ¿Mutable? |\n|---|---|\n| `list` | **Sí** |\n| `str` | No |\n| `tuple` | No |\n| `int`, `float`, `bool` | No |\n\nLa función `id()` devuelve el identificador único de un objeto. Si una lista cambia, su id se mantiene:\n\n```py\n>>> lista = [1, 2, 3, 4]\n>>> id(lista)\n140246465077952\n>>> lista[1] = 5\n>>> id(lista)\n140246465077952\n>>> lista\n[1, 5, 3, 4]\n```\n\n!clau Dos listas pueden ser **iguales** (`==` True) y **no ser el mismo objeto** (id distinto)."},{"id":"b","t":"Añadir y eliminar elementos","md":"**Añadir**: con `+` o con el método `append()`.\n\n```py\n>>> lista = [1, 2, 3]\n>>> lista + [4]\n[1, 2, 3, 4]\n>>> lista\n[1, 2, 3]\n>>> lista.append(4)\n>>> lista\n[1, 2, 3, 4]\n```\n\n!clau `+` **crea una lista nueva** (la original no cambia). `append()` **modifica** la lista y **no devuelve nada**.\n\n**Eliminar**: la palabra clave `del`.\n\n```py\n>>> lista = [1, 2, 3]\n>>> del lista[1]\n>>> lista\n[1, 3]\n```\n\n!compte No hagas `del` en una lista mientras la recorres: cambian la longitud y los índices."},{"id":"c","t":"Métodos de listas","md":"Todos modifican la lista **in situ** (mantienen la misma identidad):\n\n| Método | Hace | Ejemplo con `l = [1, 2, 3, 2]` |\n|---|---|---|\n| `append(x)` | añade x al final | `[1, 2, 3, 2, x]` |\n| `extend(lista2)` | añade todos los elementos de otra | |\n| `insert(i, x)` | inserta x en la posición i | `l.insert(1, 4)` → `[1, 4, 2, 3, 2]` |\n| `remove(x)` | elimina la **primera** aparición de x | `l.remove(2)` → `[1, 3, 2]` |\n| `pop(i)` | elimina y **devuelve** el elemento i (el último si no hay i) | `l.pop(1)` devuelve 2 |\n| `index(x)` | primera posición de x | `l.index(2)` → 1 |\n| `count(x)` | cuántas veces está x | `l.count(2)` → 2 |\n\nPara verlos todos: `help(list)`."},{"id":"d","t":"El objeto None","md":"`None` representa la **ausencia de valor**. Es del tipo especial `NoneType`.\n\nEs lo que devuelven las funciones y métodos que **no devuelven nada**, como `append()`:\n\n```py\n>>> lista = [1, 2, 3]\n>>> resultado = lista.append(4)\n>>> print(resultado)\nNone\n```\n\n!compte Error típico: `lista = lista.append(4)`. ¡Ahora lista vale None y has perdido la lista!\n\n!clau `None` no es lo mismo que `''`, `[]` ni `0`. Una variable con `''` contiene una cadena (vacía). Una variable con None es una caja que no contiene nada."},{"id":"e","t":"Convertir entre cadenas y listas","md":"**list()**: cadena a lista de caracteres.\n\n```py\n>>> list('hola')\n['h', 'o', 'l', 'a']\n```\n\n**split()**: corta una cadena por el separador y devuelve una lista. Sin argumento, corta por los espacios en blanco (espacios, \\t, \\n).\n\n```py\n>>> 'Esta es una frase'.split()\n['Esta', 'es', 'una', 'frase']\n>>> '27/12/2030'.split('/')\n['27', '12', '2030']\n```\n\n**join()**: lo contrario. Se llama desde el **separador** y recibe la lista:\n\n```py\n>>> ' '.join(['a', 'b', 'c'])\n'a b c'\n>>> ''.join(['h', 'o', 'l', 'a'])\n'hola'\n>>> '-'.join(['10', '02'])\n'10-02'\n```\n\n!clau `split` y `join` son inversos: `sep.join(texto.split(sep))` devuelve el texto original."},{"id":"f","t":"Tuplas","md":"Una **tupla** es una secuencia ordenada e **inmutable**. Se define con paréntesis `( )`.\n\n```py\n>>> tup = (1, 2, 3)\n>>> tup[0]\n1\n>>> tup + (5, 6)\n(1, 2, 3, 5, 6)\n>>> tup[0] = 9\nTypeError: 'tuple' object does not support item assignment\n```\n\n| | str | list | tuple |\n|---|---|---|---|\n| Elementos | caracteres | cualquiera | cualquiera |\n| Mutable | No | **Sí** | No |\n| Se define con | `' '` | `[ ]` | `( )` |\n\nLas tres: indexación, slicing, len, for, + y *. Conversiones: `tuple(lista)`, `list(tupla)`."},{"id":"g","t":"Referencias: cuidado con las copias","md":"Una **variable es una referencia**: un nombre que apunta a un objeto de la memoria.\n\n```py\n>>> lista1 = [1, 2, 3]\n>>> lista2 = lista1\n>>> lista2[0] = 99\n>>> lista1\n[99, 2, 3]\n```\n\n!compte `lista2 = lista1` **no copia** la lista: las dos variables apuntan **al mismo objeto**. Si cambias una, cambia «la otra».\n\nCon objetos inmutables no pasa: si `num2 = num1` y después `num1 = 10`, num1 apunta a un objeto nuevo y num2 sigue valiendo el valor antiguo.\n\n!idea Si necesitas una copia de verdad, una manera es `lista2 = lista1[:]` (el slicing crea una lista nueva)."},{"id":"h","t":"Listas de listas (multidimensionales)","md":"Un tablero de tres en raya es una lista de 3 filas, y cada fila una lista de 3 caracteres:\n\n```py\ninicio = '... ... ...'\ntablero = inicio.split()\nfor i in range(len(tablero)):\n    tablero[i] = list(tablero[i])\n\ntablero[1][1] = 'O'\ntablero[0][2] = 'X'\n\nfor fila in tablero:\n    print(''.join(fila))\n```\n\nMuestra:\n\n```txt\n..X\n.O.\n...\n```\n\n!clau `tablero[0][2]`: primer índice = la fila (lista de dentro), segundo índice = la columna (elemento de la fila).\n\n**Listas como tablas de consulta** (ejemplo del calendario):\n\n```py\nSEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado']\nDIAS_MES = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]\n\nultimo_dia = DIAS_MES[mes]\ndia_semana = SEMANA[i]\n```\n\nSustituyen una larga cadena de if/elif y el programa gana mucha legibilidad."}],"quiz":[{"id":"q1","q":"¿Qué muestra el código?","opts":["[1, 2, 3]","[1, 2, 3, 4]","None","Error"],"a":2,"why":"append() modifica la lista pero devuelve None. x guarda ese None.","ref":"d","code":"l = [1, 2, 3]\nx = l.append(4)\nprint(x)","run":"l = [1, 2, 3]\nx = l.append(4)\nprint(x)"},{"id":"q2","q":"¿Cuánto vale `lista1` al final?","opts":["[1, 2, 3]","[99, 2, 3]","[99]","Error"],"a":1,"why":"lista2 apunta al mismo objeto que lista1. Cambiar una es cambiar la otra.","ref":"g","code":"lista1 = [1, 2, 3]\nlista2 = lista1\nlista2[0] = 99","run":"lista1 = [1, 2, 3]\nlista2 = lista1\nlista2[0] = 99\nprint(lista1)"},{"id":"q3","q":"¿Qué da `'27/12/2030'.split('/')`?","opts":["['27', '12', '2030']","[27, 12, 2030]",
