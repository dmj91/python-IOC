"'27 12 2030'","['27/12/2030']"],"a":0,"why":"split corta por '/' y devuelve una lista de cadenas.","ref":"e","run":"print('27/12/2030'.split('/'))"},{"id":"q4","q":"¿Qué da `'-'.join(['a', 'b', 'c'])`?","opts":["'abc'","'a-b-c'","['a-b-c']","'-a-b-c-'"],"a":1,"why":"join pone el separador entre los elementos.","ref":"e","run":"print('-'.join(['a', 'b', 'c']))"},{"id":"q5","q":"¿Qué pasa con `t = (1, 2); t[0] = 5`?","opts":["t vale (5, 2)","TypeError","t vale [5, 2]","No pasa nada"],"a":1,"why":"Las tuplas son inmutables.","ref":"f"},{"id":"q6","q":"Con `l = [1, 2, 3, 2]`, ¿qué hace `l.remove(2)`?","opts":["Elimina todos los 2","Elimina el primer 2","Elimina la posición 2","Devuelve 2"],"a":1,"why":"remove elimina la primera aparición. Para eliminar por posición: del l[2] o l.pop(2).","ref":"c"},{"id":"q7","q":"¿Qué diferencia hay entre `l + [4]` y `l.append(4)`?","opts":["Ninguna","+ crea una lista nueva; append modifica l","append crea una lista nueva; + modifica l","+ solo funciona con números"],"a":1,"why":"El + deja la original intacta. append la modifica y no devuelve nada.","ref":"b"},{"id":"q8","q":"¿Cuál de estos tipos es mutable?","opts":["str","tuple","list","int"],"a":2,"why":"Solo las listas se pueden modificar sin crear una nueva.","ref":"a"},{"id":"q9","q":"En `tablero[0][2]`, ¿qué indica el 0?","opts":["La columna","La fila (la lista de dentro)","El carácter","La longitud"],"a":1,"why":"El primer índice elige la lista de dentro; el segundo, el elemento de esa lista.","ref":"h"}],"ex":[{"id":"e1","type":"predict","t":"Referencias","prompt":"¿Qué muestra?","code":"a = [1, 2, 3]\nb = a\nc = a[:]\nb[0] = 99\nprint(a)\nprint(c)","out":"[99, 2, 3]\n[1, 2, 3]","why":"b es otra referencia al mismo objeto: cambiar b cambia a. c es una copia nueva hecha con slicing.","hint":""},{"id":"e2","type":"predict","t":"split y join","prompt":"¿Qué muestra?","code":"frase = 'Esta es una frase cualquiera'\npalabras = frase.split()\nprint(len(palabras))\nprint('-'.join(palabras))\nprint(''.join(['h', 'o', 'l', 'a']))","out":"5\nEsta-es-una-frase-cualquiera\nhola","why":"split() corta por los espacios: 5 palabras. join las une con el separador desde el que se llama.","hint":""},{"id":"e3","type":"predict","t":"Métodos de listas","prompt":"¿Qué muestra?","code":"l = [1, 2, 3, 2]\nl.insert(1, 4)\nprint(l)\nl.remove(2)\nprint(l)\nprint(l.pop(), l)","out":"[1, 4, 2, 3, 2]\n[1, 4, 3, 2]\n2 [1, 4, 3]","why":"insert pone el 4 en la posición 1. remove elimina el primer 2. pop() sin argumento quita y devuelve el último.","hint":""},{"id":"e4","type":"bug","t":"La lista perdida","prompt":"Después de ejecutarlo, `nombres` vale None. Toca la línea culpable.","code":"nombres = ['Ana', 'Pedro']\nnuevo = input()\nnombres = nombres.append(nuevo)\nprint(nombres)","line":2,"why":"append() modifica la lista y devuelve None. Si lo asignas a nombres, pierdes la lista. Tiene que ser solo nombres.append(nuevo).","hint":""},{"id":"e5","type":"predict","t":"Tablero","prompt":"¿Qué muestra?","code":"tablero = [list('...'), list('...'), list('...')]\ntablero[1][1] = 'O'\ntablero[0][2] = 'X'\nfor fila in tablero:\n    print(''.join(fila))","out":"..X\n.O.\n...","why":"tablero[1][1] es el centro y tablero[0][2] la esquina superior derecha. join une cada fila en una cadena.","hint":""},{"id":"e6","type":"write","t":"Nombre del mes","prompt":"Escribe un programa que lea una fecha en formato dd/mm/aaaa (correcta) y muestre el día, el nombre del mes y el año. Ejemplo: 27/12/2030 → 27 de diciembre de 2030. Usa split() y una lista constante con los nombres de los meses.","ee":"Una cadena con una fecha correcta en formato dd/mm/aaaa.","tests":[{"in":"27/12/2030","out":"27 de diciembre de 2030"},{"in":"05/03/2026","out":"5 de marzo de 2026"}],"solution":"MESES = ['', 'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',\n         'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']\n\nfecha = input()\ncampos = fecha.split('/')\ndia = int(campos[0])\nmes = int(campos[1])\nanyo = int(campos[2])\n\nprint(dia, 'de', MESES[mes], 'de', anyo)","checks":["Usas split('/') para trocear la fecha","Los nombres de los meses están en una lista constante en mayúsculas","Accedes al mes por índice en lugar de hacer 12 if/elif","Conviertes el día a int para que 05 salga como 5"],"hint":"Si pones una cadena vacía en la posición 0, MESES[1] será 'enero'."}]}];

const BASE_KEY = "pyoa01-joc-v1";
let KEY = BASE_KEY;
function blank(){return {v:1,xp:0,th:{},thPos:{},qz:{},qPass:{},qOk:{},ex:{},wrong:[],free:false,exam:{best:0,passed:false},updated:0,backupAt:0,backupPhases:0,backupXp:0}}
let S = blank();
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(blank(),JSON.parse(raw))}}catch(e){}
let remote = {ref:null, busy:false, again:false, timer:null, status:"local"};
function save(){
  S.updated = Date.now();
  try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}
  cloudSchedule();
  if(remote.ref){clearTimeout(remote.timer); remote.timer=setTimeout(pushRemote,1200)}
}
async function pushRemote(){
  if(!remote.ref) return;
  if(remote.busy){remote.again=true; return}
  remote.busy=true;
  try{await remote.ref.set(JSON.parse(JSON.stringify(S))); setSync("Progreso guardado en tu cuenta de Claude")}
  catch(e){setSync("No se ha podido guardar en tu cuenta; queda guardado en este navegador")}
  remote.busy=false;
  if(remote.again){remote.again=false; pushRemote()}
}
function setSync(t){remote.status=t; const el=document.getElementById("sync"); if(el) el.textContent=t}
async function initRemote(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(db && user){
      const uid = await user.id();
      if(uid){
        const ref = db.collection("data/users/"+uid).doc("progres");
        const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000));
        const snap = await Promise.race([ref.get(), timeout]);
        remote.ref = ref;
        if(snap.exists){
          const d = snap.data();
          if(d && (d.updated||0) > (S.updated||0)){
            S = Object.assign(blank(), JSON.parse(JSON.stringify(d)));
            try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}
            render();
          }
          setSync("Progreso sincronizado con tu cuenta de Claude");
        } else if(S.updated){ pushRemote() } else { setSync("El progreso se guardará en tu cuenta de Claude") }
      }
    }
  }catch(e){ setSync("Progreso guardado en este navegador") }
  try{
    const dl = await window.claude.use("downloads");
    if(dl) DL.fn = dl;
  }catch(e){}
  try{
    const sample = await window.claude.use("sample");
    if(sample){ TUTOR.fn = sample; document.body.classList.add("has-tutor") }
  }catch(e){}
}

/* Pega aquí el ID de cliente OAuth de tu proyecto de Google Cloud (ver la guía de configuración). */
const GOOGLE_CLIENT_ID = "PEGA_AQUI_TU_CLIENT_ID.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const CLOUD_FILE = "progreso-python-oa01.json";
const MODE_KEY = "pyoa01-modo";
const HINT_KEY = "pyoa01-cuenta";
const CLOUD = {
  configured: /\.apps\.googleusercontent\.com$/.test(GOOGLE_CLIENT_ID) && !/^PEGA_AQUI/.test(GOOGLE_CLIENT_ID),
  https: location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1",
  tc:null, gis:false, token:null, exp:0, user:null, fileId:null,
  state:"off", savedAt:0, busy:false, again:false, dirty:false, timer:null, pendingLogin:false
};
function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v) }catch(e){} }
let MODE = lsGet(MODE_KEY);            /* "google" | "local" | null */
const cloudUsable = () => CLOUD.configured && CLOUD.https;
function loadGis(){
  if(!cloudUsable() || CLOUD.gis) return;
  const sc=document.createElement("script"); sc.src="https://accounts.google.com/gsi/client"; sc.async=true; sc.defer=true;
  sc.onload=()=>{
    try{
      CLOUD.tc = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, callback: onToken,
        error_callback: err=>{ CLOUD.pendingLogin=false; if(err && err.type==="popup_closed") toast("Inicio de sesión cancelado"); else if(err && err.type==="popup_failed_to_open") toast("El navegador ha bloqueado la ventana de Google. Permite las ventanas emergentes."); else toast("No se ha podido iniciar sesión"); render() }
      });
      CLOUD.gis=true; render();
    }catch(e){ toast("No se ha podido cargar el inicio de sesión de Google") }
  };
  sc.onerror=()=>{ toast("Sin conexión con Google: puedes seguir sin cuenta"); render() };
  document.head.appendChild(sc);
}
function signIn(){
  if(!CLOUD.tc){ toast("El inicio de sesión de Google todavía no está listo"); return }
  CLOUD.pendingLogin=true; render();
  const hint=lsGet(HINT_KEY);
  CLOUD.tc.requestAccessToken(hint?{login_hint:hint, prompt:""}:{});
}
async function onToken(resp){
  CLOUD.pendingLogin=false;
  if(!resp || resp.error){ toast("No se ha podido iniciar sesión"); render(); return }
  if(!google.accounts.oauth2.hasGrantedAllScopes(resp, DRIVE_SCOPE)){
    toast("Para guardar en la nube hay que permitir el acceso a la carpeta de la app en Drive"); render(); return;
  }
  CLOUD.token=resp.access_token; CLOUD.exp=Date.now()+((+resp.expires_in||3600)-60)*1000;
  if(CLOUD.user){ CLOUD.state="ok"; render(); if(CLOUD.dirty) pushCloud(); return }
  try{ await afterLogin() }catch(e){ CLOUD.state="error"; toast("No se ha podido leer tu progreso de Google Drive"); render() }
}
async function gfetch(url, opts){
  opts=opts||{};
  if(!CLOUD.token || Date.now()>CLOUD.exp){ CLOUD.token=null; CLOUD.state="expired"; throw {code:"expired"} }
  const r = await fetch(url, Object.assign({}, opts, {headers:Object.assign({}, opts.headers||{}, {Authorization:"Bearer "+CLOUD.token})}));
  if(r.status===401){ CLOUD.token=null; CLOUD.state="expired"; throw {code:"expired"} }
  if(!r.ok) throw {code:"http", status:r.status};
  return r;
}
async function afterLogin(){
  CLOUD.state="sync"; render();
  const about = await (await gfetch("https://www.googleapis.com/drive/v3/about?fields=user(displayName,emailAddress)")).json();
  CLOUD.user = about.user || {};
  const email = (CLOUD.user.emailAddress||"").toLowerCase();
  lsSet(HINT_KEY, email); lsSet(MODE_KEY, "google"); MODE="google";
  const q = encodeURIComponent(`name='${CLOUD_FILE}'`);
  const list = await (await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q=${q}`)).json();
  let remoteState=null;
  if(list.files && list.files.length){
    CLOUD.fileId=list.files[0].id;
    try{ const d=await (await gfetch(`https://www.googleapis.com/drive/v3/files/${CLOUD.fileId}?alt=media`)).json(); if(d && d.progreso) remoteState=Object.assign(blank(), d.progreso) }catch(e){}
  }
  const accKey = BASE_KEY+":"+email;
  let local=null; try{ const raw=lsGet(accKey); if(raw) local=Object.assign(blank(),JSON.parse(raw)) }catch(e){}
  const anon = (KEY===BASE_KEY && S.updated) ? S : null;
  const cands = [remoteState, local].filter(Boolean);
  let chosen = cands.length ? cands.reduce((a,b)=> (b.updated||0)>(a.updated||0)?b:a) : (anon || blank());
  KEY = accKey;
  S = chosen;
  lsSet(KEY, JSON.stringify(S));
  CLOUD.state="ok";
  if(!remoteState || (S.updated||0)>(remoteState.updated||0)){ CLOUD.dirty=true; await pushCloud() } else { CLOUD.savedAt=Date.now() }
  if(VIEW.name==="gate") VIEW={name:"home"};
  toast(remoteState && S===remoteState ? "Progreso recuperado de Google Drive" : "Sesión iniciada: el progreso se guardará en Google Drive");
  render();
}
function cloudSchedule(){
  if(MODE!=="google" || !CLOUD.user) return;
  CLOUD.dirty=true; clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(pushCloud,1500);
}
async function pushCloud(){
  if(MODE!=="google" || !CLOUD.user || !CLOUD.dirty) return;
  if(CLOUD.busy){ CLOUD.again=true; return }
  CLOUD.busy=true; CLOUD.state="sync"; renderCloudChip();
  const data = JSON.stringify({app:APP_ID, version:1, exportado:new Date().toISOString(), progreso:S});
  try{
    CLOUD.dirty=false;
    if(CLOUD.fileId){
      await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${CLOUD.fileId}?uploadType=media`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:data});
    } else {
      const b="pyoa01b"+Math.random().toString(36).slice(2);
      const meta=JSON.stringify({name:CLOUD_FILE, parents:["appDataFolder"]});
      const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${b}--`;
      const r=await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {method:"POST", headers:{"Content-Type":`multipart/related; boundary=${b}`}, body});
      CLOUD.fileId=(await r.json()).id;
    }
    CLOUD.state="ok"; CLOUD.savedAt=Date.now();
  }catch(e){
    CLOUD.dirty=true;
    CLOUD.state = (e && e.code==="expired") ? "expired" : "error";
  }
  CLOUD.busy=false; renderCloudChip();
  if(CLOUD.again){ CLOUD.again=false; pushCloud() }
}
function signOut(){
  const go2=()=>{ CLOUD.token=null; CLOUD.user=null; CLOUD.fileId=null; CLOUD.state="off"; MODE=null; lsSet(MODE_KEY,null); lsSet(HINT_KEY,null);
    KEY=BASE_KEY; S=blank(); try{const raw=lsGet(BASE_KEY); if(raw) S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
    go({name:"gate"}); toast("Sesión cerrada") };
  if(CLOUD.dirty && CLOUD.token){ pushCloud().then(go2) } else go2();
}
function useLocal(){ MODE="local"; lsSet(MODE_KEY,"local"); go({name:"home"}) }
function cloudLabel(){
  if(MODE!=="google" || !CLOUD.user) return {t:"Sin cuenta", cls:"off"};
  if(CLOUD.state==="sync") return {t:"Guardando…", cls:"sync"};
  if(CLOUD.state==="expired") return {t:"Reconectar", cls:"warn"};
  if(CLOUD.state==="error") return {t:"Error al guardar", cls:"warn"};
  return {t:"En Drive", cls:"ok"};
}
function renderCloudChip(){
  const el=document.getElementById("cloudChip"); if(!el) return;
  const l=cloudLabel(); el.className="btn small cloud-chip "+l.cls; el.querySelector(".ct").textContent=l.t;
  el.title = l.cls==="ok" && CLOUD.savedAt ? `Guardado en Google Drive a las ${new Date(CLOUD.savedAt).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}` : l.t;
  const st=document.getElementById("cloudStatus"); if(st) st.textContent=cloudStatusText();
}
function cloudStatusText(){
  if(MODE!=="google" || !CLOUD.user) return "Ahora el progreso solo se guarda en este navegador.";
  const who = CLOUD.user.emailAddress || "tu cuenta";
  if(CLOUD.state==="expired") return `La sesión de ${who} ha caducado. Pulsa «Reconectar» para seguir guardando en Drive (mientras tanto se guarda en este navegador).`;
  if(CLOUD.state==="error") return `No se ha podido guardar en Drive. Se volverá a intentar con el próximo cambio.`;
  if(CLOUD.state==="sync") return `Guardando en el Drive de ${who}…`;
  return `Conectado como ${who}. El progreso se guarda solo en tu Google Drive${CLOUD.savedAt?`, última vez a las ${new Date(CLOUD.savedAt).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}`:""}.`;
}
function cloudChipClick(){
  if(MODE==="google" && CLOUD.user){
    if(CLOUD.state==="expired"){ signIn(); return }
    if(CLOUD.state==="error"){ CLOUD.dirty=true; pushCloud(); return }
    go({name:"home"}); setTimeout(()=>{ const a=document.getElementById("cuenta"); if(a) a.scrollIntoView({behavior:"smooth"}) },50);
  } else go({name:"gate"});
}

/* ================= copia de seguridad en el PC ================= */
const APP_ID = "python-oa01-joc";
function phasesOf(st){ const old=S; S=st; const n=donePhases(); S=old; return n }
function fmtDate(ts){ try{ return new Date(ts).toLocaleString("es-ES",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}) }catch(e){ return "" } }
function pendingBackup(){ return Math.max(0, donePhases()-(S.backupPhases||0)) }
function markBackup(){ S.backupAt=Date.now(); S.backupPhases=donePhases(); S.backupXp=S.xp; save(); toast("Copia guardada en tu PC"); render() }
async function exportProgress(){
  const d=new Date(); const pad=n=>String(n).padStart(2,"0");
  const filename=`progreso-python-oa01-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  const copy=JSON.parse(JSON.stringify(S));
  const data=JSON.stringify({app:APP_ID, version:1, exportado:d.toISOString(), progreso:copy}, null, 2);
  if(DL.fn){
    try{ await DL.fn.save({filename, data}); markBackup(); return }
    catch(err){
      if(err && err.code==="declined"){ toast("Copia cancelada"); return }
      if(err && err.code==="rate_limited"){ toast("Espera un momento y vuelve a intentarlo"); return }
    }
  }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    markBackup();
  }catch(e){ toast("No se ha podido crear el archivo en esta vista") }
}
function pickImport(){ const inp=document.getElementById("importFile"); if(inp){ inp.value=""; inp.click() } }
function readImport(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    let obj=null;
    try{ obj=JSON.parse(r.result) }catch(e){}
    if(!obj || obj.app!==APP_ID || !obj.progreso || typeof obj.progreso.xp!=="number"){ toast("Este archivo no es una copia de este juego"); return }
    const incoming=Object.assign(blank(), obj.progreso);
    const L=$("#layer"); const sc=document.createElement("div"); sc.className="scrim"; sc.dataset.act="closeModal";
    sc.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="imt">
      <div class="modal-top"><small>Cargar progreso</small><button class="btn small" data-act="closeModal">Cancelar</button></div>
      <h2 id="imt" style="margin-bottom:10px">¿Sustituir tu progreso actual?</h2>
      <div class="tbl"><table><thead><tr><th></th><th>Ahora</th><th>Archivo</th></tr></thead><tbody>
        <tr><td>Fases completadas</td><td>${donePhases()} de ${totalPhases()}</td><td>${phasesOf(incoming)} de ${totalPhases()}</td></tr>
        <tr><td>XP</td><td>${S.xp}</td><td>${incoming.xp}</td></tr>
        <tr><td>Guardado el</td><td>${S.updated?esc(fmtDate(S.updated)):"(sin datos)"}</td><td>${esc(fmtDate(obj.exportado||incoming.updated))}</td></tr>
      </tbody></table></div>
      <p class="muted">El progreso del archivo reemplazará al actual en este navegador${MODE==="google"&&CLOUD.user?" y en tu Google Drive":""}.</p>
      <div class="row"><button class="btn primary" data-act="confirmImport">Cargar este progreso</button><button class="btn" data-act="closeModal">Cancelar</button></div></div>`;
    sc._prev=document.activeElement; sc._incoming=incoming; L.appendChild(sc); sc.querySelector(".btn.primary").focus();
  };
  r.onerror=()=>toast("No se ha podido leer el archivo");
  r.readAsText(file);
}
function confirmImport(){
  const sc=$(".scrim"); if(!sc||!sc._incoming) return;
  S=sc._incoming; S.backupAt=Date.now(); S.backupPhases=donePhases(); S.backupXp=S.xp;
  sc.remove(); save(); go({name:"home"}); toast("Progreso cargado");
}

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T = id => TOPICS.find(t=>t.id===id);
const idx = id => TOPICS.findIndex(t=>t.id===id);
const ucol = u => `var(--u${u})`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function levelOf(xp){let i=0;for(let k=0;k<LEVELS.length;k++){if(xp>=LEVELS[k][0]) i=k}return i}
function phaseDone(t,p){
  if(p==="th") return !!S.th[t.id];
  if(p==="qz") return !!S.qPass[t.id];
  if(p==="ex") return t.ex.every(e=>S.ex[t.id+"/"+e.id]);
}
function exCount(t){return t.ex.filter(e=>S.ex[t.id+"/"+e.id]).length}
function topicDone(t){return PHASES.every(([p])=>phaseDone(t,p))}
function unlocked(t,p){
  if(S.free) return true;
  const i = idx(t.id);
  if(p==="th") return i===0 || topicDone(TOPICS[i-1]);
  if(p==="qz") return phaseDone(t,"th");
  if(p==="ex") return phaseDone(t,"qz");
}
function topicOpen(t){return unlocked(t,"th")}
function examOpen(){return S.free || TOPICS.every(topicDone)}
function totalPhases(){return TOPICS.length*3}
function donePhases(){let n=0;TOPICS.forEach(t=>PHASES.forEach(([p])=>{if(phaseDone(t,p)) n++}));return n}
function nextStep(){
  for(const t of TOPICS){for(const [p] of PHASES){ if(!phaseDone(t,p) && unlocked(t,p)) return {t,p} }}
  return null;
}

function addXP(n){
  if(n<=0) return;
  const before = levelOf(S.xp);
  S.xp += n; save();
  toast(`+${n} XP`);
  const after = levelOf(S.xp);
  if(after>before) setTimeout(()=>levelUp(after),450);
  renderTop();
}
let toastTimer=null;
function toast(msg){
  let el=$("#toast"); if(el) el.remove();
  el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); el.textContent=msg;
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(),1800);
}

    </svg>
    <p style="margin:0">Has subido al nivel ${i+1}</p>

    <p>${i===LEVELS.length-1?"Has llegado al nivel máximo. Haz el simulacro de examen tantas veces como haga falta.":"Sigue así: cada fase superada te acerca al examen."}</p>

/* ================= syntax highlight + mini markdown ================= */
const KW = new Set("if elif else while for in not and or import from def return break continue del pass try except finally as is with lambda global class".split(" "));
const CONSTS = new Set(["True","False","None"]);
const BI = new Set("print input int float str len range list tuple ord chr type help exit id bool pow abs max min sum round sorted".split(" "));
const TOK = /(#[^\n]*)|([fFrRbB]{0,2}(?:'(?:\\.|[^'\\\n])*'?|"(?:\\.|[^"\\\n])*"?))|(\b\d+(?:\.\d*)?\b|\.\d+)|([A-Za-z_\u00C0-\u024F][\w\u00C0-\u024F]*)|(\s+)|([\s\S])/g;
function hlPy(src){
  let out=""; TOK.lastIndex=0; let m;
  while((m=TOK.exec(src))){
    if(m[1]) out+=`<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="n">${esc(m[3])}</span>`;
    else if(m[4]){
      const w=m[4];
      if(KW.has(w)) out+=`<span class="k">${w}</span>`;
      else if(CONSTS.has(w)) out+=`<span class="n">${w}</span>`;
      else if(BI.has(w)) out+=`<span class="f">${w}</span>`;
      else out+=esc(w);
    } else out+=esc(m[5]||m[6]);
  }
  return out;
}
function codeBlock(src, lang){
  lang = lang||"py";
  let html;
  if(lang==="py" && /^>>> /m.test(src)){
    html = src.split("\n").map(l=> l.startsWith(">>> ") ? `<span class="p">&gt;&gt;&gt; </span>${hlPy(l.slice(4))}` : (l.startsWith("... ")?`<span class="p">... </span>${hlPy(l.slice(4))}`:`<span class="o">${esc(l)}</span>`)).join("\n");
  } else if(lang==="py"){ html = hlPy(src) }
  else if(lang==="sh"){ html = src.split("\n").map(l=>`<span class="p">$ </span>${esc(l)}`).join("\n") }
  else html = `<span class="o">${esc(src)}</span>`;
  return `<pre class="code"><code>${html}</code></pre>`;
}
function inl(s){
  return String(s).split("`").map((seg,i)=> i%2 ? `<code class="ic">${esc(seg)}</code>` :
    esc(seg).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")).join("");
}
const CALL = {clau:"Clave", compte:"Cuidado", idea:"Idea"};
function md(src){
  const L = src.split("\n"); let out=""; let i=0; let para=[];
  const flush=()=>{ if(para.length){ out+=`<p>${inl(para.join(" "))}</p>`; para=[] } };
  while(i<L.length){
    const line=L[i];
    if(line.startsWith("```")){
      flush(); const lang=line.slice(3).trim(); const buf=[]; i++;
      while(i<L.length && !L[i].startsWith("```")){buf.push(L[i]); i++}
      i++; out+=codeBlock(buf.join("\n"), lang); continue;
    }
    if(!line.trim()){flush(); i++; continue}
    const cm = line.match(/^!(clau|compte|idea) (.*)$/);
    if(cm){
      flush(); const buf=[cm[2]]; i++;
      while(i<L.length && L[i].trim() && !L[i].startsWith("```") && !L[i].startsWith("!")){buf.push(L[i]); i++}
      out+=`<div class="callout ${cm[1]}"><span class="ck">${CALL[cm[1]]}</span>${inl(buf.join(" "))}</div>`; continue;
    }
    if(line.startsWith("|")){
      flush(); const rows=[];
      while(i<L.length && L[i].startsWith("|")){ rows.push(L[i]); i++ }
      const cells=r=>{const parts=[];let cur="",inCode=false;for(const ch of r.trim().replace(/^\||\|$/g,"")){if(ch==="`")inCode=!inCode;if(ch==="|"&&!inCode){parts.push(cur);cur=""}else cur+=ch}parts.push(cur);return parts.map(c=>c.trim())};
      const head=cells(rows[0]); const body=rows.slice(1).filter(r=>!/^\|[\s\-|:]+\|?$/.test(r));
      out+=`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${inl(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(/^- /.test(line)){
      flush(); const items=[];
      while(i<L.length && /^- /.test(L[i])){items.push(L[i].slice(2)); i++}
      out+=`<ul>${items.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`; continue;
    }
    if(/^\d+\. /.test(line)){
      flush(); const items=[];
      while(i<L.length && /^\d+\. /.test(L[i])){items.push(L[i].replace(/^\d+\. /,"")); i++}
      out+=`<ol>${items.map(x=>`<li>${inl(x)}</li>`).join("")}</ol>`; continue;
    }
    para.push(line); i++;
  }
  flush(); return out;
}
function richText(s){
  const parts = String(s).split("```");
  return parts.map((p,i)=>{
    if(i%2){ const nl=p.indexOf("\n"); const body = nl>=0 && /^[a-z]*$/.test(p.slice(0,nl).trim()) ? p.slice(nl+1) : p; return codeBlock(body.replace(/\n$/,""),"py") }
    return p.split(/\n{2,}/).map(par=>par.trim()?`<p>${inl(par).replace(/\n/g,"<br>")}</p>`:"").join("");
  }).join("");
}

/* ================= ring svg ================= */
function arc(cx,cy,r,a0,a1){
  const rad=a=>(a-90)*Math.PI/180;
  const x0=cx+r*Math.cos(rad(a0)), y0=cy+r*Math.sin(rad(a0)), x1=cx+r*Math.cos(rad(a1)), y1=cy+r*Math.sin(rad(a1));
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function ring(t, size, locked){
  const col = ucol(t.unit); const cx=22, cy=22, r=16, gap=16;
  let s=`<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20.5" fill="var(--surface)" stroke="${locked?"var(--line)":col}" stroke-width="2"/>`;
  PHASES.forEach(([p],k)=>{
    const a0=k*120+gap/2, a1=(k+1)*120-gap/2;
    s+=`<path d="${arc(cx,cy,r,a0,a1)}" fill="none" stroke="${phaseDone(t,p)?col:"var(--line)"}" stroke-width="5" stroke-linecap="round"/>`;
  });
  if(locked) s+=`<path d="M17.5 21v-2.2a4.5 4.5 0 0 1 9 0V21" fill="none" stroke="var(--muted)" stroke-width="1.8"/><rect x="16" y="21" width="12" height="9" rx="2" fill="var(--muted)"/>`;
  else if(topicDone(t)) s+=`<path d="M16 22.5l4 4 8-9" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  else s+=`<text x="22" y="26.5" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Atkinson Hyperlegible, sans-serif">${idx(t.id)+1}</text>`;
  return s+"</svg>";
}
function examRing(locked){
  const done=S.exam.passed;
  return `<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20.5" fill="${done?"var(--ink)":"var(--surface)"}" stroke="${locked?"var(--line)":"var(--ink)"}" stroke-width="2" ${locked?"":""}/>
  <path d="M15 31V13M15 14h13l-3 4.5 3 4.5H15" fill="none" stroke="${done?"var(--surface)":(locked?"var(--muted)":"var(--ink)")}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ================= top bar ================= */
function renderTop(){
  const li=levelOf(S.xp); const cur=LEVELS[li][0]; const nxt=LEVELS[li+1]?LEVELS[li+1][0]:null;
  const pct = nxt? Math.round((S.xp-cur)/(nxt-cur)*100) : 100;
  const dp=donePhases(), tp=totalPhases(); const prog=Math.round(dp/tp*100);
  let track="";
  TOPICS.forEach((t,i)=>{
    const prev = i>0 ? TOPICS[i-1] : null;
    const seg = topicDone(t) ? ucol(t.unit) : "var(--line)";
    track+=`<div class="st" style="--seg:${seg}"><button data-act="openTopic" data-id="${t.id}" title="Tema ${i+1}: ${esc(t.title)}" aria-label="Tema ${i+1}: ${esc(t.title)}">${ring(t,20,!topicOpen(t))}</button></div>`;
  });
  track+=`<div class="st" style="--seg:${S.exam.passed?"var(--ink)":"var(--line)"}"><button data-act="exam" title="Simulacro de examen" aria-label="Simulacro de examen">${examRing(!examOpen())}</button></div>`;
  $("#topbar").innerHTML = `
  <div class="brand-row">
    <button class="brand" data-act="home" style="all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;min-width:0" aria-label="Volver al mapa">
      <b>Python para el examen</b><span>OA01 Programación en Python</span></button>
    <div class="row" style="gap:12px;flex-wrap:nowrap">
    <button id="cloudChip" class="btn small cloud-chip ${cloudLabel().cls}" data-act="cloudChip"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.2 4.5 4.5 0 0 0 7 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="ct">${cloudLabel().t}</span></button>
    <button class="btn small save-btn" data-act="exportProgress" title="Guardar progreso en el PC" aria-label="Guardar progreso en el PC"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="save-txt">Guardar</span>${pendingBackup()>0?`<i class="dot" aria-hidden="true"></i>`:""}</button>
    <div class="lvl" title="${S.xp} XP">
      <div class="lvl-num" aria-hidden="true">${li+1}</div>
      <div class="lvl-txt"><small>Nivel ${li+1} de ${LEVELS.length}, ${S.xp} XP</small><strong>${esc(LEVELS[li][1])}</strong>
      <div class="xpbar" role="progressbar" aria-label="XP hasta el siguiente nivel" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    </div></div>
  </div>
  <div class="track" role="img" aria-label="Progreso del temario: ${prog}%">${track}</div>

}

let VIEW = {name: (MODE==="local") ? "home" : "gate"};
function go(v){ VIEW=v; if(TUTOR.ctrl){try{TUTOR.ctrl.abort()}catch(e){}} render(); window.scrollTo({top:0}); }

/* ================= topic ================= */
let TS = {}; // transient per topic view
function openTopic(id, phase){
  const t=T(id); if(!t) return;
  if(!topicOpen(t)){ toast("Termina el tema anterior para desbloquearlo"); return }
  if(!phase){ phase = PHASES.map(p=>p[0]).find(p=>!phaseDone(t,p) && unlocked(t,p)) || "th" }
  if(!unlocked(t,phase)) phase="th";
  TS = {card: phaseDone(t,"th")?0:(S.thPos[id]||0), quiz:null, exi:0, ex:{}};
  go({name:"topic", id, phase});
}
function topicView(){
  const t=T(VIEW.id); const i=idx(t.id);
  const steps = PHASES.map(([p,l],k)=>{
    const done=phaseDone(t,p), un=unlocked(t,p), on=VIEW.phase===p;
    let sub = done?"Superada":(un?"Pendiente":"Bloqueada");
    if(p==="ex") sub = `${exCount(t)} de ${t.ex.length}`;
    if(p==="qz" && S.qz[t.id]!=null && !done) sub=`Mejor: ${Math.round(S.qz[t.id]*100)}%`;
    return `<button class="step ${on?"on":""} ${done?"done":""}" data-act="phase" data-p="${p}" ${un?"":'aria-disabled="true"'} aria-current="${on?"step":"false"}">
      <span class="n">${done?"✓":k+1}</span><span class="l">${l}<small>${sub}</small></span></button>`;
  }).join("");
  let body="";
  if(VIEW.phase==="th") body=theoryView(t);
  else if(VIEW.phase==="qz") body=quizView(t);
  else body=exView(t);
  return `<div class="crumb"><button class="btn ghost small" data-act="home">← Mapa</button></div>
  <div class="topic-head" style="--c:${ucol(t.unit)}"><small>${UNITS[t.unit].tag}, tema ${i+1}</small><h1>${esc(t.title)}</h1></div>
  <nav class="steps" style="--c:${ucol(t.unit)}" aria-label="Fases del tema">${steps}</nav>
  <div style="--c:${ucol(t.unit)}">${body}</div>`;
}

/* ---- theory ---- */
function theoryView(t){
  const k=Math.min(TS.card, t.theory.length-1); const c=t.theory[k]; const last=k===t.theory.length-1;
  const dots=t.theory.map((_,j)=>`<i class="${j===k?"cur":(j<k||S.th[t.id]?"on":"")}"></i>`).join("");
  return `<article class="panel">
    <div class="panel-top"><span>Ficha ${k+1} de ${t.theory.length}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <div class="md"><h2>${esc(c.t)}</h2>${md(c.md)}</div>
    <div class="row" style="margin-top:4px"><button class="btn small tutor-btn" data-act="tutorCard">No lo acabo de entender: explícamelo de otra manera</button></div>
    <div id="tutorOut"></div>
    <div class="nav"><button class="btn" data-act="card" data-d="-1" ${k===0?"disabled":""}>Anterior</button>
      ${last?`<button class="btn primary" data-act="finishTheory">${S.th[t.id]?"Ir a las respuestas":`Terminar el temario, +${XP.theory} XP`}</button>`:`<button class="btn primary" data-act="card" data-d="1">Siguiente ficha</button>`}</div>
  </article>`;
}

/* ---- quiz (shared runner) ---- */
function newQuiz(items, mode, meta){
  return {mode, meta:meta||{}, items: items.map(({t,q})=>({t,q,order:shuffle(q.opts.map((_,i)=>i))})), i:0, answers:[], picked:null, done:false};
}
function quizView(t){
  if(!TS.quiz) TS.quiz = newQuiz(t.quiz.map(q=>({t,q})),"topic",{tid:t.id});
  return quizBody(TS.quiz);
}
function quizBody(Q){
  if(Q.done) return quizResult(Q);
  const it=Q.items[Q.i]; const q=it.q; const answered = Q.picked!==null;
  const showFb = Q.mode!=="exam";
  const dots=Q.items.map((_,j)=>{const a=Q.answers[j]; return `<i class="${j===Q.i?"cur":(a==null?"":(Q.mode==="exam"?"on":(a?"on":"bad")))}"></i>`}).join("");
  const opts = it.order.map((oi,pos)=>{
    let cls="";
    if(answered){
      if(showFb){ if(oi===q.a) cls="ok"; else if(oi===Q.picked) cls="no" }
      else if(oi===Q.picked) cls="sel";
    }
    return `<button class="opt ${cls}" data-act="pick" data-o="${oi}" ${answered?'aria-disabled="true"':""}><span class="let">${"ABCD"[pos]}</span><span>${inl(q.opts[oi])}</span></button>`;
  }).join("");
  let fb="";
  if(answered && showFb){
    const ok=Q.picked===q.a; const card=it.t.theory.find(c=>c.id===q.ref);
    fb=`<div class="fb ${ok?"ok":"no"}" role="status"><span class="h">${ok?"Correcto":"No es esta"}</span>${inl(q.why)}<br>
      <button class="ref" data-act="refCard" data-tid="${it.t.id}" data-cid="${q.ref}">Repásalo en el temario: ${esc(card?card.t:"")}</button></div>`;
  }
  const label = Q.mode==="exam"?"Simulacro":(Q.mode==="review"?"Repaso":"Pregunta");
  const src = Q.mode!=="topic"?`<span class="muted" style="font-size:14px">Tema ${idx(it.t.id)+1}: ${esc(it.t.title)}</span>`:"";
  return `<article class="panel">
    <div class="panel-top"><span>${label} ${Q.i+1} de ${Q.items.length}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    ${src}
    <div class="q-text">${inl(q.q)}</div>
    ${q.code?codeBlock(q.code,"py"):""}
    <div class="opts ${answered?"locked":""}">${opts}</div>
    ${fb}
    <div class="nav"><span class="muted" style="font-size:14.5px">${answered||Q.mode==="exam"?"":"Elige una respuesta"}</span>
      ${answered?`<button class="btn primary" data-act="nextQ">${Q.i===Q.items.length-1?"Ver el resultado":"Siguiente pregunta"}</button>`:""}</div>
  </article>`;
}
function quizResult(Q){
  const n=Q.items.length; const ok=Q.answers.filter(Boolean).length; const sc=ok/n; const pass=sc>=PASS;
  const wrong=Q.items.map((it,j)=>({it,ok:Q.answers[j]})).filter(x=>!x.ok);
  let msg, actions;
  if(Q.mode==="topic"){
    msg = pass ? "Fase superada. Ya puedes hacer los ejercicios." : `Necesitas un ${Math.round(PASS*100)}% para superar la fase. Repasa las fichas de las preguntas falladas y vuelve a intentarlo.`;
    actions = pass ? `<button class="btn primary" data-act="phase" data-p="ex">Ir a los ejercicios</button>` : `<button class="btn primary" data-act="retryQuiz">Volver a intentarlo</button>`;
    actions += `<button class="btn" data-act="phase" data-p="th">Volver al temario</button>`;
  } else if(Q.mode==="exam"){
    msg = pass ? "Simulacro superado. Estás listo para el examen." : "Todavía no. Mira qué temas has fallado y repásalos.";
    actions = `<button class="btn primary" data-act="examNew">Hacer otro simulacro</button><button class="btn" data-act="home">Volver al mapa</button>`;
  } else {
    msg = wrong.length ? "Las que has vuelto a fallar siguen en la lista de repaso." : "Has resuelto todas las preguntas pendientes.";
    actions = `<button class="btn primary" data-act="home">Volver al mapa</button>`;
  }
  const list = wrong.length ? `<h3 style="margin-top:18px">${Q.mode==="exam"?"Preguntas falladas":"Para repasar"}</h3><ul class="wronglist">${wrong.map(({it})=>{
    const card=it.t.theory.find(c=>c.id===it.q.ref);
    return `<li><strong>${inl(it.q.q)}</strong><br><span class="muted">Respuesta: ${inl(it.q.opts[it.q.a])}</span>${Q.mode==="exam"?`<br>${inl(it.q.why)}`:""}<br>
      <button class="ref" data-act="refCard" data-tid="${it.t.id}" data-cid="${it.q.ref}">Tema ${idx(it.t.id)+1}: ${esc(card?card.t:"")}</button></li>`}).join("")}</ul>` : "";
  return `<article class="panel"><div class="score"><div class="big">${ok}/${n}</div><div class="msg"><strong>${Math.round(sc*100)}%</strong></div><p class="muted" style="max-width:46ch;margin:0 auto">${msg}</p></div>
    <div class="row" style="justify-content:center;margin-top:14px">${actions}</div>${list}</article>`;
}
function pick(o){
  const Q = currentQuiz(); if(!Q || Q.picked!==null) return;
  Q.picked=o; const it=Q.items[Q.i]; const ok = o===it.q.a; Q.answers[Q.i]=ok;
  const key = it.t.id+"/"+it.q.id;
  if(Q.mode==="topic"){
    if(ok && !S.qOk[key]){ S.qOk[key]=true; addXP(XP.quiz) }
    if(!ok){ if(!S.wrong.includes(key)) S.wrong.push(key) } else { S.wrong=S.wrong.filter(k=>k!==key) }
    save();
  } else if(Q.mode==="review"){
    if(ok) S.wrong=S.wrong.filter(k=>k!==key); save();
  } else if(Q.mode==="exam"){
    if(!ok && !S.wrong.includes(key)){ S.wrong.push(key); save() }
  }
  rerenderMain();
}
function nextQ(){
  const Q=currentQuiz(); if(!Q) return;
  if(Q.i<Q.items.length-1){ Q.i++; Q.picked=null; rerenderMain(); scrollPanel(); return }
  Q.done=true;
  const sc = Q.answers.filter(Boolean).length/Q.items.length;
  if(Q.mode==="topic"){
    const tid=Q.meta.tid; S.qz[tid]=Math.max(S.qz[tid]||0, sc);
    const was = !!S.qPass[tid];
    if(sc>=PASS) S.qPass[tid]=true;
    save();
    if(!was && S.qPass[tid]) toast("Fase superada");
  } else if(Q.mode==="exam"){
    S.exam.best=Math.max(S.exam.best||0, sc);
    if(sc>=PASS && !S.exam.passed){ S.exam.passed=true; save(); addXP(XP.exam) } else save();
  }
  render(); scrollPanel();
}
function currentQuiz(){
  if(VIEW.name==="topic" && VIEW.phase==="qz") return TS.quiz;
  if(VIEW.name==="exam") return VIEW.Q;
  if(VIEW.name==="review") return VIEW.Q;
  return null;
}

/* ---- exam & review ---- */
function startExam(){
  if(!examOpen()){ toast("Completa todos los temas o activa el modo libre"); return }
  const pool=[]; TOPICS.forEach(t=>t.quiz.forEach(q=>pool.push({t,q})));
  const byTopic = {}; shuffle(pool).forEach(x=>{(byTopic[x.t.id]=byTopic[x.t.id]||[]).push(x)});
  const picked=[]; let round=0;
  while(picked.length<EXAM_N){ let added=false; for(const t of TOPICS){ const arr=byTopic[t.id]; if(arr && arr[round]){ picked.push(arr[round]); added=true; if(picked.length>=EXAM_N) break } } if(!added) break; round++ }
  go({name:"exam", Q:newQuiz(shuffle(picked),"exam")});
}
function examView(){
  return `<div class="crumb"><button class="btn ghost small" data-act="home">← Mapa</button></div>
  <div class="topic-head" style="--c:var(--ink)"><small>Final de línea</small><h1>Simulacro de examen</h1></div>
  <p class="muted">${EXAM_N} preguntas de todos los temas, sin pistas hasta el final. Las que falles se añaden a la lista de repaso.</p>
  <div style="--c:var(--ink)">${quizBody(VIEW.Q)}</div>`;
}
function startReview(){
  const items = S.wrong.map(k=>{const [tid,qid]=k.split("/"); const t=T(tid); const q=t&&t.quiz.find(x=>x.id===qid); return t&&q?{t,q}:null}).filter(Boolean);
  if(!items.length){ toast("No tienes preguntas pendientes de repaso"); return }
  go({name:"review", Q:newQuiz(shuffle(items),"review")});
}
function reviewView(){
  return `<div class="crumb"><button class="btn ghost small" data-act="home">← Mapa</button></div>
  <div class="topic-head" style="--c:var(--u2)"><small>Herramientas de estudio</small><h1>Repaso de preguntas falladas</h1></div>
  <div style="--c:var(--u2)">${quizBody(VIEW.Q)}</div>`;
}

/* ---- exercises ---- */
function exState(t,e){
  const k=t.id+"/"+e.id;
  if(!TS.ex[k]){
    const st={tries:0, hint:false, shown:false, status:null, msg:""};
    if(e.type==="order"){ let sh=shuffle(e.lines.map((_,i)=>i)); if(sh.every((v,i)=>v===i) && sh.length>1) sh=sh.reverse(); st.pool=sh; st.ans=[] }
    if(e.type==="write"){ st.code=""; st.checks=e.checks.map(()=>false) }
    if(e.type==="fill"){ st.vals=e.blanks.map(()=>"") }
    if(e.type==="predict"){ st.val="" }
    TS.ex[k]=st;
  }
  return TS.ex[k];
}
function exView(t){
  const i=Math.min(TS.exi,t.ex.length-1); const e=t.ex[i]; const st=exState(t,e); const key=t.id+"/"+e.id; const solved=!!S.ex[key];
  const dots=t.ex.map((x,j)=>`<i class="${j===i?"cur":(S.ex[t.id+"/"+x.id]?"on":"")}"></i>`).join("");
  let inner="";
  const stdin = e.stdin!=null ? `<p class="stdin">Entrada que escribe el usuario: ${e.stdin.split("\n").map(l=>`<code>${esc(l)}</code>`).join(" ")}</p>` : "";
  if(e.type==="predict"){
    inner = `${codeBlock(e.code,"py")}${stdin}
      <label for="pv" class="muted" style="font-size:14.5px">Escribe exactamente lo que saldrá por pantalla (una línea por cada print):</label>
      <textarea id="pv" class="out" spellcheck="false" autocapitalize="off" autocomplete="off" data-in="predict">${esc(solved&&!st.val?e.out:st.val)}</textarea>`;
  } else if(e.type==="fill"){
    const parts=e.code.split(/\[\[(\d+)\]\]/);
    let html="";
    parts.forEach((p,j)=>{
      if(j%2){ const b=+p; const w=Math.max(4, ...e.blanks[b].map(a=>a.length))+2;
        const v = st.vals[b] || (solved && !st.vals[b] ? e.blanks[b][0] : "");
        html+=`<input class="blank ${st.status==="ok"||solved?"ok":(st.bad&&st.bad[b]?"no":"")}" data-in="fill" data-b="${b}" value="${esc(v)}" style="width:${w}ch" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Hueco ${b+1}">`;
      } else html+=hlPy(p);
    });
    inner = `<pre class="code"><code>${html}</code></pre>${stdin}`;
  } else if(e.type==="order"){
    const isCode = e.lines.some(l=>/[=()'":]/.test(l));
    const item=(li,where,j)=>`<button class="pl ${isCode?"":"txt"} ${st.badPos===j&&where==="a"?"no":""} ${solved&&where==="a"?"ok":""}" data-act="ord" data-w="${where}" data-li="${li}">${isCode?hlPy(e.lines[li]):esc(e.lines[li])}</button>`;
    const ans = solved && !st.ans.length ? e.lines.map((_,j)=>j) : st.ans;
    const pool = solved && !st.ans.length ? [] : st.pool;
    inner = `${stdin}<div class="parsons"><div><h4>Tu solución (toca una línea para quitarla)</h4><div class="answer">${ans.length?ans.map((li,j)=>item(li,"a",j)).join(""):`<span class="empty">Toca las líneas de abajo en el orden correcto</span>`}</div></div>
      <div><h4>Líneas disponibles</h4><div class="pool">${pool.length?pool.map(li=>item(li,"p")).join(""):`<span class="empty">No queda ninguna</span>`}</div></div></div>`;
  } else if(e.type==="bug"){
    const lines=e.code.split("\n");
    inner = `<ol class="lines">${lines.map((l,j)=>{let cls=""; if(solved||st.status==="ok"){ if(j===e.line) cls="ok" } else if(st.badLine===j) cls="no";
      return `<li><button class="${cls}" data-act="bugLine" data-l="${j}" aria-label="Línea ${j+1}"><span class="ln">${j+1}</span><span>${hlPy(l)||" "}</span></button></li>`}).join("")}</ol>`;
  } else if(e.type==="choice"){
    const answered = st.status==="ok"||solved;
    inner = `${e.code?codeBlock(e.code,"py"):""}<div class="opts ${answered?"locked":""}">${e.opts.map((o,j)=>{
      let cls=""; if(answered && j===e.a) cls="ok"; else if(st.badOpt===j) cls="no";
      return `<button class="opt ${cls}" data-act="exChoice" data-o="${j}"><span class="let">${"ABCD"[j]}</span><span>${inl(o)}</span></button>`}).join("")}</div>`;
  } else if(e.type==="write"){
    const tests = e.tests.length ? `<div class="tbl"><table><thead><tr><th>Entrada</th><th>Salida esperada</th></tr></thead><tbody>${e.tests.map(tc=>`<tr><td class="mono" style="white-space:pre">${tc.argv?esc("argumentos: "+(tc.argv.length?tc.argv.join(" "):"(ninguno)")):(tc.in===""?"(cadena vacía)":esc(tc.in))}</td><td class="mono" style="white-space:pre">${tc.out===""?"(nada)":esc(tc.out)}</td></tr>`).join("")}</tbody></table></div>`:"";
    inner = `${e.ee?`<p class="ee"><strong>Especificaciones de entrada:</strong> ${inl(e.ee)}</p>`:""}${tests?`<p class="ee"><strong>Juego de pruebas</strong></p>${tests}`:""}
      <label for="wc" class="muted" style="font-size:14.5px">Tu código (la tecla Tab sangra 4 espacios):</label>
      <textarea id="wc" class="code" spellcheck="false" autocapitalize="off" autocomplete="off" data-in="write" placeholder="Escribe el programa aquí, o en tu editor, y pégalo">${esc(st.code)}</textarea>
      ${st.shown||solved?`<h3 style="margin:16px 0 8px">Solución modelo</h3>${codeBlock(e.solution,"py")}
        <p style="margin:12px 0 4px"><strong>Comprueba tu programa con esta lista:</strong></p>
        <ul class="checks">${e.checks.map((c,j)=>`<li><label><input type="checkbox" data-in="check" data-j="${j}" ${st.checks[j]||solved?"checked":""}> <span>${inl(c)}</span></label></li>`).join("")}</ul>`:""}`;
  }
  // feedback
  let fb="";
  if(solved || st.status==="ok"){
    fb = `<div class="fb ok" role="status"><span class="h">${e.type==="write"?"Hecho":"Correcto"}</span>${inl(e.why||"Buen trabajo: has comprobado el programa punto por punto.")}</div>`;
  } else if(st.status==="no"){
    fb = `<div class="fb no" role="status"><span class="h">Todavía no</span>${esc(st.msg||"Revísalo y vuelve a intentarlo.")}</div>`;
  } else if(st.status==="reveal"){
    fb = `<div class="fb no" role="status"><span class="h">Solución</span>${st.revealHtml||""}<br>${inl(e.why)}</div>`;
  }
  const hint = st.hint && e.hint ? `<div class="hint"><strong>Pista:</strong> ${inl(e.hint)}</div>` : "";
  let actions="";
  if(!solved && st.status!=="ok"){
    if(e.type==="predict"||e.type==="fill"||e.type==="order") actions+=`<button class="btn primary" data-act="check">Comprobar</button>`;
    if(e.type==="write"){
      if(!st.shown) actions+=`<button class="btn primary" data-act="showSol">Comparar con la solución</button>`;
      else actions+=`<button class="btn primary" data-act="markWrite" ${st.checks.every(Boolean)?"":"disabled"}>Marcar como hecho</button>`;
    }
    if(e.hint && !st.hint) actions+=`<button class="btn" data-act="hint">Pista</button>`;
    if(e.type!=="write" && st.tries>=2 && st.status!=="reveal") actions+=`<button class="btn" data-act="reveal">Mostrar la solución</button>`;
  }
  const tutorBtn = e.type==="write" ? `<button class="btn tutor-btn" data-act="tutorCode">Pedir corrección al tutor</button>` : "";
  const nextBtn = i<t.ex.length-1 ? `<button class="btn ${solved?"primary":""}" data-act="exNav" data-d="1">Siguiente ejercicio</button>` : (phaseDone(t,"ex") ? (idx(t.id)<TOPICS.length-1?`<button class="btn primary" data-act="nextTopic">Tema siguiente</button>`:`<button class="btn primary" data-act="exam">Simulacro de examen</button>`) : "");
  return `<article class="panel">
    <div class="panel-top"><span>Ejercicio ${i+1} de ${t.ex.length}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <div class="ex-type">${TYPE_LABEL[e.type]}</div><h2 class="ex-title">${esc(e.t)}</h2>
    <div class="ex-prompt">${richText(e.prompt)}</div>
    ${inner}${fb}${hint}
    <div class="row" style="margin-top:14px">${actions}${tutorBtn}</div>
    <div id="tutorOut"></div>
    <div class="nav"><button class="btn" data-act="exNav" data-d="-1" ${i===0?"disabled":""}>Anterior</button>${nextBtn}</div>
  </article>`;
}
const normOut = s => s.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/^\n+|\n+$/g,"");
const normCode = s => s.replace(/\s+/g,"").replace(/"/g,"'");
function curEx(){ const t=T(VIEW.id); const e=t.ex[Math.min(TS.exi,t.ex.length-1)]; return {t,e,st:exState(t,e),key:t.id+"/"+e.id} }
function solveEx(t,e,st,key){
  const full = e.type==="write" ? (st.code.trim().length>20) : (!st.hint && !st.revealed);
  st.status="ok";
  if(!S.ex[key]){
    S.ex[key] = full?"full":"half";
    const xp = e.type==="write" ? (full?XP.write:XP.writeHalf) : (full?XP.ex:XP.exHalf);
    save(); addXP(xp);
    if(phaseDone(t,"ex")) setTimeout(()=>toast(topicDone(t)?"Tema completado":"Fase superada"),1900);
  }
  rerenderMain();
}
function checkEx(){
  const {t,e,st,key}=curEx();
  if(e.type==="predict"){
    st.tries++;
    if(normOut(st.val)===normOut(e.out)) return solveEx(t,e,st,key);
    const a=normOut(st.val).split("\n"), b=normOut(e.out).split("\n");
    st.status="no";
    if(!st.val.trim()) st.msg="Escribe la salida antes de comprobar.";
    else if(a.length!==b.length) st.msg=`El programa muestra ${b.length} ${b.length===1?"línea":"líneas"} y has escrito ${a.length}.`;
    else { const j=a.findIndex((l,k)=>l!==b[k]); st.msg=`La línea ${j+1} no es correcta.`; }
  } else if(e.type==="fill"){
    st.tries++;
    st.bad = e.blanks.map((acc,b)=>!acc.map(normCode).includes(normCode(st.vals[b]||"")));
    if(st.bad.every(x=>!x)) return solveEx(t,e,st,key);
    st.status="no"; const n=st.bad.filter(Boolean).length; st.msg = n===1?"Hay un hueco incorrecto (marcado en rojo).":`Hay ${n} huecos incorrectos (marcados en rojo).`;
  } else if(e.type==="order"){
    if(st.pool.length){ st.status="no"; st.msg="Todavía quedan líneas por colocar."; rerenderMain(); return }
    st.tries++;
    const j = st.ans.findIndex((li,k)=>e.lines[li]!==e.lines[k]);
    if(j===-1) return solveEx(t,e,st,key);
    st.status="no"; st.badPos=j; st.msg=`La primera línea fuera de lugar es la ${j+1}. Tócala para devolverla a la lista.`;
  }
  rerenderMain();
}
function revealEx(){
  const {t,e,st}=curEx(); st.revealed=true; st.status="reveal";
  if(e.type==="predict") st.revealHtml = `La salida es:${codeBlock(e.out,"txt")}`;
  else if(e.type==="fill") st.revealHtml = "Los huecos son: " + e.blanks.map((b,j)=>`<code class="ic">${esc(b[0])}</code>`).join(", ")+".";
  else if(e.type==="order") st.revealHtml = `El orden correcto es:${codeBlock(e.lines.join("\n"), e.lines.some(l=>/[=()'":]/.test(l))?"py":"txt")}`;
  else if(e.type==="bug") st.revealHtml = `El error está en la línea ${e.line+1}.`;
  else if(e.type==="choice") st.revealHtml = `La respuesta correcta es la ${"ABCD"[e.a]}: ${inl(e.opts[e.a])}.`;
  rerenderMain();
}

/* ---- tutor (Claude) ---- */
const COURSE_RULES = "Normas del curso (IOC, Programació en Python, ASIX): programación estructurada; prohibidos break, continue y try/except; exit(1) solo en el control de errores antes del programa principal; constantes en MAYÚSCULAS al principio; nombres de variables descriptivos en minúsculas con _; variables booleanas con nombre es_...; no comparar booleanos con == True; f-strings para formatear; input() sin texto de ayuda; legibilidad por encima de la eficiencia.";
async function askTutor(prompt){
  const out=$("#tutorOut"); if(!out) return;
  if(!TUTOR.fn || TUTOR.denied){ out.innerHTML=`<div class="tutor">El tutor no está disponible en esta vista.</div>`; return }
  if(TUTOR.ctrl){ try{TUTOR.ctrl.abort()}catch(e){} }
  const ctrl=new AbortController(); TUTOR.ctrl=ctrl;
  out.innerHTML=`<div class="tutor"><span class="who">Tutor</span><div id="tutorTxt" class="muted">Pensando…</div></div>`;
  try{
    await TUTOR.fn(prompt,{signal:ctrl.signal, modelTier:"default", onText:({text})=>{const el=$("#tutorTxt"); if(el){el.classList.remove("muted"); el.innerHTML=richText(text)}}});
  }catch(err){
    const el=$("#tutorTxt"); if(!el) return;
    if(err && err.code==="not_granted"){ TUTOR.denied=true; document.body.classList.remove("has-tutor"); el.textContent="Sin permiso para consultar al tutor. Puedes seguir con la solución modelo y la lista de comprobación." }
    else if(err && err.code==="rate_limited"){ el.textContent="Demasiadas consultas seguidas. Espera un poco y vuelve a intentarlo." }
    else if(err && err.name==="AbortError"){ }
    else el.textContent="No se ha podido contactar con el tutor ahora mismo.";
  }
}
function tutorCard(){
  const t=T(VIEW.id); const c=t.theory[Math.min(TS.card,t.theory.length-1)];
  askTutor(`Eres un tutor de Python muy paciente para un alumno adulto que nunca ha programado y prepara el examen del módulo de Python del IOC (el examen es en catalán). Responde en castellano, en un tono cercano, en un máximo de 180 palabras. Explica el concepto de la ficha siguiente de otra manera: una analogía de la vida cotidiana y un ejemplo de código muy corto (en un bloque \`\`\`). No introduzcas conceptos que no salgan en la ficha. ${COURSE_RULES}\n\nTema: ${t.title}\nFicha: ${c.t}\n\n${c.md}`);
}
function tutorCode(){
  const {t,e,st}=curEx();
  if(!st.code.trim()){ const out=$("#tutorOut"); if(out) out.innerHTML=`<div class="tutor">Escribe primero tu programa en el cuadro de texto.</div>`; return }
  const tests = e.tests.map(tc=>`entrada: ${tc.argv?("argumentos "+JSON.stringify(tc.argv)):JSON.stringify(tc.in)} -> salida: ${JSON.stringify(tc.out)}`).join("\n");
  askTutor(`Eres un profesor de Python del IOC que corrige el ejercicio de un alumno principiante. Responde en castellano, máximo 200 palabras, con esta estructura: 1) si el programa cumpliría el juego de pruebas (haz el seguimiento mental), 2) errores concretos indicando la línea, 3) un consejo de estilo según las normas del curso. No reescribas todo el programa; como mucho muestra la línea corregida. ${COURSE_RULES}\n\nEnunciado: ${e.prompt}\nEspecificaciones de entrada: ${e.ee||"-"}\nJuego de pruebas:\n${tests||"-"}\nSolución modelo (referencia, no la muestres entera):\n${e.solution}\n\nCódigo del alumno:\n${st.code}`);
}

/* ================= modal ================= */
function openCard(tid,cid){
  const t=T(tid); const c=t&&t.theory.find(x=>x.id===cid); if(!c) return;
  const L=$("#layer"); const prev=document.activeElement;
  const sc=document.createElement("div"); sc.className="scrim"; sc.dataset.act="closeModal";
  sc.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" style="--c:${ucol(t.unit)}">
    <div class="modal-top"><small>Tema ${idx(t.id)+1}: ${esc(t.title)}</small><button class="btn small" data-act="closeModal">Cerrar</button></div>
    <div class="md"><h2 id="mt">${esc(c.t)}</h2>${md(c.md)}</div></div>`;
  sc._prev=prev; L.appendChild(sc); sc.querySelector(".modal button").focus();
}
function closeModal(){ const sc=$(".scrim"); if(sc){ const p=sc._prev; sc.remove(); if(p&&p.focus) p.focus() } }

/* ================= events ================= */
function rerenderMain(){ const y=window.scrollY; render(); window.scrollTo({top:y}) }
function scrollPanel(){ const p=$(".panel"); if(p){ const top=p.getBoundingClientRect().top+window.scrollY-150; if(window.scrollY>top) window.scrollTo({top:Math.max(0,top)}) } }
document.addEventListener("click", ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="closeModal"){ if(ev.target===el || el.tagName==="BUTTON") closeModal(); return }
  if(el.getAttribute("aria-disabled")==="true" && a!=="lockedTopic" && a!=="lockedExam" && a!=="phase") return;
  switch(a){
    case "home": go({name:"home"}); break;
    case "openTopic": openTopic(el.dataset.id, el.dataset.phase); break;
    case "lockedTopic": toast("Termina el tema anterior para desbloquearlo"); break;
    case "lockedExam": toast("Completa todos los temas o activa el modo libre"); break;
    case "phase": {
      const t=T(VIEW.id), p=el.dataset.p;
      if(!unlocked(t,p)){ toast(p==="qz"?"Primero termina el temario":"Primero supera las respuestas (70%)"); break }
      if(p==="qz" && (!TS.quiz || TS.quiz.done)) TS.quiz=null;
      if(p==="ex"){ const f=t.ex.findIndex(x=>!S.ex[t.id+"/"+x.id]); TS.exi = f===-1?0:f }
      if(p==="th"){ TS.card = S.th[t.id]?0:(S.thPos[t.id]||0) }
      VIEW.phase=p; render(); window.scrollTo({top:0}); break;
    }
    case "card": {
      const t=T(VIEW.id); TS.card=Math.max(0,Math.min(t.theory.length-1, TS.card+ +el.dataset.d));
      if(!S.th[t.id]){ S.thPos[t.id]=Math.max(S.thPos[t.id]||0, TS.card); save() }
      render(); scrollPanel(); break;
    }
    case "finishTheory": {
      const t=T(VIEW.id);
      if(!S.th[t.id]){ S.th[t.id]=true; delete S.thPos[t.id]; save(); addXP(XP.theory) }
      TS.quiz=null; VIEW.phase="qz"; render(); window.scrollTo({top:0}); break;
    }
    case "pick": pick(+el.dataset.o); break;
    case "nextQ": nextQ(); break;
    case "retryQuiz": TS.quiz=null; render(); scrollPanel(); break;
    case "refCard": openCard(el.dataset.tid, el.dataset.cid); break;
    case "exam": startExam(); break;
    case "examNew": startExam(); break;
    case "review": startReview(); break;
    case "exNav": { const t=T(VIEW.id); TS.exi=Math.max(0,Math.min(t.ex.length-1,TS.exi+ +el.dataset.d)); render(); scrollPanel(); break }
    case "nextTopic": { const i=idx(VIEW.id); if(TOPICS[i+1]) openTopic(TOPICS[i+1].id); break }
    case "check": checkEx(); break;
    case "hint": { const {st}=curEx(); st.hint=true; rerenderMain(); break }
    case "reveal": revealEx(); break;
    case "ord": {
      const {t,e,st,key}=curEx(); if(S.ex[key]) break; const li=+el.dataset.li;
      if(el.dataset.w==="p"){ st.pool=st.pool.filter(x=>x!==li); st.ans.push(li) } else { st.ans=st.ans.filter(x=>x!==li); st.pool.push(li) }
      st.badPos=null; if(st.status==="no") st.status=null; rerenderMain(); break;
    }
    case "bugLine": {
      const {t,e,st,key}=curEx(); if(S.ex[key]||st.status==="ok") break; const l=+el.dataset.l; st.tries++;
      if(l===e.line){ st.badLine=null; solveEx(t,e,st,key) } else { st.badLine=l; st.status="no"; st.msg=`La línea ${l+1} es correcta. Búscalo en otra.`; rerenderMain() }
      break;
    }
    case "exChoice": {
      const {t,e,st,key}=curEx(); if(S.ex[key]||st.status==="ok") break; const o=+el.dataset.o; st.tries++;
      if(o===e.a){ st.badOpt=null; solveEx(t,e,st,key) } else { st.badOpt=o; st.status="no"; st.msg="Esta no es. Vuelve a leer el enunciado e inténtalo de nuevo."; rerenderMain() }
      break;
    }
    case "showSol": { const {st}=curEx(); st.shown=true; rerenderMain(); break }
    case "markWrite": { const {t,e,st,key}=curEx(); if(st.checks.every(Boolean)) solveEx(t,e,st,key); break }
    case "tutorCard": tutorCard(); break;
    case "tutorCode": tutorCode(); break;
    case "toggleFree": S.free=!S.free; save(); render(); break;
    case "reset": {
      if(el.dataset.armed!=="1"){ el.dataset.armed="1"; el.textContent="Pulsa de nuevo para borrarlo todo"; setTimeout(()=>{ if(el.isConnected){ el.dataset.armed="0"; el.textContent="Reiniciar el progreso" } },4000); break }
      const f=S.free; S=blank(); S.free=f; save(); toast("Progreso borrado"); go({name:"home"}); break;
    }
    case "closeLevel": el.closest(".levelup").remove(); break;
    case "exportProgress": exportProgress(); break;
    case "signIn": signIn(); break;
    case "signOut": signOut(); break;
    case "useLocal": useLocal(); break;
    case "gate": go({name:"gate"}); break;
    case "cloudChip": cloudChipClick(); break;
    case "importProgress": pickImport(); break;
    case "confirmImport": confirmImport(); break;
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target; const k=el.dataset&&el.dataset.in; if(!k||VIEW.name!=="topic") return;
  const {st}=curEx();
  if(k==="predict") st.val=el.value;
  else if(k==="fill"){ st.vals[+el.dataset.b]=el.value; el.classList.remove("no") }
  else if(k==="write") st.code=el.value;
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.id==="importFile"){ readImport(el.files&&el.files[0]); return } if(el.dataset&&el.dataset.in==="check"){ const {st}=curEx(); st.checks[+el.dataset.j]=el.checked; rerenderMain() }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape"){ if($(".scrim")) closeModal(); const lu=$(".levelup"); if(lu) lu.remove() }
  const el=ev.target;
  if(el.tagName==="TEXTAREA" && el.classList.contains("code")){
    if(ev.key==="Tab"){ ev.preventDefault(); const s=el.selectionStart, e=el.selectionEnd; el.setRangeText("    ",s,e,"end"); el.dispatchEvent(new Event("input",{bubbles:true})) }
    else if(ev.key==="Enter"){
      const s=el.selectionStart; const before=el.value.slice(0,s); const line=before.split("\n").pop();
      let ind=(line.match(/^ */)||[""])[0]; if(/:\s*$/.test(line)) ind+="    ";
      ev.preventDefault(); el.setRangeText("\n"+ind,s,el.selectionEnd,"end"); el.dispatchEvent(new Event("input",{bubbles:true}));
    }
  }
  if(el.tagName==="INPUT" && el.classList.contains("blank") && ev.key==="Enter"){ ev.preventDefault(); checkEx() }
});
function afterRender(){}

render();
loadGis();
</script>
